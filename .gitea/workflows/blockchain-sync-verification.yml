name: Blockchain Synchronization Verification

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/blockchain-node/**'
      - 'scripts/multi-node/**'
      - '.gitea/workflows/blockchain-sync-verification.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/blockchain-node/**'
      - 'scripts/multi-node/**'
      - '.gitea/workflows/blockchain-sync-verification.yml'
  workflow_dispatch:

concurrency:
  group: blockchain-sync-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-verification:
    runs-on: debian
    timeout-minutes: 20

    env:
      WORKSPACE: ${{ github.workspace }}
      # The public island, not the private 10.1.223.x nodes the script defaults to. Since
      # AITBC-136 this job runs on a separate runner with no route to those addresses, so
      # the check was reporting on infrastructure it could not reach. Override to point at
      # a different island; the script keeps the private defaults for on-host use.
      AITBC_NODES: "hub:https://hub.aitbc.bubuit.net"

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v4
      - name: Initialize job logging
        run: |
          cd "$GITHUB_WORKSPACE"
          bash scripts/ci/setup-job-logging.sh

      - name: Setup Python environment
        run: |
          cd "$GITHUB_WORKSPACE"

          # Remove any existing venv to avoid cache corruption issues
          rm -rf venv

          bash scripts/ci/setup-python-venv.sh \
            --repo-dir "$PWD" \
            --venv-dir "$PWD/venv" \
            --skip-requirements \
            --extra-packages "requests psutil"

      - name: Run blockchain synchronization verification
        run: |
          cd "$GITHUB_WORKSPACE"
          CHECK_CHAIN_ID_CONSISTENCY=false CHAINS="ait-mainnet,ait-testnet" bash scripts/multi-node/sync-verification.sh

      - name: Sync verification report
        if: always()
        run: |
          echo "=== Blockchain Synchronization Verification Report ==="
          if [ -f /var/log/aitbc/sync-verification.log ]; then
            tail -50 /var/log/aitbc/sync-verification.log
          fi
