name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: debian
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python venv
        run: |
          bash scripts/ci/setup-python-venv.sh \
            --cache-root /opt/gitea-runner/.cache/aitbc-venvs \
            --venv-dir ./venv \
            --extra-packages "-r requirements-dev.txt" \
            --mode copy

      - name: Install CLI package
        run: ./venv/bin/python -m pip install -q --force-reinstall --no-deps -e cli

      - name: MyPy clean apps
        run: |
          export PYTHON=./venv/bin/python
          bash scripts/ci/mypy-precommit.sh

      - name: No float money
        run: ./venv/bin/python scripts/lint/no_float_money.py

      - name: OpenAPI drift check
        run: |
          export PYTHON=./venv/bin/python
          bash scripts/ci/check-openapi-drift.sh

      - name: Unit tests
        env:
          PYTHON: ./venv/bin/python
          PYTHONPATH: apps/blockchain-node/src
          WALLET_URL: http://127.0.0.1:1
          BLOCKCHAIN_RPC_URL: http://127.0.0.1:1
        run: |
          ./venv/bin/python -m pytest -q \
            --deselect=apps/coordinator-api/tests/test_phase8_integration.py \
            --deselect=apps/coordinator-api/tests/test_zk_receipt.py \
            apps/coordinator-api/tests/test_*.py \
            apps/blockchain-node/tests \
            cli/tests

      - name: Live scenario dry-run
        run: bash scripts/ci/live-scenario-dry-run.sh
