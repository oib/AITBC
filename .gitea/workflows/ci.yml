name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: debian
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python venv
        run: |
          bash scripts/ci/setup-python-venv.sh \
            --cache-root /opt/gitea-runner/.cache/aitbc-venvs \
            --venv-dir /opt/gitea-runner/.cache/aitbc-venvs/job-venv \
            --extra-packages \
              "packages/py/aitbc-agent-core \
               packages/py/aitbc-agent-sdk \
               packages/py/aitbc-crypto \
               packages/py/aitbc-sdk \
               -r requirements-dev.txt" \
            --mode copy

      - name: Re-link repo-local editable packages
        run: |
          /opt/gitea-runner/.cache/aitbc-venvs/job-venv/bin/python -m pip install -q \
            -e packages/aitbc-shared \
            -e packages/py/aitbc-agent-core \
            -e packages/py/aitbc-agent-sdk \
            -e packages/py/aitbc-crypto \
            -e packages/py/aitbc-sdk

      - name: MyPy clean apps
        run: |
          export PYTHON=/opt/gitea-runner/.cache/aitbc-venvs/job-venv/bin/python
          bash scripts/ci/mypy-precommit.sh

      - name: No float money
        run: /opt/gitea-runner/.cache/aitbc-venvs/job-venv/bin/python scripts/lint/no_float_money.py

      - name: OpenAPI drift check
        run: |
          export PYTHON=/opt/gitea-runner/.cache/aitbc-venvs/job-venv/bin/python
          bash scripts/ci/check-openapi-drift.sh

      - name: Unit tests
        env:
          PYTHONPATH: apps/blockchain-node/src
        run: |
          /opt/gitea-runner/.cache/aitbc-venvs/job-venv/bin/python -m pytest -q \
            apps/coordinator-api/tests/test_*.py \
            apps/blockchain-node/tests \
            cli/tests

      - name: Live scenario dry-run
        run: bash scripts/ci/live-scenario-dry-run.sh
