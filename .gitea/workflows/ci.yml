name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: debian
    env:
      # The API key manager creates a file lock at import time. On a fresh runner
      # /var/lib/aitbc is not writable, so point it at /tmp.
      API_KEY_STORAGE_PATH: /tmp/aitbc-ci-api-keys.json
      AITBC_IPFS_DIR: /tmp/aitbc-ci-ipfs
      AITBC_ORACLE_DIR: /tmp/aitbc-ci-oracle
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python venv
        run: |
          bash scripts/ci/setup-python-venv.sh \
            --cache-root /opt/gitea-runner/.cache/aitbc-venvs \
            --venv-dir ./venv \
            --extra-packages "-r requirements-dev.txt" \
            --mode copy

      - name: Install CLI package
        run: ./venv/bin/python -m pip install -q --force-reinstall --no-deps -e cli

      - name: Lint
        continue-on-error: true
        run: |
          export PYTHON=./venv/bin/python
          make lint

      - name: No float money
        run: |
          export PYTHON=./venv/bin/python
          make no-float-money

      - name: Typecheck
        run: |
          export PYTHON=./venv/bin/python
          make typecheck

      - name: Unit tests
        env:
          PYTHON: ./venv/bin/python
          PYTHONPATH: apps/blockchain-node/src
        run: make test

      - name: OpenAPI drift check
        run: |
          export PYTHON=./venv/bin/python
          make openapi-check

      - name: CLI docs sync check
        run: |
          export PYTHON=./venv/bin/python
          bash scripts/ci/check-cli-docs.sh

      - name: App tests
        env:
          PYTHON: ./venv/bin/python
          PYTHONPATH: apps/blockchain-node/src
        run: make test-apps

      - name: CLI tests
        env:
          PYTHON: ./venv/bin/python
          WALLET_URL: http://127.0.0.1:1
          BLOCKCHAIN_RPC_URL: http://127.0.0.1:1
        run: make test-cli

      - name: Live scenario dry-run
        env:
          PYTHON: ./venv/bin/python
          WALLET_URL: http://127.0.0.1:1
          BLOCKCHAIN_RPC_URL: http://127.0.0.1:1
        run: make live-dry-run
