name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: debian
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python venv
        run: |
          bash scripts/ci/setup-python-venv.sh \
            --cache-root /opt/gitea-runner/.cache/aitbc-venvs \
            --mode copy

      - name: MyPy clean apps
        run: bash scripts/ci/mypy-precommit.sh

      - name: No float money
        run: ./venv/bin/python scripts/lint/no_float_money.py

      - name: OpenAPI drift check
        run: bash scripts/ci/check-openapi-drift.sh

      - name: Unit tests
        env:
          PYTHONPATH: apps/blockchain-node/src
        run: |
          ./venv/bin/python -m pytest -q \
            apps/coordinator-api/tests/test_*.py \
            apps/blockchain-node/tests \
            cli/tests

      - name: Live scenario dry-run
        run: bash scripts/ci/live-scenario-dry-run.sh
