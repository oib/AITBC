name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4

      - name: Set up Python venv
        run: |
          if [ ! -d ./venv ]; then
            bash scripts/ci/setup-python-venv.sh --mode copy
          fi

      - name: MyPy clean apps
        run: bash scripts/ci/mypy-precommit.sh

      - name: No float money
        run: ./venv/bin/python scripts/lint/no_float_money.py

      - name: OpenAPI drift check
        run: bash scripts/ci/check-openapi-drift.sh

      - name: Unit tests
        run: |
          ./venv/bin/python -m pytest -q \
            apps/coordinator-api/tests \
            apps/blockchain-node/tests \
            cli/tests

      - name: Live scenario dry-run
        run: bash scripts/ci/live-scenario-dry-run.sh
