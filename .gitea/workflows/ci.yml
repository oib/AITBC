name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: debian
    env:
      # The API key manager creates a file lock at import time. On a fresh runner
      # /var/lib/aitbc is not writable, so point it at /tmp.
      API_KEY_STORAGE_PATH: /tmp/aitbc-ci-api-keys.json
      AITBC_IPFS_DIR: /tmp/aitbc-ci-ipfs
      AITBC_ORACLE_DIR: /tmp/aitbc-ci-oracle
      PYTHON: ./venv/bin/python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Python 3.13.5+
        run: python3 -c "import sys; assert sys.version_info >= (3,13,5), f'Python {sys.version} is too old'"

      - name: Set up Python venv
        run: |
          bash scripts/ci/setup-python-venv.sh \
            --cache-root /opt/gitea-runner/.cache/aitbc-venvs \
            --venv-dir ./venv \
            --extra-packages "-r requirements-dev.txt" \
            --mode copy

      - name: Install CLI package
        run: ./venv/bin/python -m pip install -q --force-reinstall --no-deps -e cli

      - name: Install zk-circuits Node deps
        working-directory: apps/zk-circuits
        run: npm ci --no-audit --no-fund

      - name: Install contracts Node deps
        working-directory: contracts
        run: npm ci --no-audit --no-fund

      - name: Hardhat tests
        working-directory: contracts
        run: npx hardhat test

      - name: Version consistency check
        run: make version-check

      - name: Lint
        run: make lint-strict

      - name: No float money
        run: make no-float-money

      - name: Typecheck
        run: make typecheck

      - name: Unit tests
        env:
          PYTHONPATH: apps/blockchain-node/src
        run: make test

      - name: App tests
        env:
          PYTHONPATH: apps/blockchain-node/src
        run: make test-apps

      - name: Governance tests
        run: make test-governance

      - name: CLI tests
        env:
          WALLET_URL: http://127.0.0.1:1
          BLOCKCHAIN_RPC_URL: http://127.0.0.1:1
        run: make test-cli

      - name: OpenAPI drift check
        run: make openapi-check

      - name: CLI docs sync check
        run: bash scripts/ci/check-cli-docs.sh

      - name: Live scenario dry-run
        env:
          WALLET_URL: http://127.0.0.1:1
          BLOCKCHAIN_RPC_URL: http://127.0.0.1:1
        run: make live-dry-run
