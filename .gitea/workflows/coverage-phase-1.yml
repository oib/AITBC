name: Coverage Phase 1 (70% Target)

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/**/*.py'
      - 'packages/py/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.gitea/workflows/coverage-phase-1.yml'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: coverage-phase-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage-70:
    runs-on: debian
    timeout-minutes: 20

    env:
      WORKSPACE: ${{ github.workspace }}

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v4
      - name: Initialize job logging
        run: |
          cd "$GITHUB_WORKSPACE"
          bash scripts/ci/setup-job-logging.sh

      - name: Setup Python environment
        run: |
          cd "$GITHUB_WORKSPACE"

          rm -rf venv
          mkdir -p /var/lib/aitbc/data /var/lib/aitbc/keystore /etc/aitbc /var/log/aitbc

          grep -v '^-e ' requirements.txt > /tmp/requirements-ci.txt

          bash scripts/ci/setup-python-venv.sh \
            --repo-dir "$PWD" \
            --venv-dir "$PWD/venv" \
            --requirements-file /tmp/requirements-ci.txt \
            --mode copy \
            --extra-packages "pytest pytest-cov pytest-mock pytest-timeout pytest-asyncio locust pydantic-settings fastapi uvicorn aiohttp>=3.12.14 sqlmodel>=0.0.38 PyJWT filelock fakeredis"

          venv/bin/python -m pip install -q -e packages/aitbc-shared
          venv/bin/python -m pip install -q -e packages/py/aitbc-crypto
          venv/bin/python -m pip install -q -e packages/py/aitbc-sdk
          venv/bin/python -m pip install -q -e packages/py/aitbc-agent-sdk
          venv/bin/python -m pip install -q -e packages/py/aitbc-agent-core
          venv/bin/python -m pip install -q -e cli

      - name: Install packages
        run: |
          cd "$GITHUB_WORKSPACE"
          venv/bin/python -m pip install -q -e packages/aitbc-shared
          venv/bin/python -m pip install -q -e packages/py/aitbc-crypto
          venv/bin/python -m pip install -q -e packages/py/aitbc-sdk
          venv/bin/python -m pip install -q -e packages/py/aitbc-agent-sdk
          venv/bin/python -m pip install -q -e packages/py/aitbc-agent-core
          venv/bin/python -m pip install -q -e cli

      - name: Run tests with 70% coverage gate
        run: |
          cd "$GITHUB_WORKSPACE"

          export PYTHONPATH="$PWD/apps/coordinator-api/src:$PWD/apps/blockchain-node/src:$PWD/apps/wallet/src:$PWD/packages/aitbc-shared:$PWD/packages/py/aitbc-crypto/src:$PWD/packages/py/aitbc-sdk/src:$PWD/packages/py/aitbc-agent-sdk/src:$PWD/packages/py/aitbc-agent-core/src:$PWD/cli:$PWD:$PYTHONPATH"

          venv/bin/python -m pytest tests/ \
            -c /dev/null --rootdir "$PWD" --import-mode=importlib \
            --tb=short -q --timeout=30 \
            -o asyncio_mode=auto \
            --cov=apps --cov=packages --cov=cli \
            --cov-report=term-missing --cov-report=html \
            --cov-report=json:coverage.json \
            --cov-fail-under=70

      - name: Upload coverage artifact
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p coverage-artifacts
          cp coverage.json coverage-artifacts/
          cp htmlcov/index.html coverage-artifacts/coverage-summary.html
          echo "Coverage report uploaded to artifacts"

      - name: Count TODOs
        run: |
          cd "$GITHUB_WORKSPACE"
          TODO_COUNT=$(rg -c "TODO|FIXME" apps/ packages/py/ cli/ --type py 2>/dev/null | awk -F: '{sum+=$2} END {print sum+0}')
          echo "TODO_COUNT=${TODO_COUNT}" >> $GITHUB_ENV
          echo "Found ${TODO_COUNT} TODO/FIXME comments"

      - name: Publish coverage metrics
        run: |
          cd "$GITHUB_WORKSPACE"
          COVERAGE=$(python -c "import json; print(json.load(open('coverage.json')).get('totals', {}).get('percent_covered', 0))")
          echo "Coverage: ${COVERAGE}%"
          echo "TODOs: ${TODO_COUNT}"
