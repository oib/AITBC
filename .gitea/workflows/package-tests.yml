name: Package Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.gitea/workflows/package-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.gitea/workflows/package-tests.yml'
  workflow_dispatch:

concurrency:
  group: package-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-python-packages:
    name: Python package - ${{ matrix.package.name }}
    runs-on: debian
    timeout-minutes: 15

    strategy:
      matrix:
        package:
          # aitbc-core is at packages/aitbc-core, not under packages/py/. There is no delete
          # commit for packages/py/aitbc-core because it never existed -- the path was wrong
          # when written, so `cd` failed and this leg has been red on every run since.
          - name: "aitbc-core"
            path: "packages/aitbc-core"
          - name: "aitbc-crypto"
            path: "packages/py/aitbc-crypto"
          - name: "aitbc-sdk"
            path: "packages/py/aitbc-sdk"
          - name: "aitbc-agent-sdk"
            path: "packages/py/aitbc-agent-sdk"

    env:
      WORKSPACE: ${{ github.workspace }}

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v4
      - name: Initialize job logging
        run: |
          cd "$GITHUB_WORKSPACE"
          bash scripts/ci/setup-job-logging.sh

      - name: Setup and test package
        run: |
          # Report a missing matrix path by name rather than letting `cd` fail with
          # "No such file or directory" and no indication of which entry is stale.
          # Not `set -euo pipefail`: the steps below read $PYTHONPATH, which is often unset,
          # and `set -u` would abort on it.
          PACKAGE_DIR="$GITHUB_WORKSPACE/${{ matrix.package.path }}"
          if [[ ! -d "$PACKAGE_DIR" ]]; then
            echo "❌ ${{ matrix.package.path }} does not exist in this checkout"
            exit 1
          fi
          cd "$PACKAGE_DIR"
          echo "=== Testing ${{ matrix.package.name }} ==="
          echo "Directory: $(pwd)"
          ls -la

          # Ensure standard directories exist
          mkdir -p /var/lib/aitbc/data /var/lib/aitbc/keystore /etc/aitbc /var/log/aitbc

          # Remove any existing venv to avoid cache corruption issues
          rm -rf venv venv-build

          grep -v '^-e ' "$GITHUB_WORKSPACE/requirements.txt" > /tmp/requirements-ci.txt

          bash "$GITHUB_WORKSPACE/scripts/ci/setup-python-venv.sh" \
            --repo-dir "$PWD" \
            --venv-dir "$PWD/venv" \
            --requirements-file /tmp/requirements-ci.txt \
            --mode copy \
            --extra-packages "pytest mypy black pydantic-settings fastapi uvicorn httpx requests filelock"

          venv/bin/python -m pip install -q -e "$GITHUB_WORKSPACE/packages/aitbc-shared"
          venv/bin/python -m pip install -q -e "$GITHUB_WORKSPACE/packages/py/aitbc-agent-core"

          if [[ "${{ matrix.package.name }}" == "aitbc-sdk" ]]; then
            venv/bin/python -m pip install -q -e "$GITHUB_WORKSPACE/packages/py/aitbc-crypto"
          fi

          # Install dependencies
          if [[ -f "pyproject.toml" ]]; then
            venv/bin/python -m pip install -q -e ".[dev]" 2>/dev/null || venv/bin/python -m pip install -q -e .
          fi
          if [[ -f "requirements.txt" ]]; then
            venv/bin/python -m pip install -q -r requirements.txt
          fi

          # Verify package installation
          echo "=== Installed packages ==="
          venv/bin/python -m pip list | grep -i aitbc || true

          # Linting
          echo "=== Linting ==="
          if [[ -d "src" ]]; then
            venv/bin/python -m mypy src/ --ignore-missing-imports --no-error-summary 2>/dev/null || echo "⚠️ MyPy warnings"
            venv/bin/python -m black --check src/ 2>/dev/null || echo "⚠️ Black warnings"
          fi

          # Tests
          echo "=== Tests ==="
          if [[ -d "tests" ]]; then
            # Make package src first, then repo root for shared imports (e.g. `from aitbc import ...`)
            # Combined with `-c /dev/null`, this avoids monorepo pytest.ini path conflicts.
            export PYTHONPATH="$PWD/src:$GITHUB_WORKSPACE:$PYTHONPATH"
            export MYPYPATH="$PYTHONPATH"
            echo "=== Debug Info ==="
            echo "PWD: $PWD"
            echo "PYTHONPATH: $PYTHONPATH"
            echo "Package name: ${{ matrix.package.name }}"
            echo "=== Package Installation Status ==="
            venv/bin/python -m pip show aitbc-core || echo "aitbc-core not installed"
            echo "=== Import Test ==="
            venv/bin/python -c "import sys; print('Python paths:'); [print(p) for p in sys.path]"
            echo "=== Test Import ==="
            if [[ "${{ matrix.package.name }}" == "aitbc-core" ]]; then
              venv/bin/python -c "from aitbc.logging import StructuredLogFormatter; print('Import successful')" || echo "Import failed"
            else
              echo "Skipping aitbc.logging import check for ${{ matrix.package.name }}"
            fi
            echo "=== Running Tests ==="
            venv/bin/python -m pytest -o addopts="" --rootdir "$PWD" --import-mode=importlib tests/ -q --tb=short
          else
            echo "⚠️ No tests directory found"
          fi

          echo "✅ ${{ matrix.package.name }} testing completed"

      - name: Build package
        run: |
          cd "$GITHUB_WORKSPACE/${{ matrix.package.path }}"

          if [[ -f "pyproject.toml" ]]; then
            bash "$GITHUB_WORKSPACE/scripts/ci/setup-python-venv.sh" \
              --repo-dir "$PWD" \
              --venv-dir "$PWD/venv-build" \
              --skip-requirements \
              --extra-packages "build"

            venv-build/bin/python -m build
            echo "✅ Package built"
          fi

  test-javascript-packages:
    name: JavaScript packages (pnpm workspace)
    runs-on: debian
    timeout-minutes: 30

    env:
      WORKSPACE: ${{ github.workspace }}

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v4
      - name: Initialize job logging
        run: |
          cd "$GITHUB_WORKSPACE"
          bash scripts/ci/setup-job-logging.sh

      - name: Setup and test workspace
        run: |
          set -euo pipefail

          # This job used to iterate a matrix of packages/js/aitbc-sdk and
          # packages/solidity/aitbc-token, both deleted in 6f4c4779d. The step opened with
          # `if [[ ! -f package.json ]]; then echo skipping; exit 0; fi`, so both legs
          # skipped and the job was green while testing nothing -- the same defect the
          # matrix in smart-contract-tests.yml was fixed for, in the workflow next to it.
          #
          # The surviving JS packages are not standalone directories: they are members of
          # the pnpm workspace rooted at packages/, where @aitbc/web depends on
          # @aitbc/theme-provider by "workspace:*". So drive them through the root once
          # rather than cd-ing into each.
          cd "$GITHUB_WORKSPACE"/packages

          # Membership is the thing that can silently rot here, so assert it rather than
          # discovering a member has vanished by testing nothing.
          for member in theme-provider web; do
            if [[ ! -f "$member/package.json" ]]; then
              echo "❌ packages/$member/package.json is missing -- workspace member gone?"
              exit 1
            fi
          done

          echo "Node: $(node --version), pnpm: $(pnpm --version)"

          # pnpm, not npm: npm rejects the "workspace:*" protocol outright
          # (EUNSUPPORTEDPROTOCOL). --frozen-lockfile so the installed tree is the one
          # pnpm-lock.yaml describes, rather than a fresh resolution nothing has audited
          # (V23-27a). Note contracts/ is the opposite case and uses npm ci.
          pnpm install --frozen-lockfile

          # -r excludes the workspace root, so the root's own `pnpm -r` scripts do not recurse.
          pnpm -r --if-present run build
          echo "✅ Build passed"

          pnpm -r --if-present run lint
          echo "✅ Lint passed"

          pnpm -r --if-present run test
          echo "✅ Tests passed"

          echo "✅ JavaScript workspace completed"
