name: Python Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'aitbc/**'
      - 'apps/**/*.py'
      - 'packages/py/**'
      - 'tests/**'
      # cli/ is both tested by this job (tests/cli) and covered by the money guard, but
      # was not a trigger: a CLI-only change ran neither. scripts/lint/ is here so that
      # editing the guard or its baseline re-runs the guard.
      - 'cli/**'
      - 'scripts/lint/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.gitea/workflows/python-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'aitbc/**'
      - 'apps/**/*.py'
      - 'packages/py/**'
      - 'tests/**'
      - 'cli/**'
      - 'scripts/lint/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.gitea/workflows/python-tests.yml'
  workflow_dispatch:

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-python:
    runs-on: debian
    timeout-minutes: 15

    env:
      WORKSPACE: ${{ github.workspace }}

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v4
      - name: Initialize job logging
        run: |
          cd "$GITHUB_WORKSPACE"
          bash scripts/ci/setup-job-logging.sh

      - name: Setup Python environment
        run: |
          cd "$GITHUB_WORKSPACE"

          # Remove any existing venv to avoid cache corruption issues
          rm -rf venv

          # Ensure standard directories exist
          mkdir -p /var/lib/aitbc/data /var/lib/aitbc/keystore /etc/aitbc /var/log/aitbc

          # ponytail: install the bulk of dependencies from requirements.txt without the
          # local editable aitbc-shared line, then install each local package below.
          grep -v '^-e ' requirements.txt > /tmp/requirements-ci.txt

          bash scripts/ci/setup-python-venv.sh \
            --repo-dir "$PWD" \
            --venv-dir "$PWD/venv" \
            --requirements-file /tmp/requirements-ci.txt \
            --mode copy \
            --extra-packages "pytest pytest-cov pytest-mock pytest-timeout pytest-asyncio locust pydantic-settings fastapi uvicorn aiohttp>=3.12.14 sqlmodel>=0.0.38 PyJWT filelock fakeredis"

          venv/bin/python -m pip install -q -e packages/aitbc-shared
          venv/bin/python -m pip install -q -e packages/py/aitbc-crypto
          venv/bin/python -m pip install -q -e packages/py/aitbc-sdk
          venv/bin/python -m pip install -q -e packages/py/aitbc-agent-sdk
          venv/bin/python -m pip install -q -e packages/py/aitbc-agent-core
          venv/bin/python -m pip install -q -e cli

          echo "✅ Python environment ready"

      - name: Run linting
        run: |
          cd "$GITHUB_WORKSPACE"

          if venv/bin/python -m ruff --version >/dev/null 2>&1; then
            venv/bin/python -m ruff check apps/ packages/py/ --select E,F --ignore E501 -q || echo "⚠️ Ruff warnings"
          fi

          echo "✅ Linting completed"

      - name: Money must be Decimal
        # Deliberately not `|| true` like the ruff step above: this one fails the build.
        # It reports only violations absent from scripts/lint/no_float_money_baseline.json,
        # so the pre-existing backlog cannot break CI and a newly introduced float amount
        # can. Before this the guard existed but was wired into nothing.
        run: |
          cd "$GITHUB_WORKSPACE"
          venv/bin/python scripts/lint/no_float_money.py

      - name: Run repository tests with coverage
        run: |
          cd "$GITHUB_WORKSPACE"

          # Install packages in development mode
          venv/bin/python -m pip install -q -e packages/aitbc-shared
          venv/bin/python -m pip install -q -e packages/py/aitbc-crypto
          venv/bin/python -m pip install -q -e packages/py/aitbc-sdk
          venv/bin/python -m pip install -q -e packages/py/aitbc-agent-sdk
          venv/bin/python -m pip install -q -e packages/py/aitbc-agent-core
          venv/bin/python -m pip install -q -e cli

          export PYTHONPATH="$PWD/apps/coordinator-api/src:$PWD/apps/blockchain-node/src:$PWD/apps/wallet/src:$PWD/packages/aitbc-shared:$PWD/packages/py/aitbc-crypto/src:$PWD/packages/py/aitbc-sdk/src:$PWD/packages/py/aitbc-agent-sdk/src:$PWD/packages/py/aitbc-agent-core/src:$PWD/cli:$PWD:$PYTHONPATH"

          venv/bin/python -m pytest \
            tests/cross_phase/ \
            tests/verification/ \
            -c /dev/null --rootdir "$PWD" --import-mode=importlib \
            --tb=short -q --timeout=30 \
            -o asyncio_mode=auto \
            --cov=apps --cov=packages --cov=cli --cov-append \
            --cov-report=term-missing --cov-report=html \
            --cov-fail-under=50

      - name: Run app and package tests with coverage
        run: |
          cd "$GITHUB_WORKSPACE"

          export PYTHONPATH="$PWD/apps/coordinator-api:$PWD/apps/coordinator-api/src:$PWD/packages/aitbc-shared:$PWD/packages/py/aitbc-crypto/src:$PWD/packages/py/aitbc-sdk/src:$PWD/packages/py/aitbc-agent-core/src:$PWD/cli:$PWD:$PYTHONPATH"

          # Test if packages are importable
          venv/bin/python -c "import aitbc_crypto; print('✅ aitbc_crypto imported')"
          venv/bin/python -c "import aitbc_sdk; print('✅ aitbc_sdk imported')"
          venv/bin/python -c "import src.app; print('✅ coordinator-api src.app imported')"
          venv/bin/python -c "import app; print('✅ coordinator-api app imported')"

          venv/bin/python -m pytest \
            packages/py/aitbc-crypto/tests/ \
            packages/py/aitbc-sdk/tests/ \
            -c /dev/null --rootdir "$PWD" --import-mode=importlib \
            --tb=short -q --timeout=30 \
            --cov=apps --cov=packages --cov=cli --cov-append

          venv/bin/python -m coverage report --show-missing
          venv/bin/python -m coverage xml

          echo "✅ Python tests completed with coverage"

      - name: Run additional pytest suites
        run: |
          cd "$GITHUB_WORKSPACE"

          export PYTHONPATH="$PWD/apps/coordinator-api/src:$PWD/apps/blockchain-node/src:$PWD/apps/wallet/src:$PWD/packages/aitbc-shared:$PWD/packages/py/aitbc-crypto/src:$PWD/packages/py/aitbc-sdk/src:$PWD/packages/py/aitbc-agent-sdk/src:$PWD/packages/py/aitbc-agent-core/src:$PWD/cli:$PWD:$PYTHONPATH"

          # ponytail: tests/cli/services/security/production and
          # apps/blockchain-node/tests run in separate pytest invocations
          # because the blockchain-node and coordinator-api both define a
          # SQLModel `Transaction(table=True)` class; loading both in the
          # same process corrupts the shared SQLAlchemy declarative registry.
          venv/bin/python -m pytest \
            tests/cli \
            tests/services \
            tests/security \
            tests/production \
            -c /dev/null --rootdir "$PWD" --import-mode=importlib \
            --tb=short -q --timeout=30 \
            -o asyncio_mode=auto

          venv/bin/python -m pytest \
            apps/blockchain-node/tests \
            -c /dev/null --rootdir "$PWD" --import-mode=importlib \
            --tb=short -q --timeout=30 \
            -o asyncio_mode=auto

          echo "✅ Additional pytest suites completed"
