name: Smart Contract Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/solidity/**'
      - 'apps/zk-circuits/**'
      - 'contracts/**'
      - '.gitea/workflows/smart-contract-tests.yml'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: smart-contract-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-solidity:
    runs-on: debian
    timeout-minutes: 15

    strategy:
      matrix:
        project:
          # packages/solidity/aitbc-token was deleted in 6f4c4779d; the matrix entry
          # outlived it and `cd` into the missing path failed the job on every run.
          - name: "aitbc-contracts"
            path: "contracts"

    env:
      WORKSPACE: ${{ github.workspace }}

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v4
      - name: Initialize job logging
        run: |
          cd "$GITHUB_WORKSPACE"
          bash scripts/ci/setup-job-logging.sh

      # Runs before the install, because the thing it catches makes the install meaningless
      # (V23-27a): a second lockfile means `npm audit` and the installed tree describe
      # different things.
      #
      # This note used to say the runner keeps a persistent checkout where a stray
      # pnpm-lock.yaml survives between jobs. That was true of the /opt/aitbc model and is
      # not true now -- AITBC-136 moved to actions/checkout, so every job starts clean and
      # that particular route is closed. What remains is a lockfile committed to the tree,
      # or one a build step writes during the job, and both are worth failing on.
      - name: Check package-manager artifacts
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 scripts/ci/check-package-managers.py

      - name: Setup and test
        run: |
          set -euo pipefail

          PROJECT_DIR="$GITHUB_WORKSPACE/${{ matrix.project.path }}"
          if [[ ! -d "$PROJECT_DIR" ]]; then
            echo "❌ ${{ matrix.project.path }} does not exist in this checkout"
            exit 1
          fi
          cd "$PROJECT_DIR"
          echo "=== Testing ${{ matrix.project.name }} ==="

          # Ensure standard directories exist
          mkdir -p /var/lib/aitbc/data /var/lib/aitbc/keystore /etc/aitbc /var/log/aitbc

          if [[ ! -f "package.json" ]]; then
            echo "⚠️ No package.json, skipping"
            exit 0
          fi

          echo "Node: $(node --version), npm: $(npm --version)"

          # npm, not pnpm (V23-28). package.json declares packageManager: npm, which makes
          # corepack refuse pnpm here; and only package-lock.json is tracked, so `pnpm
          # install` resolved fresh every run and installed something no lockfile described.
          # `npm ci` installs exactly the tree that `npm audit` in V23-27 measures.
          npm ci --no-audit --no-fund

          # Compile
          if [[ -f "hardhat.config.js" ]] || [[ -f "hardhat.config.ts" ]]; then
            npx hardhat compile
            echo "✅ Compiled"
            npx hardhat test
            echo "✅ Tests passed"
          elif [[ -f "foundry.toml" ]]; then
            forge build
            echo "✅ Compiled"
            forge test
            echo "✅ Tests passed"
          else
            if node -e "const pkg=require('./package.json'); process.exit(pkg.scripts && pkg.scripts.compile ? 0 : 1)"; then
              npm run compile
              echo "✅ Compiled"
            elif node -e "const pkg=require('./package.json'); process.exit(pkg.scripts && pkg.scripts.build ? 0 : 1)"; then
              npm run build
              echo "✅ Compiled"
            else
              echo "❌ No compile or build script found"
              exit 1
            fi

            if node -e "const pkg=require('./package.json'); process.exit(pkg.scripts && pkg.scripts.test ? 0 : 1)"; then
              npm test
              echo "✅ Tests passed"
            else
              echo "❌ No test script found"
              exit 1
            fi
          fi

          echo "✅ ${{ matrix.project.name }} completed"

  test-foundry:
    runs-on: debian
    timeout-minutes: 20

    env:
      WORKSPACE: ${{ github.workspace }}

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v4
      - name: Initialize job logging
        run: |
          cd "$GITHUB_WORKSPACE"
          bash scripts/ci/setup-job-logging.sh

      - name: Install Foundry
        run: |
          if ! command -v forge &> /dev/null; then
            curl -L https://foundry.paradigm.xyz | bash
            export PATH="$HOME/.foundry/bin:$PATH"
            foundryup
            export PATH="$HOME/.foundry/bin:$PATH"
          fi
          forge --version

      - name: Test contracts with Foundry
        run: |
          export PATH="$HOME/.foundry/bin:$PATH"
          cd "$GITHUB_WORKSPACE/contracts"

          # Ensure standard directories exist
          mkdir -p /var/lib/aitbc/data /var/lib/aitbc/keystore /etc/aitbc /var/log/aitbc

          echo "=== Running Foundry Tests ==="

          # Install OpenZeppelin dependencies (v4.9.6 for compatibility with existing imports)
          forge install OpenZeppelin/openzeppelin-contracts
          cd lib/openzeppelin-contracts && git checkout v4.9.6 && cd ../..
          echo "✅ OpenZeppelin dependencies installed (v4.9.6)"

          # Build contracts
          forge build
          echo "✅ Foundry build completed"

          # Run tests
          forge test
          echo "✅ Foundry tests passed"

          # Run fuzz tests
          forge test --match-path "test/fuzz/**/*.t.sol"
          echo "✅ Foundry fuzz tests passed"

  lint-solidity:
    runs-on: debian
    timeout-minutes: 10

    env:
      WORKSPACE: ${{ github.workspace }}

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v4
      - name: Initialize job logging
        run: |
          cd "$GITHUB_WORKSPACE"
          bash scripts/ci/setup-job-logging.sh

      - name: Lint contracts
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          # Ensure standard directories exist
          mkdir -p /var/lib/aitbc/data /var/lib/aitbc/keystore /etc/aitbc /var/log/aitbc

          # packages/solidity/aitbc-token was deleted in 6f4c4779d; the -d guard meant this
          # loop skipped it silently rather than reporting the dead entry.
          for project in contracts; do
            if [[ -d "$project" ]] && [[ -f "$project/package.json" ]]; then
              echo "=== Linting $project ==="
              cd "$project"

              npm ci --no-audit --no-fund

              if node -e "const pkg=require('./package.json'); process.exit(pkg.scripts && pkg.scripts.lint ? 0 : 1)"; then
                npm run lint
                echo "✅ Lint passed"
              else
                echo "⚠️ No lint script for $project, skipping"
              fi
              cd "$GITHUB_WORKSPACE"
            fi
          done

          echo "✅ Solidity linting completed"

  deploy-contracts:
    runs-on: debian
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    env:
      WORKSPACE: ${{ github.workspace }}

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v4
      - name: Initialize job logging
        run: |
          cd "$GITHUB_WORKSPACE"
          bash scripts/ci/setup-job-logging.sh

      - name: Deploy contracts to localhost
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/contracts"

          # Ensure standard directories exist
          mkdir -p /var/lib/aitbc/data /var/lib/aitbc/keystore /etc/aitbc /var/log/aitbc

          echo "=== Deploying Contracts to Localhost ==="

          # npm, not pnpm -- see the note in test-solidity above (V23-28).
          npm ci --no-audit --no-fund

          # Compile contracts
          npx hardhat compile

          # Start local node in background
          npx hardhat node &
          NODE_PID=$!
          sleep 10

          # Deploy contracts
          npx hardhat run scripts/deploy-automation.js --network localhost
          echo "✅ Contracts deployed successfully"

          # Verify deployment
          DEPLOYMENT_FILE="deployments-localhost.json" npx hardhat run scripts/verify-deployment.js --network localhost
          echo "✅ Deployment verified"

          # Cleanup
          kill $NODE_PID 2>/dev/null || true
