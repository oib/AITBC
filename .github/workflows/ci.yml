name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: venv
          key: venv-${{ hashFiles('requirements.txt', 'pyproject.toml') }}

      - name: Install dependencies
        run: |
          python3 -m venv venv
          ./venv/bin/python -m pip install -q --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then
            ./venv/bin/python -m pip install -q -r requirements.txt
          fi
          ./venv/bin/python -m pip install -q -e .

      - name: Install local packages
        run: |
          if [ -f requirements-dev.txt ]; then
            ./venv/bin/python -m pip install -q -r requirements-dev.txt
          fi
          for pkg in packages/aitbc-shared packages/py/aitbc-agent-core packages/py/aitbc-agent-sdk packages/py/aitbc-crypto packages/py/aitbc-sdk cli; do
            if [ -d "$pkg" ]; then
              ./venv/bin/python -m pip install -q --force-reinstall --no-deps -e "$pkg"
            fi
          done

      - name: MyPy clean apps
        env:
          PYTHON: ./venv/bin/python
        run: bash scripts/ci/mypy-precommit.sh

      - name: No float money
        run: ./venv/bin/python scripts/lint/no_float_money.py

      - name: OpenAPI drift check
        env:
          PYTHON: ./venv/bin/python
        run: bash scripts/ci/check-openapi-drift.sh

      - name: Unit tests
        env:
          PYTHON: ./venv/bin/python
          PYTHONPATH: apps/blockchain-node/src
        run: |
          "$PYTHON" -m pytest -q \
            --deselect=apps/coordinator-api/tests/test_phase8_integration.py \
            --deselect=apps/coordinator-api/tests/test_zk_receipt.py \
            apps/coordinator-api/tests/test_*.py \
            apps/blockchain-node/tests

      - name: CLI tests
        env:
          WALLET_URL: http://127.0.0.1:1
          BLOCKCHAIN_RPC_URL: http://127.0.0.1:1
        run: |
          "$PYTHON" -m pytest -q cli/tests

      - name: Live scenario dry-run
        env:
          WALLET_URL: http://127.0.0.1:1
          BLOCKCHAIN_RPC_URL: http://127.0.0.1:1
        run: bash scripts/ci/live-scenario-dry-run.sh
