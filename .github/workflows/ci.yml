name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # The API key manager creates a file lock at import time. On a fresh runner
      # /var/lib/aitbc is not writable, so point it at /tmp.
      API_KEY_STORAGE_PATH: /tmp/aitbc-ci-api-keys.json
      AITBC_IPFS_DIR: /tmp/aitbc-ci-ipfs
      AITBC_ORACLE_DIR: /tmp/aitbc-ci-oracle
      PYTHON: ./venv/bin/python
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13.5
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'

      - name: Cache venv
        uses: actions/cache@v6
        with:
          path: venv
          key: venv-${{ hashFiles('requirements.txt', 'pyproject.toml') }}

      - name: Install dependencies
        run: |
          python3 -m venv venv
          ./venv/bin/python -m pip install -q --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then
            ./venv/bin/python -m pip install -q -r requirements.txt
          fi
          ./venv/bin/python -m pip install -q -e .

      - name: Install local packages
        run: |
          if [ -f requirements-dev.txt ]; then
            ./venv/bin/python -m pip install -q -r requirements-dev.txt
          fi
          for pkg in packages/aitbc-shared packages/py/aitbc-agent-core packages/py/aitbc-agent-sdk packages/py/aitbc-crypto packages/py/aitbc-sdk cli; do
            if [ -d "$pkg" ]; then
              ./venv/bin/python -m pip install -q --force-reinstall --no-deps -e "$pkg"
            fi
          done

      - name: Version consistency check
        run: make version-check

      - name: Lint
        run: make lint-strict

      - name: No float money
        run: make no-float-money

      - name: Typecheck
        run: make typecheck

      - name: Unit tests
        env:
          PYTHONPATH: apps/blockchain-node/src
        run: make test

      - name: App tests
        env:
          PYTHONPATH: apps/blockchain-node/src
        run: make test-apps

      - name: Governance tests
        run: make test-governance

      - name: CLI tests
        env:
          WALLET_URL: http://127.0.0.1:1
          BLOCKCHAIN_RPC_URL: http://127.0.0.1:1
        run: make test-cli

      - name: OpenAPI drift check
        run: make openapi-check

      - name: CLI docs sync check
        run: bash scripts/ci/check-cli-docs.sh

      - name: Live scenario dry-run
        env:
          WALLET_URL: http://127.0.0.1:1
          BLOCKCHAIN_RPC_URL: http://127.0.0.1:1
        run: make live-dry-run
