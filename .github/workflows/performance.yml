name: Performance Regression

on:
  push:
    branches: [main, develop]
    paths:
      - 'aitbc/**'
      - 'apps/blockchain-node/src/**'
      - 'apps/blockchain-node/tests/test_performance.py'
      - '.github/workflows/performance.yml'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  performance:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        run: pip install uv
      - name: Install project dependencies
        run: uv sync --dev
      - name: Run performance benchmarks
        run: |
          cd apps/blockchain-node
          uv run pytest tests/test_performance.py -q -o addopts="" -m slow --tb=short
      - name: Run parallel performance benchmarks
        run: |
          cd apps/blockchain-node
          uv run pytest tests/test_parallel_performance.py -q -o addopts="" -m slow --tb=short || echo "Parallel performance tests skipped or failed (non-blocking)"
