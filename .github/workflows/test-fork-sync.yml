name: Fork Sync Compatibility

# Ensures upstream changes never silently break downstream forks.
# Tests sync --dry-run against known fork manifest fixtures (rendertrust + keryk-ai).
#
# Note: Generic suite runs (manifest-loader, rename-diff, substitutions, protected-files, preflight)
# are now part of the full test matrix in .github/workflows/tests.yml (runs on all PRs, both OS).
# This workflow keeps its path-based triggering for focused fork-sync testing.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-claude-harness.sh'
      - '.harness-manifest.schema.json'
      - 'tests/fixtures/sync/**'
      - 'tests/tooling/test-fork-sync.sh'
      - '.github/workflows/test-fork-sync.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/sync-claude-harness.sh'
      - '.harness-manifest.schema.json'
      - 'tests/fixtures/sync/**'
      - 'tests/tooling/test-fork-sync.sh'
      - '.github/workflows/test-fork-sync.yml'

jobs:
  fork-sync-compat:
    name: Fork Sync Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run fork sync compatibility tests
        run: bash tests/tooling/test-fork-sync.sh
