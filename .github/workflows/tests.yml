name: Full Test Suite Matrix

# Runs all test suites on multiple platforms to ensure cross-OS compatibility.
# Triggered on all PRs to main and pushes to main branch.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # Both OS legs are REQUIRED/blocking (ABS-34): a failure on either fails
      # the check. fail-fast:false keeps both legs reporting so a macOS-only
      # bash-3.2/BSD regression and a Linux failure are never masked by each other.
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run test suite
        id: test_run
        run: |
          # Color codes
          GREEN='\033[0;32m'
          RED='\033[0;31m'
          YELLOW='\033[1;33m'
          CYAN='\033[0;36m'
          NC='\033[0m'

          # Track results (bash-3.2 compatible: use string accumulation instead of associative array)
          PASS=0
          FAIL=0
          RESULT_NAMES=""
          RESULT_STATUSES=""

          # Discover all test suites dynamically so suites added by future
          # PRs are picked up automatically (no hardcoded list to go stale)
          TESTS=(tests/tooling/test-*.sh)

          echo -e "${CYAN}=== Running Test Suite on ${{ matrix.os }} ===${NC}\n"

          # Run each test suite
          for test in "${TESTS[@]}"; do
            test_name=$(basename "$test" .sh)
            echo -e "${CYAN}--- ${test_name} ---${NC}"

            if bash "$test" > /tmp/test_output.txt 2>&1; then
              echo -e "  ${GREEN}PASS${NC} ${test_name}\n"
              RESULT_NAMES="${RESULT_NAMES}${test_name}"$'\n'
              RESULT_STATUSES="${RESULT_STATUSES}PASS"$'\n'
              ((PASS++))
            else
              echo -e "  ${RED}FAIL${NC} ${test_name}"
              echo "  Last 10 lines of output:"
              tail -10 /tmp/test_output.txt | sed 's/^/    /'
              echo ""
              RESULT_NAMES="${RESULT_NAMES}${test_name}"$'\n'
              RESULT_STATUSES="${RESULT_STATUSES}FAIL"$'\n'
              ((FAIL++))
            fi
          done

          # Print summary table
          TOTAL=$((PASS + FAIL))
          echo -e "\n${CYAN}=== Test Summary ===${NC}"
          echo ""
          printf "%-40s %s\n" "Test" "Result"
          printf "%-40s %s\n" "---" "---"

          # Reconstruct results from parallel arrays
          i=1
          while IFS= read -r test_name; do
            [ -z "$test_name" ] && continue
            result=$(echo "$RESULT_STATUSES" | sed -n "${i}p")
            if [ "$result" = "PASS" ]; then
              printf "%-40s ${GREEN}%s${NC}\n" "$test_name" "$result"
            else
              printf "%-40s ${RED}%s${NC}\n" "$test_name" "$result"
            fi
            ((i++))
          done <<< "$RESULT_NAMES"

          echo ""
          echo "Total:   $TOTAL"
          echo -e "${GREEN}Passed:  $PASS${NC}"
          if [ $FAIL -gt 0 ]; then
            echo -e "${RED}Failed:  $FAIL${NC}"
          fi
          echo ""

          # Exit non-zero if any test failed
          if [ $FAIL -gt 0 ]; then
            echo -e "${RED}TEST SUITE FAILED${NC}"
            exit 1
          fi

          echo -e "${GREEN}ALL TESTS PASSED${NC}"
          exit 0

      - name: Report results
        if: always()
        run: |
          if [ "${{ steps.test_run.outcome }}" = "success" ]; then
            echo "All tests passed on ${{ matrix.os }}"
          else
            echo "Some tests failed on ${{ matrix.os }}"
            exit 1
          fi
