# =============================================================================
# GitLab CI — Governance sensors on the LIVE remote [PILOT-59 / epic PILOT-58]
# =============================================================================
# WHY THIS FILE EXISTS.
# The governance sensors used to run ONLY in GitHub Actions (.github/workflows/).
# The active push remote is GitLab (gitlab.haemosan.at) and Bitbucket is only a
# release mirror (PILOT-25 doctrine), so on the remote that actually gates merges
# NO sensor ran. Proof, 2026-07-25 on epic/PILOT-28-poll-to-push: three ADR
# guards plus the knob guard were RED and would have ridden the epic MR into main
# — only a manual operator run caught it. The local full-suite gate at the epic
# integration point does not structurally close the gap (ABS-557).
#
# This pipeline runs the FAST governance sensors (each finishes in seconds) on
# GitLab, on EVERY push and on every merge request. A red job blocks the MR from
# merging once "Pipelines must succeed" is enabled on the target branch (that
# branch-protection toggle is a human-only setting — ADR-A-0004 — and is the one
# operator step this file cannot perform for itself).
#
# SENSOR -> PATH MATRIX (see docs/ci-cd/GOVERNANCE_SENSOR_ENFORCEMENT.md):
#   adr-id-uniqueness  tests/test-adr-id-uniqueness.sh
#   adr-status         tests/test-adr-status.sh
#   rule-ledger        scripts/rule-ledger-check.sh
#   knob-doc-drift     scripts/orch-knob-doc-drift.sh
#   skills-parity      .github/scripts/check-skills-parity.sh
#
# Each sensor is its own job so its status is independently visible: a duplicate
# ADR number turns ONLY adr-id-uniqueness red, which is the AC3 falsification.
# These sensors are pure bash + coreutils/findutils/awk (no Python, no network,
# no repo mutation), so the image only needs those tools. gawk is installed to
# match the GNU awk that the GitHub runners use.
# =============================================================================

image: debian:stable-slim

# Run on branch pushes AND merge requests, but never both at once (avoid the
# duplicate detached-vs-branch pipeline). Canonical GitLab MR-pipeline pattern.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - governance

.governance:
  stage: governance
  before_script:
    # debian:stable-slim already ships bash + coreutils/findutils/grep/sed; only
    # gawk is added, to match the GNU awk the GitHub runners use (these sensors
    # are reliability-critical, so avoid mawk quirks reintroducing a silent gap).
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends gawk >/dev/null

adr-id-uniqueness:
  extends: .governance
  script:
    - bash tests/test-adr-id-uniqueness.sh

adr-status:
  extends: .governance
  script:
    - bash tests/test-adr-status.sh

rule-ledger:
  extends: .governance
  script:
    - bash scripts/rule-ledger-check.sh

knob-doc-drift:
  extends: .governance
  script:
    - bash scripts/orch-knob-doc-drift.sh

skills-parity:
  extends: .governance
  script:
    - bash .github/scripts/check-skills-parity.sh
