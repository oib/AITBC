repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.(svg|png|jpg|ico|woff|woff2|ttf|eot)$
      - id: end-of-file-fixer
        exclude: \.(svg|png|jpg|ico|woff|woff2|ttf|eot)$
      - id: check-yaml
        exclude: apps/blockchain-node/observability/
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
      # Kept, but it only inspects files while git is mid-merge -- see
      # scripts/ci/check-merge-markers.py, which runs on every commit. This one catches the
      # conflict you are resolving; that one catches the one already committed.
      - id: check-merge-conflict
      - id: debug-statements
        exclude: cli/templates/.*|tests/cli/.*
      - id: check-toml
      - id: check-xml
      - id: check-case-conflict
      - id: check-ast
        exclude: cli/templates/.*|tests/cli/.*

  # Ruff: linting and formatting (replaces Black, isort, flake8, pydocstyle, pyupgrade)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix, --unsafe-fixes, --exit-non-zero-on-fix]
        exclude: cli/templates/.*|tests/cli/.*|mutants/.*
        stages: [pre-commit]
      - id: ruff-format
        exclude: cli/templates/.*|tests/cli/.*|mutants/.*
        stages: [pre-commit]

  # MyPy type checking on the 12 clean apps
  - repo: local
    hooks:
      - id: mypy-apps
        name: mypy-clean-apps
        entry: bash scripts/ci/mypy-precommit.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # Conflict markers that survived a bad resolution (V23-23 note)
  - repo: local
    hooks:
      - id: check-merge-markers
        name: check-committed-merge-markers
        entry: python3 scripts/ci/check-merge-markers.py
        language: system
        types: [text]
        stages: [pre-commit]

  # Shell strict mode, as a ratchet on scripts being touched (V23-23)
  - repo: local
    hooks:
      - id: shell-strict-mode
        name: require-set-euo-pipefail-in-touched-scripts
        entry: python3 scripts/ci/check-shell-strict-mode.py
        language: system
        types: [shell]
        stages: [pre-commit]

  # A directory installing with one package manager while another's lockfile sits next to it
  # (V23-27a). Scans the working tree, not the index: the lockfile that caused V23-27a was
  # untracked and .gitignore'd, so a tracked-files check would never have seen it.
  - repo: local
    hooks:
      - id: check-package-managers
        name: check-package-manager-artifacts
        entry: python3 scripts/ci/check-package-managers.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # Documentation validation
  - repo: local
    hooks:
      - id: validate-docs
        name: validate-documentation-links
        entry: bash scripts/validate_docs.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # Type ignore validation
  - repo: local
    hooks:
      - id: check-type-ignores
        name: check-undocumented-type-ignores
        entry: bash scripts/ci/check-type-ignores.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # Security checks with Bandit (only on pre-push to save time)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -r, ., -x, cli/templates, tests/cli, tests/]
        additional_dependencies: ["bandit[toml]"]
        pass_filenames: false
        stages: [pre-push]
