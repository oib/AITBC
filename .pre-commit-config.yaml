# `pre-commit install` with no arguments installs the pre-commit hook and nothing else, so
# for as long as bandit was the only `stages: [pre-push]` entry here, it was never wired to
# anything: .git/hooks/pre-push in every clone belonged to git-lfs. Every document in the
# repo that tells you how to set this up -- the developer guide, the installation guide,
# AGENTS.md, the setup skill -- says the bare `pre-commit install`, which is why nobody
# noticed. Naming the types here makes that command install both (V23-85).
#
# Installing over git-lfs's hook is safe: pre-commit moves an existing hook to
# `pre-push.legacy` and runs it before its own, so `git lfs pre-push` keeps happening.
# `commit-msg` is deliberately absent -- no hook below declares that stage, and installing
# it would displace the hand-written PILOT-79 ticket-tag guard for no gain.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.(svg|png|jpg|ico|woff|woff2|ttf|eot)$
      - id: end-of-file-fixer
        exclude: \.(svg|png|jpg|ico|woff|woff2|ttf|eot)$
      - id: check-yaml
        exclude: apps/blockchain-node/observability/
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
      # Kept, but it only inspects files while git is mid-merge -- see
      # scripts/ci/check-merge-markers.py, which runs on every commit. This one catches the
      # conflict you are resolving; that one catches the one already committed.
      - id: check-merge-conflict
      - id: debug-statements
        exclude: cli/templates/.*|tests/cli/.*
      - id: check-toml
      - id: check-xml
      - id: check-case-conflict
      - id: check-ast
        exclude: cli/templates/.*|tests/cli/.*

  # Ruff: linting and formatting (replaces Black, isort, flake8, pydocstyle, pyupgrade)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix, --unsafe-fixes, --exit-non-zero-on-fix]
        exclude: cli/templates/.*|tests/cli/.*|mutants/.*
        stages: [pre-commit]
      - id: ruff-format
        exclude: cli/templates/.*|tests/cli/.*|mutants/.*
        stages: [pre-commit]

  # MyPy type checking on the 12 clean apps
  - repo: local
    hooks:
      - id: mypy-apps
        name: mypy-clean-apps
        entry: bash scripts/ci/mypy-precommit.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # Conflict markers that survived a bad resolution (V23-23 note)
  - repo: local
    hooks:
      - id: check-merge-markers
        name: check-committed-merge-markers
        entry: python3 scripts/ci/check-merge-markers.py
        language: system
        types: [text]
        stages: [pre-commit]

  # Shell strict mode, as a ratchet on scripts being touched (V23-23)
  - repo: local
    hooks:
      - id: shell-strict-mode
        name: require-set-euo-pipefail-in-touched-scripts
        entry: python3 scripts/ci/check-shell-strict-mode.py
        language: system
        types: [shell]
        stages: [pre-commit]

  # A directory installing with one package manager while another's lockfile sits next to it
  # (V23-27a). Scans the working tree, not the index: the lockfile that caused V23-27a was
  # untracked and .gitignore'd, so a tracked-files check would never have seen it.
  - repo: local
    hooks:
      - id: check-package-managers
        name: check-package-manager-artifacts
        entry: python3 scripts/ci/check-package-managers.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # Documentation validation
  - repo: local
    hooks:
      - id: validate-docs
        name: validate-documentation-links
        entry: bash scripts/validate_docs.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # Type ignore validation
  - repo: local
    hooks:
      - id: check-type-ignores
        name: check-undocumented-type-ignores
        entry: bash scripts/ci/check-type-ignores.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # Money must be Decimal (CLAUDE.md). Fails only on violations not already in
  # scripts/lint/no_float_money_baseline.json, so the existing backlog does not block
  # commits while new float money does. ~2s over the whole tree.
  - repo: local
    hooks:
      - id: no-float-money
        name: no-float-money
        entry: python3 scripts/lint/no_float_money.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # docs/api/*-openapi.json is generated from the apps, and the guard that says so existed
  # for a release before anything invoked it -- it was red on main that whole time (V23-82).
  #
  # `files:` is measured, not guessed: generating the specs imports 593 repo-local modules,
  # and this pattern is the set of prefixes they live under. Scoping to `apps/*/src/` alone,
  # the obvious choice, would have missed the 127 files in aitbc/ and packages/py/ that
  # define the shared models the schemas are built from -- including the money fields whose
  # Decimal conversion was one of the three drifts found. tests/unit/test_openapi_drift_guard.py
  # re-derives that import set and fails if this pattern stops covering it.
  #
  # ~6s, and it fires on roughly a quarter of commits.
  - repo: local
    hooks:
      - id: openapi-drift
        name: openapi-specs-match-the-apps
        entry: bash scripts/ci/check-openapi-drift.sh
        language: system
        pass_filenames: false
        files: ^(aitbc/|packages/py/|apps/(agent-coordinator|blockchain-node|coordinator-api|marketplace|wallet)/src/|scripts/(extract_openapi_specs|openapi_error_responses)\.py)
        stages: [pre-commit]

  # Security checks with Bandit (only on pre-push to save time).
  #
  # The args used to read `-x, cli/templates, tests/cli, tests/`. `-x` takes one
  # comma-separated value, so `tests/cli` and `tests/` landed after a positional that
  # argparse had already filled with `.`, and bandit answered
  #
  #     bandit: error: unrecognized arguments: tests/cli tests/
  #
  # with exit code 2 -- before reading a file. The hook could not have passed on any input.
  # Nobody saw it because nothing installed it (see default_install_hook_types above).
  #
  # The exclusions now live in [tool.bandit] in pyproject.toml, which is where `-c` has been
  # pointing all along; there was no such section until V23-85. Keeping them there means one
  # place to edit and `bandit -c pyproject.toml -r .` by hand agrees with the hook.
  #
  # `--severity-level medium` is the gate. At `all` the repo reports 3,837 findings, 3,388
  # of them `assert` in test files and most of the rest B404 ("you imported subprocess") and
  # B603 ("you called subprocess without a shell"), which is the safe form. A gate that
  # reports four thousand things blocks nothing. Medium and above was 36 findings when this
  # was turned on and is 0 now, so the next one to appear is the one that blocks the push.
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -r, ., --severity-level, medium]
        additional_dependencies: ["bandit[toml]"]
        pass_filenames: false
        stages: [pre-push]
