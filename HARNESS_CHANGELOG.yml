    summary: "Orchestrator hardening & speed (epic ABS-111). The runner gains async background spawns so ORCH_MAX_CONCURRENT finally has real effect (legacy synchronous scheduler restored via ORCH_ASYNC_SPAWNS=0); session-resume that keeps the SAME Claude session across rework bounces, re-reviews, and handoff-repair within one task until the story passes acceptance (sessions dropped on entry into Merging/Done), retries always staying fresh; handoff-repair + status-evidence success (a missing handoff is re-requested over a 4-turn resume, and a ticket that demonstrably left its spawn status has its handoff synthesized instead of a phantom crash); a depends_on gate that rests a story with an unfinished prerequisite at Ready for Development/Design; runner-provisioned git worktrees (one tmp/<ticket>-work on branch <ticket>-auto per implementer spawn, handed to the seam via ORCH_SPAWN_CWD) so a spawn physically cannot touch the main checkout; per-seat turn/model overrides (ORCH_MAX_TURNS_<ROLE> / ORCH_MODEL_<ROLE>); and observability — timestamped log lines, a structured TSV run.log event stream, retained spawn stderr on failure, and SKIP-UNLABELLED throttled to once per ticket per run. Also lands the Jira /rest/api/3/search/jql migration (CHANGE-2046 410 fix); the literal-\\n artifact in posted handoffs is killed at its root by the orchestrator's tracker-agnostic json_unescape, with adapters posting the already-decoded body verbatim (real newlines -> ADF paragraphs). Agent defs gain a mandatory 'Context Sequence (MANDATORY, ADR-A-0003)' section and issue-enrichment now writes a <=2 KB Context Pack (references, not full text). All ABS-111 seams default on; set the matching env var to 0 to restore legacy behavior. Backward-compatible: legacy test suites pin the synchronous scheduler."
    upgrade_doc: null
    changes:

      # --- ABS-111 A1/A2/A2c/C7/C8/C9/A3/B6/D11/D12: orchestrator runner ---
      - path: "scripts/orchestrator.sh"
        category: UPDATED_FILE
        change_type: modified
        description: "A1 async spawns: spawn_dispatch backgrounds the attempt->retry->record sequence in a subshell holding the single-flight lock; live_spawn_count reaps dead pids so ORCH_MAX_CONCURRENT caps in-flight background jobs; wait_for_spawns drains on --once and every loop-exit path. A2 session resume: a session store under work/.orchestrator/sessions/ keyed per (ticket,role,status) (session id parsed from the CLI JSON), resumed on rework bounces / re-reviews via ORCH_RESUME_SESSION_ID; retries stay fresh; clear_sessions drops the store on entry into Merging/Done (acceptance ends the resume scope). A2c/C7 handoff repair: a missing handoff is re-requested over a 4-turn session resume, and status-evidence (ticket left the spawned status) synthesizes a handoff (INTENT SYNTH-HANDOFF) instead of a phantom SPAWN-CRASH. C8 depends_on gate: depends_unmet holds Ready for Development/Design dispatch while a declared dependency is not Done (INTENT DEPENDS-WAIT); ORCH_DEPENDS_GATING=0 disables. C9 worktrees: ensure_worktree provisions tmp/<ticket>-work on branch <ticket>-auto under a serialized git-worktree-add lock, passed to the seam as ORCH_SPAWN_CWD for implementer spawns; provisioning FAILS CLOSED (INTENT SKIP-NOWORKTREE rests the ticket for the reconcile sweep to retry) so a spawn never falls back to the main checkout; ORCH_WORKTREE_SPAWNS=0 disables. A3/B6 per-seat overrides: role_env resolves ORCH_MAX_TURNS_<ROLE> / ORCH_MODEL_<ROLE> (role uppercased, dashes to underscores). D11 observability: runlog writes a timestamped TSV run.log (ts, kind, ticket, role, to, note) mirroring every intent/log; spawn stderr is captured to a file and kept on failure. D12: SKIP-UNLABELLED is emitted once per ticket per run (run.log still records every occurrence). C10 root fix: json_unescape decodes \\n/\\t/\\\" in the extracted handoff (extract_handoff_from_result) before it is posted, tracker-agnostically — adapters post the already-decoded body verbatim."
