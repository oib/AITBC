    summary: "Autonomie-Release aus v3-Pilot #8 (Backend-Epic PILOT-71, 12 Stories): die Defekte, die JEDEN Run Geld kosten. (1) DER KONTROLLZUSTAND WANDERT AUS KOMMENTAREN IN TYPISIERTE FELDER — `iteration_cap` ist ein Backend-Feld (Migration 022) statt eines Marker-Kommentars, womit die ADR-A-0026-Vertagung geschlossen ist und die Wurzel des Iterations-Cap-Defekts entfaellt: ein QAS-Seat konnte den Cap des Operators bisher mit einem routinemaessigen 'Iteration 1 of 1' ueberschreiben (ABS-579, Operator-Auflage: Migration nur gegen eine Scratch-DB getestet, fail-soft wenn das Feld fehlt, Rollout attended). (2) ZWEI CHURN-SCHLEIFEN GESCHLOSSEN, die messbar Geld verbrannten: Blocked-Auto-Release und Re-Block bildeten eine unbegrenzte Schleife (13 Zyklen, 12 Spawns, 9,53 USD ohne jeden Fortschritt, ABS-574), und der Ops-Sweep-Report wurde nicht persistiert, obwohl der Runner 'kept' loggte — das blockierte die Phase-0-Abnahme des Janitors und liess fuenf Sweeps pro Nacht wirkungslos laufen (ABS-578). (3) STATUS BEHAUPTET KEINE ARBEIT MEHR, DIE NUR LOKAL EXISTIERT: Vorwaerts-Transitionen pruefen den Push (ABS-581, vier belegte Faelle mit 13 offenen Branches), die Merge-Erkennung greift auch bei parentless Stories im Epic-Branch, und der Status-Kollektor liest Marker-INHALT statt Marker-Existenz und faellt nicht mehr still auf mock-tracker.sh zurueck (ABS-580 — er hatte dem Operator zweimal MOCK-Daten als echt gemeldet). (4) GOVERNANCE MIT VOLLZUG: ein commit-msg-Guard erzwingt den `[PREFIX-XXX]`-Ticket-Tag auf Story-Branches, mit ausdruecklicher Exempt-Klasse fuer Operator-/Release-Commits (ABS-591 — die Konvention stand seit immer in CONTRIBUTING.md und nichts prueefte sie; ein untagged Commit kann die Bisect->Story-Zuordnung des RTE aushebeln), `spawn_id` ist eindeutig (ABS-590: alle ops-sweep-Spawns eines Runs teilten dieselbe Id, womit jede open/close-Paarung nur zufaellig stimmte), und der Runner verweigert einen Live-Start, wenn der governierende Harness-Checkout N