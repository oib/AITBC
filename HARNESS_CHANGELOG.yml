  - version: "2.17.0"
    date: "2026-07-05"
    summary: "ABS-92: stable-governs-dev operating mode (Phase 1). Two optional orchestrator seams (ORCH_TARGET_REPO / ORCH_HARNESS_HOME) let a pinned stable checkout's scripts run against a separate dev repo as the work target; a SessionStart wrong-entry guard + dev-session.sh launcher enforce/ease governed interactive sessions. Isolation is agent-definitions-only in Phase 1 (spawns keep cwd = dev repo). Both seams unset -> today's single-repo behavior, byte-for-byte. ABS-96: the SHIPPED harness (.claude/ agents/skills/commands/hooks/docs/templates) now has a product-namespace SOURCE at harness/claude/ so it can be edited as inert work product off the live config path; the live .claude/ keeps a byte-identical copy (source of truth = harness/claude, generation deferred to Phase 2b). Sync gains harness/claude as an allowed domain (legacy .claude stays listed + byte-identical at any tag); the spawn seam prefers harness/claude/agents with a .claude/agents fallback. Consuming-project bootstrap output is byte-identical; no consumer action required."
    changes:

      # --- NEW_FILE ---
      - path: "scripts/session-wrong-entry-guard.sh"
        category: NEW_FILE
        change_type: added
        description: "SessionStart guard for stable-governs-dev mode. Refuses a BARE interactive session launched inside the dev repo when a same-product stable checkout exists (exit 2 with the correct launch recipe -- scripts/dev-session.sh or ORCH_TARGET_REPO=<dev> <stable>/scripts/orchestrator.sh). Fires ONLY when ALL hold: (a) a stable root resolves (ORCH_HARNESS_HOME, else ~/boilerplate-stable) and is a different physical dir than this repo; (b) the stable root's git origin URL equals this repo's origin URL (identity check -- a silent no-op in consuming projects with an unrelated ~/boilerplate-stable); (c) cwd == this dev repo; (d) NO spawn markers set (ORCH_ROLE and ORCH_PACKET_FILE both empty -- headless orchestrator spawns run with cwd = dev repo and MUST NOT be blocked, AC H3b). Exits 0 silently otherwise. Escape hatch: SAW_GUARD_DISABLE=1. Physical-path (pwd -P) comparisons throughout so a symlinked /tmp does not defeat the same-dir/cwd checks. bash 3.2 + BSD tools only."
        breaking: false

      - path: "scripts/dev-session.sh"
        category: NEW_FILE
        change_type: added
        description: "Human ergonomics launcher for a governed interactive session (ABS-92). Resolves the stable/harness root (ORCH_HARNESS_HOME > ~/boilerplate-stable > die with instructions), takes the dev repo as its own repo root, verifies both exist and share the same git origin URL (same product), prints a one-line provenance header, then cd stable && exec claude --add-dir <dev repo>. Rules load from stable; the dev repo is added as a work dir. bash 3.2 safe; extra args are forwarded to claude."
        breaking: false

      - path: "tests/test-wrong-entry-guard.sh"
        category: NEW_FILE
        change_type: added
