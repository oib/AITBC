  - version: "2.14.0"
    date: "2026-07-04"
    summary: "Unreleased -- ABS-62: reconciliation-sweep stall detection mechanically raises 'Needs PO Decision' on silently stuck tickets"
    changes:

      # --- UPDATED FILES ---
      - path: "scripts/orchestrator.sh"
        category: UPDATED_FILE
        change_type: modified
        description: "Add mechanical, bash-only stall detection inside the reconciliation sweep: rule 1 (undecomposed epic in Backlog older than ORCH_STALL_EPIC_SECONDS, default 900) and rule 2 (opt-in Backlog resting age, ORCH_STALL_RESTING_SECONDS, default 0=off). A fired rule raises 'Needs PO Decision' (actor orchestrator, rule-naming kind:decision comment) which the ABS-61 mapping routes to a fresh PO-Agent; dry-run logs INTENT STALL-RAISE only. Unified cross-rule re-raise guard: the stall marker is matched only inside an anchored actor:orchestrator kind:decision comment body (prose quoting the marker does not disarm detection), and suppression applies ONLY when the PO has parked the ticket back via a Needs PO Decision -> Backlog transition, lifting when updated: is strictly newer than that park (an edit after the park re-arms). A marker without a park (PO routed onward then deprioritized back, or a half-raise whose transition failed) stays eligible so detection never deadlocks. Honors the ticket's updated: contract and prevents an infinite loop across both rules. Two new env knobs documented in the header block."
        breaking: false

      - path: "docs/sop/ORCHESTRATOR_SOP.md"
        category: METHODOLOGY
        change_type: modified
        description: "Add ORCH_STALL_EPIC_SECONDS and ORCH_STALL_RESTING_SECONDS to the env-knob table (defaults + meaning) and a 'Stall Detection (ABS-62)' section documenting the two rules, the raise, and the re-raise guard."
        breaking: false

      - path: "tests/test-orchestrator.sh"
        category: UPDATED_FILE
        change_type: modified
        description: "New ABS-62 scenarios: aged bare epic in Backlog -> raised exactly once (dry-run INTENT STALL-RAISE; live transition + rule-naming kind:decision comment); second sweep and PO 'leave it in Backlog' round trip do not re-raise; edit-after-park re-arms and re-raises (updated: contract); cross-rule (both knobs on) rule-1 raise+park is not re-flagged by rule 2; PO routed onward then deprioritized back to Backlog re-raises (no park); half-raise (marker but failed transition) is retried; prose merely quoting the marker does not disarm detection (anchored match); disable knob suppresses; rule 2 opt-in; non-Backlog / childed / young epics untouched."
        breaking: false

    migration_notes:
      - "Purely additive and default-safe: rule 1 keys on an aged, childless
         Backlog epic (rare) and rule 2 ships disabled (ORCH_STALL_RESTING_SECONDS=0).
         No new processes, no LLM analysis -- detection is bash inside the existing
         sweep; judgment stays with a fresh PO-Agent via the ABS-61 event path."

