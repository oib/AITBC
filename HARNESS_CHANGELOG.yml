  - version: "2.16.0"
    date: "2026-07-04"
    summary: "Unreleased -- ABS-64: Jira Cloud task-tracking adapter (scripts/jira-tracker.sh) -- a drop-in $TRACKER_CMD implementing the nine canonical operations against Jira REST v3, CLI-identical to the mock adapter so the orchestrator runs unmodified"
    changes:

      # --- NEW_FILE ---
      - path: "scripts/jira-tracker.sh"
        category: NEW_FILE
        change_type: added
        description: "Jira Cloud REST v3 task-tracking adapter. Implements the nine canonical operations (get/search/create/update/comment/transition/link/children/events) with a CLI surface -- subcommands, flags, output shapes, exit codes, error messages -- byte-mirroring scripts/mock-tracker.sh, so scripts/orchestrator.sh runs unmodified with TRACKER_CMD=scripts/jira-tracker.sh (orchestrator.sh untouched). Zero-dependency posture: bash + curl + python3 -c for JSON parse/serialize and ADF wrap/unwrap (NO jq). Design highlights: plain text is wrapped into minimal ADF for description/comment bodies and unwrapped back on read; comment kind+actor are encoded in a '[kind: <k> | actor: <a>]' first-body-line header so get reconstructs the mock's '### <at> | kind: <k> | actor: <a>' dump line the orchestrator stall-detection guard parses; transition resolves the target status name to its per-issue Jira transition id; role is stored as a role:<name> label; events keeps a status snapshot at work/.jira-events-state (gitignored) and diffs one JQL sweep of JIRA_PROJECT_KEY (+ optional JIRA_JQL_FILTER) per poll, emitting the mock's exact {ticket_id, from, to, at} lines. All emitted timestamps (created:/updated:/comment '### <at>' headers) are normalized from Jira-native form (millis + numeric offset, e.g. .000+0530) to the mock's canonical UTC 'Z' form via jira_ts_to_z, because the orchestrator's iso_to_epoch parses only %Y-%m-%dT%H:%M:%SZ -- without this the ABS-62 stall rules never fire and a PO-parked ticket would re-raise every sweep. Every value interpolated into a quoted JQL literal (project key, search flags, epic id) is escaped via jql_quote (backslash then double-quote); JIRA_JQL_FILTER is documented as a trusted, deliberately-verbatim operator fragment. Known limitation (documented in header + SOP): search/events sweeps are single-page (maxResults=200, no pagination) -- keep fenced sweeps under 200 issues. Credentials (JIRA_SITE/JIRA_EMAIL/JIRA_API_TOKEN/JIRA_PROJECT_KEY) are human-provisioned, never stored in the repo, delivered to curl via a mode-600 --config file (never argv), and scrubbed from all output/error/trace."
        breaking: false

      - path: "tests/test-jira-tracker.sh"
        category: NEW_FILE
        change_type: added
        description: "Two-tier conformance test for the Jira adapter. Offline contract tier (CI, no network, no creds): a curl shim on $JIRA_CURL serves canned Jira REST responses; covers all nine ops' argument parsing and output shapes, asserts CLI parity with mock-tracker.sh (identical arity/flag-value/standalone-validation error messages; shape parity for the usage banner and ticket-scoped semantic messages), and runs a credential-leak scan (a known dummy token + its base64 Basic-auth encoding must be absent from all output/error paths, including forced HTTP-500 and curl-failure paths). Includes a JQL-escaping contract test (--text with an embedded double-quote must produce well-formed, escaped JQL in the request body) and an orchestrator-compatibility tier that extracts the REAL stall helpers from scripts/orchestrator.sh (guarded extraction that fails loudly if the function layout changes) and asserts iso_to_epoch parses every timestamp in a jira get dump and last_po_park_epoch/has_orchestrator_stall_marker work against it. Live smoke tier: minimal get+search against the fenced project, run ONLY when JIRA_LIVE_TOKEN is set and skipped cleanly otherwise (CI skips it)."
        breaking: false

      - path: "tests/fixtures/jira-curl-shim.sh"
        category: NEW_FILE
        change_type: added
        description: "Canned-response curl shim for the offline Jira contract tier. Mimics the adapter's curl invocation surface (--config/-sS/-o/-w/-X/--data-binary), writes canned Jira REST v3 JSON to the -o file, prints the HTTP code, and never performs network I/O. Keeps minimal state (issue counter, status-override) to make create->get->search->events flows coherent and to drive the events snapshot-diff test. Deliberately ignores the --config credential file, proving the adapter delivers auth out-of-band."
        breaking: false

      # --- UPDATED_FILE ---
      - path: "docs/sop/ORCHESTRATOR_SOP.md"
        category: UPDATED_FILE
        change_type: modified
        description: "New 'Jira Cloud Binding (ABS-64)' section (inserted before Stall Detection; the Stall Detection and Known Limitations sections are untouched): TRACKER_CMD binding instructions, the env-var table (JIRA_SITE/JIRA_EMAIL/JIRA_API_TOKEN/JIRA_PROJECT_KEY/JIRA_JQL_FILTER), fencing guidance (first live runs MUST be fenced via JIRA_JQL_FILTER, e.g. labels = orchestrator-live), the human status-mapping prerequisite (the ten canonical statuses to configure in the Jira workflow, 1:1 no folding), a first-run safety checklist (dry-run, single fenced ticket, low ORCH_MAX_SPAWNS_PER_RUN), the API-call budget note (one JQL sweep per events poll), a timestamp-normalization paragraph (UTC Z for stall-detection compatibility), and the single-page fence ceiling (keep fenced sweeps under 200 issues)."
        breaking: false

      - path: ".gitignore"
        category: UPDATED_FILE
        change_type: modified
        description: "Ignore work/.jira-events-state -- the Jira adapter's per-poll status snapshot (runtime state, reconstructible from a fresh JQL sweep), alongside the existing work/.events-state mock-adapter ignore."
        breaking: false

    migration_notes:
      - "Additive: a new optional tracker adapter plus its tests and one SOP
         section. scripts/orchestrator.sh is unchanged (git diff empty) and the
         existing suites are untouched and green (mock 95, orchestrator 77, e2e
         dry-run 38). The adapter is inert until a human provisions JIRA_* creds
         and binds TRACKER_CMD=scripts/jira-tracker.sh. Live-smoke ACs (real
         dry-run against Jira, real events detection) remain blocked on
         human-provisioned credentials and Jira workflow statuses; the live test
         tier exists and skips cleanly until JIRA_LIVE_TOKEN is set."

