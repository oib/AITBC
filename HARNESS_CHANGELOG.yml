    summary: "Vollzugs-Release aus v3-Pilot #7 (Backend-Epic PILOT-58, 12 Stories in ~6 h): das Thema ist durchgehend 'die Regel existierte, wirkte aber nicht'. (1) GOVERNANCE-SENSOREN LAUFEN AUF DEM LIVE-REMOTE — bisher liefen sie nur in GitHub Actions, waehrend GitLab der Remote ist, der Merges tatsaechlich gattert; belegt am 2026-07-25 auf epic/PILOT-28, wo drei ADR-Guards plus der Knob-Guard rot waren und in main geritten waeren, wenn kein Operator manuell geprueft haette. Neu: .gitlab-ci.yml mit fuenf Einzeljobs, damit jeder Sensor unabhaengig sichtbar rot wird (ABS-559). ACHTUNG: die Pipeline hat noch KEINEN Runner, alle Jobs sterben im Stuck-Timeout — Registrierung ist Operator-Arbeit (ABS-593), und 'Pipelines must succeed' darf erst DANACH aktiviert werden, sonst blockiert es jede kuenftige MR inklusive der, die den Runner-Fix bringt. (2) DER ITERATIONS-CAP IST NICHT MEHR AGENTEN-SCHREIBBAR: ein QAS-Seat konnte mit einem routinemaessigen 'Iteration 1 of 1' die Anhebung des Operators ueberschreiben — der Defekt war selbsterneuernd und kein Env-Knopf half, weil Marker ueber Konfiguration gewinnen (ABS-564). (3) Kein Release-Gate haengt mehr unbegrenzt: portabler Per-Suite-Watchdog, bash-nativ (stock macOS hat weder timeout(1) noch gtimeout), nachdem ein SIGTERM-ignorierender Daemon den Gate eine Stunde blockiert hatte — eine verklemmte Suite ist jetzt ein BENANNTER Fehlschlag (ABS-573). (4) Zaehler messen wieder Arbeit statt Pech: fehlgeschlagene Admissions kosten kein Spawn-Budget (ABS-563), Worktree-Provisionierungs-Fehlversuche werden begrenzt mit Backoff und Eskalation statt 125 Spawns zu verbrennen, plus ein post-checkout-Guard gegen den Haupt-Checkout auf einem Story-Branch (ABS-567), Turn-Caps sind aus der Messung kalibriert statt geraten (ABS-565). (5) Ein leerlaufender Test ist ein Defekt: der Sandbox-Guard-Negativtest lag unter einem gitignorierten Pfad und konnte nie fehlschlagen — die Reparatur legte sofort eine echte Auslassung offen, die er verdeckt hatte (ABS-576). Dazu die rote Prune-Suite geschlossen (ABS-575) und die Merge-Erkennung fuer parentless Stories in Epic-Branches (ABS-568). (6) Taxonomien mit Wirkung statt Prosa: die transient-Klasse aus ADR-A-0018 hat jetzt einen Effekt, die Advisory-Klasse aus ADR-A-0024 wird gezaehlt (ABS-571), Rule-Ledger-Fehlzuordnungen sind korrigiert und ADR-A-0010 mandatiert kein Phantom-Artefakt mehr (ABS-570). (7) Erstmals belastbare Token-Telemetrie im Betrieb: der ABS-554-Fix aus v2.32.0 hat sich bewiesen — 200 Mio Cache-Read-Tokens ueber 129 Spawns, 99,9 % der Eingabe ist wiederholter Praefix, be-developer verursacht 46,5 % der Kosten bei 15 % der Spawns. Die Praefix-Amplifikation ist damit gemessen statt geschaetzt (Auswertung in ABS-592)."
