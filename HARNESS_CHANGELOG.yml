    migration_notes:
      - "ABS-275 (line endings): this release restores LF normalisation to .gitattributes ('* text=auto eol=lf', '*.sh text eol=lf'), but git does NOT retroactively fix blobs already committed with CRLF. Forks carrying CRLF blobs (typical for forks maintained on Windows) must run the one-time renormalisation ONCE after upgrading: `git add --renormalize . && git commit -m 'chore: renormalize line endings to LF'`. Expect a large, content-free diff — that is the point. Skipping it leaves the stale CRLF blobs in place, and they keep producing whole-file EOL conflicts on every future migration. Verify with `bash tests/test-gitattributes-eol.sh`, which fails and names the offending paths if any CRLF blob remains. On Windows, a pre-existing `git config core.autocrlf=true` explains CRLF files checked out before the upgrade; the new eol=lf rule overrides it from now on."

