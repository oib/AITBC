# Hub-specific drop-in for aitbc-blockchain-rpc.service.
#
# hub is the public RPC front door and carries 4 gunicorn workers; every
# other node runs the stock unit (1 uvicorn worker, MemoryMax=512M).
# Keep this file in /etc/systemd/system/aitbc-blockchain-rpc.service.d/
# on hub only — do NOT link it fleet-wide.
#
# Install (on hub):
#   mkdir -p /etc/systemd/system/aitbc-blockchain-rpc.service.d
#   cp /opt/aitbc/apps/blockchain-node/overrides/hub/aitbc-blockchain-rpc.conf \
#      /etc/systemd/system/aitbc-blockchain-rpc.service.d/override.conf
#   systemctl daemon-reload
#
# Rationale: found during production memory-pressure work — the stock
# 512M cap OOM-killed the hub's workers; 1G holds ~49% steady-state.

[Service]
# Empty assignment resets the base ExecStart before overriding.
ExecStart=
ExecStart=/opt/aitbc/venv/bin/python -m gunicorn aitbc_chain.app:app -k uvicorn.workers.UvicornWorker --bind ${RPC_BIND_HOST}:${RPC_BIND_PORT} --workers 4 --timeout 120 --keep-alive 5 --log-level critical --access-logfile /dev/null
MemoryMax=1G
