# Alembic configuration for AITBC Coordinator API
# The database URL is resolved dynamically in alembic/env.py from the app's
# Settings (same source as the running service), so it is NOT set here.
[alembic]
script_location = alembic
prepend_sys_path = src
version_path_separator = os

# Timezone for the "Create Date" timestamp in migration file headers.
timezone = UTC

[post_write_hooks]
# Run ruff on generated migration files.
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
