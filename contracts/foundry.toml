[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.20"
evm_version = "paris"
via_ir = true
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[profile.default.fuzz]
runs = 1000
max_test_rejects = 65536

# §5.6: forge coverage disables the optimizer and via_ir by default, which
# causes "stack too deep" errors on contracts with large structs (e.g.
# RentalAgreement with 12 fields). This profile keeps via_ir enabled so
# coverage can run. Use it with: forge coverage --profile coverage
[profile.coverage]
via_ir = true
optimizer = true
optimizer_runs = 200
