# =============================================================================
# Rule Ledger (ABS-515/ABS-516 / epic ABS-514)
# =============================================================================
# Machine-readable inventory of the RULES-carrying markdown surface: every
# H2/H3 section of each scoped file has one row per occurrence declaring its
# enforcement status. Checked by scripts/rule-ledger-check.sh (auto-discovered
# via tests/test-rule-ledger.sh).
#
#   kind: enforced    -> sensors: [deterministic sensor, ...]  (path or path:function).
#                        Semantics: a NAMED SENSOR EXISTS — not proof it is
#                        live-wired to this exact rule (that is the sensor's
#                        own test's job).
#   kind: derived     -> section retells code-enforced behavior; sensors mandatory;
#                        condensation candidate for ABS-524.
#   kind: unenforced  -> risk: "what can go wrong while only the LLM enforces it"
#                        — this is the sensor-backfill worklist.
#   kind: informative -> descriptive/reference section, not a normative rule.
#
# Anchoring is (file, heading) — section level, no IDs injected into the md.
# scope_dirs: every *.md under these dirs MUST be listed in scope (C6).
#
# ID ALLOCATION — ticket-scoped, NOT a running counter (ABS-600):
#   New rows get `R-<TICKET>-<n>` where <TICKET> is the globally-unique ticket
#   that introduces them and <n> counts THIS ticket's own rows (R-ABS-600-1,
#   R-ABS-600-2, ...). Mint it with `scripts/next-rule-ledger-id.sh <TICKET>`.
#   WHY: a running counter (`R-NNNN`) is read off YOUR branch, so two parallel
#   stories both pick the same "next" number and collide at integration — the
#   exact Pilot-8 failure (R-1109..R-1116 each existed 2–4×, 12 rows renumbered
#   by hand). A ticket id is minted centrally by the tracker, never in parallel,
#   so ticket-scoped ids are collision-free BY CONSTRUCTION across branches.
#   See docs/registry-id-allocation.md for the cross-registry rule + rationale.
#   Legacy `R-NNNN` ids are FROZEN (append-only): never renumber, never reuse,
#   and never mint a new one — the scheme only survives for existing rows.
#
# CHECKER LIMIT — EXISTENCE, NOT WIREDNESS (PILOT-68 / ABS-570):
#   rule-ledger-check.sh verifies a sensor PATH exists (and, for a
#   `path:function` sensor, that the function is DEFINED in that file). It does
#   NOT verify the sensor actually EXERCISES the rule it is listed against. A
#   sensor that exists but tests a DIFFERENT rule is therefore NOT auto-
#   detectable — the wrong-sensor assignment is only caught by a human reading
#   the row against the ADR (e.g. R-0957 once listed a skills-parity guard for a
#   Decision that explicitly EXCLUDES skills guards; the checker was silent).
#   Treat `enforced` as "a plausibly-related named sensor exists", not proof of
#   coverage; the sensor's own tests/test-*.sh is what pins the wiredness.
# =============================================================================
