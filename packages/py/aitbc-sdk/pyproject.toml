[project]
name = "aitbc-sdk"
version = "0.1.0"
description = "AITBC SDK"
authors = [
    {name = "AITBC Team", email = "team@aitbc.dev"}
]
readme = "README.md"
requires-python = ">=3.13.5,<3.14"
dependencies = [
    "pydantic>=2.5.0",
    "httpx>=0.28.1",
    "pynacl>=1.5.0",
    "aitbc-crypto>=0.1.0"
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "aitbc_sdk", from = "src" }
]

# aitbc-crypto is a sibling package in this repo, not published to PyPI. The
# [project] table above declares the version constraint; poetry needs to be
# told where to actually find it, or `poetry lock` fails with "depends on
# aitbc-crypto (>=0.1.0) which doesn't match any versions".
[tool.poetry.dependencies]
aitbc-crypto = { path = "../aitbc-crypto", develop = true }
