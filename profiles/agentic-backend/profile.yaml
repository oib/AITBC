# agentic-backend profile — self-hosted tracker + kanban board (ABS-229 / ADR-A-0021).
#
# Purpose: bind the task-tracking capability to the agentic delivery backend,
# replacing the Jira binding for teams that want a self-hosted, agent-first tracker
# with a `docker compose up` install (spec §9) and a built-in kanban dashboard.
# The key difference from jira-github-postgres: there is only ONE sanctioned lane —
# both the orchestrator poll loop and interactive human sessions use the same
# `$TRACKER_CMD` curl adapter (scripts/backend-tracker.sh). No MCP server is needed.
#
# See: docs/guides/AGENTIC-BACKEND-INSTALL.md (install walkthrough)
#      adrs/agentic/ADR-A-0021-agentic-delivery-backend.md (decision record)
#      profiles/neutral/adapters/task-tracking.md (capability contract, lane doctrine)

profile: agentic-backend
description: >
  Self-hosted agentic delivery backend (ABS-229, ADR-A-0021).
  Node/TypeScript + Postgres 16, docker compose install. Drop-in Jira replacement:
  scripts/backend-tracker.sh is CLI-identical to scripts/mock-tracker.sh.
  A single $TRACKER_CMD lane serves both the orchestrator poll loop and interactive
  human sessions — no Atlassian MCP server required.
based_on: neutral

capabilities:
  task-tracking:
    provider: agentic-backend
    implemented_by:
      agents: [tdm]
      commands: [start-work, end-work]
      skills: [safe-workflow, tracker-ops]   # tracker-ops covers both interactive + autonomous lanes
      scripts: [backend-tracker.sh]
      adapter: profiles/neutral/adapters/task-tracking.md
    config:
      backend_url: "{{BACKEND_URL}}"         # default http://localhost:8420; set in env
      backend_token: "{{BACKEND_TOKEN}}"     # project-scoped orchestrator token; see install guide
      tracker_project: "{{TRACKER_PROJECT}}" # project key, e.g. ABS
      orch_instance_id: "{{ORCH_INSTANCE_ID}}" # optional; identifies the orchestrator instance on the board
    notes: >
      Switch to this adapter: export TRACKER_CMD=scripts/backend-tracker.sh.
      No Atlassian MCP is used; the jira-sop skill is not loaded.
      Install guide: docs/guides/AGENTIC-BACKEND-INSTALL.md.
      Orchestrator SOP binding: docs/sop/ORCHESTRATOR_SOP.md §"Agentic Backend Binding".
    required: true

  docs:
    provider: markdown-repo
    implemented_by:
      agents: [tech-writer]
      commands: [update-docs]
      adapter: profiles/neutral/adapters/docs.md
    required: true

  git:
    provider: github       # or bitbucket / gitlab — swap the provider key
    protected_branches: ["main"]
    autonomous_merge: false
    implemented_by:
      agents: [rte]
      skills: [git-advanced, safe-workflow]
      commands: [pre-pr, release]
    required: true

  database:
    # The backend's own Postgres is internal to the backend service and managed by its
    # docker-compose.yml — it is NOT the application database. Set provider here to the
    # application database, if any (e.g. supabase-postgres-rls for a SAW app).
    provider: none
    implemented_by:
      agents: [data-engineer, data-provisioning-eng]
      skills: [migration-patterns]
    required: false

  deploy:
    provider: docker-github-actions
    production_release: human-only
    implemented_by:
      agents: [rte]
      skills: [deployment-sop, release-patterns]
      commands: [deploy-dev, remote-deploy, remote-rollback, release]
    required: false

  notifications:
    provider: agentic-backend   # human notifications land in the backend tracker
    implemented_by:
      agents: [tdm]
    required: true

  design-system:
    provider: none
    required: false

  knowledge:
    provider: okf-repo
    bundle_path: knowledge/
    implemented_by:
      agents: [bsa, tech-writer]
      skills: [pattern-discovery]
    required: false

  secrets:
    provider: env
    mediated_access_only: true
    implemented_by:
      agents: [security-engineer]
      skills: [security-audit]
    required: false

  evolution:
    provider: none
    implemented_by:
      agents: [self-improvement]
      scripts: [evolver-lifecycle.sh]
    required: false

# Human-approval boundaries are stack-independent invariants (see blueprint/governance/).
approval_boundaries:
  - architecture-change
  - breaking-change
  - merge-to-main
  - additional-costs
  - production-deployment
  - adr-acceptance
  - epic-acceptance
