# evolver profile — opt-in self-evolution via EvoMap Evolver (ABS-25).
#
# Binds the neutral `evolution` capability to the local Evolver CLI. Offline + human review
# by default; Hub / Worker Pool / auto-issue are out of scope and require human approval.
#
# Prerequisite (documented, not installed by the repo): npm i -g @evomap/evolver (Node >= 18)

profile: evolver
description: >
  Neutral capabilities + Evolver self-evolution (offline, --review). Feeds the existing
  Self-Improvement loop; no autonomous merge or outward writes.
based_on: neutral

capabilities:
  evolution:
    provider: evolver
    implemented_by:
      agents: [self-improvement]
      scripts: [evolver-lifecycle.sh]
      adapter: profiles/neutral/adapters/evolution.md
    notes: >
      Offline defaults: EVOLVER_AUTO_ISSUE=false, EVOLVER_VALIDATOR_ENABLED=0.
      Do not set A2A_HUB_URL or A2A_NODE_ID without human approval (Hub = follow-up ticket).
      Lifecycle hooks invoke evolver --review from scripts/hooks/evolver-lifecycle.sh;
      do not run evolver setup-hooks (user-level config).
    required: false

# Identical to neutral — approval boundaries are stack-independent invariants.
approval_boundaries:
  - architecture-change
  - breaking-change
  - merge-to-main
  - additional-costs
  - production-deployment
  - adr-acceptance
  - epic-acceptance
