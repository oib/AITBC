# Neutral profile — the technology-neutral default.
# Declares WHAT capabilities the agentic SDLC needs; leaves WHICH provider open.
# Providers default to `mock`/`none` so the harness runs stack-agnostically; fill them in,
# or select the saw-stack profile for a ready-made opinionated stack.
#
# Binding a provider here NEVER edits SAW's harness files — it maps a capability onto the
# skills/commands/agents that implement it, keeping the harness upgrade-clean via
# .harness-manifest.yml.

profile: neutral
description: Technology-neutral default. Capabilities declared; providers to be chosen.

# Stack applicability (ABS-257) — OPT-IN, deliberately unset here.
# Declaring a top-level `stack:` list makes scripts/pattern-applicability.sh (and with it the
# pattern-discovery skill) hide patterns that do not match your stack; patterns tagged
# `generic` always stay visible. With NO `stack:` key — the neutral default — nothing is
# filtered, so existing projects keep seeing every pattern.
# A FastAPI/Firestore project would declare:
#   stack: [generic]                        # SAW's Next.js/Prisma/Clerk patterns hidden
# A Next.js project on the SAW stack: see profiles/saw-stack/profile.yaml.
# Vocabulary: see patterns_library/README.md "Stack applicability".

# `implemented_by` lists the STACK-INDEPENDENT SAW drivers (agents/skills/commands) that operate
# each capability — these stay the same whichever provider fills the slot. `provider` is the
# part left open here; a concrete profile (e.g. saw-stack) sets it and adds any
# PROVIDER-SPECIFIC skills (linear-sop, confluence-docs, rls-patterns) on top.
capabilities:
  task-tracking:
    interface: adapters/task-tracking.md
    provider: gitea           # e.g. linear | jira-cloud | gitlab-ce | github-issues | gitea | mock
    implemented_by:
      agents: [tdm]
      commands: [start-work, end-work]
      skills: [safe-workflow]      # provider-specific tracker skill (e.g. linear-sop) added by the concrete profile
      scripts: [gitea-tracker.sh]  # gitea provider: scripts/gitea-tracker.sh over the real Gitea issue
                                   # tracker at $GITEA_SITE/$GITEA_OWNER/$GITEA_REPO (see the script's
                                   # own header for the full status/lane/role/priority label mapping).
                                   # Requires GITEA_SITE/GITEA_TOKEN/GITEA_OWNER/GITEA_REPO env vars and
                                   # a one-time `scripts/gitea-tracker.sh setup` to provision labels.
    required: true

  docs:
    interface: adapters/docs.md
    provider: mock            # e.g. confluence | markdown-repo | notion | mock
    implemented_by:
      agents: [tech-writer]
      commands: [update-docs]
    required: true

  git:
    interface: adapters/git.md
    provider: github          # github | gitlab | bitbucket | mock
    protected_branches: [main]
    autonomous_merge: false   # invariant: agents never merge protected branches (SAW: RTE role)
    implemented_by:
      agents: [rte]
      skills: [git-advanced, safe-workflow]
      commands: [pre-pr, release]
    required: true

  database:
    interface: adapters/database.md
    provider: none            # e.g. supabase-postgres-rls | postgres | mysql | none
    implemented_by:
      agents: [data-engineer, data-provisioning-eng]
      skills: [migration-patterns]   # RLS-specific rls-patterns added by the concrete profile
    required: false

  deploy:
    interface: adapters/deploy.md
    provider: none            # e.g. docker-github-actions | vercel | none
    production_release: human-only   # agents prepare; humans release to prod
    implemented_by:
      agents: [rte]
      skills: [deployment-sop, release-patterns]
      commands: [deploy-dev, remote-deploy, remote-rollback, release]
    required: false

  notifications:
    interface: adapters/notifications.md
    provider: task-tracking   # route human notifications through the tracker by default
    implemented_by:
      agents: [tdm]
    required: true

  design-system:
    interface: adapters/design-system.md
    provider: none            # e.g. figma | tokens | docs | none
    implemented_by:
      agents: [fe-developer]
      skills: [frontend-patterns]
    required: false

  knowledge:
    interface: adapters/knowledge.md
    provider: okf-repo        # okf-repo | graphify | codebase-memory | none
    bundle_path: knowledge/
    implemented_by:
      agents: [bsa, tech-writer]
      skills: [pattern-discovery]
      commands: [update-docs]
    required: false

  secrets:
    interface: adapters/secrets.md
    provider: env             # env | vault | none
    mediated_access_only: true       # agents never see raw secrets without explicit human approval
    implemented_by:
      agents: [security-engineer]
      skills: [security-audit]
    required: false

  evolution:
    interface: adapters/evolution.md
    provider: none            # evolver | none
    implemented_by:
      agents: [self-improvement]
      scripts: [evolver-lifecycle.sh]
    required: false

# Human-approval boundaries are stack-independent invariants (see blueprint/governance/).
approval_boundaries:
  - architecture-change
  - breaking-change
  - merge-to-main
  - additional-costs
  - production-deployment
  - adr-acceptance
  - epic-acceptance
