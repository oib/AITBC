[project]
name = "aitbc"
version = "0.10.18"
description = "AI Agent Compute Network - Main Project"
authors = [{name = "AITBC Team"}]
requires-python = ">=3.13.5,!=3.14.1,<3.15"
dynamic = ["dependencies"]

[tool.poetry]
name = "aitbc"
version = "0.10.18"
description = "AI Agent Compute Network - Main Project"
authors = ["AITBC Team"]
package-mode = true

[tool.poetry.dependencies]
python = ">=3.13.5,<3.14.1 || >3.14.1,<3.15"
# Core Web Framework
fastapi = "0.136.3"
uvicorn = {extras = ["standard"], version = "0.49.0"}
gunicorn = "26.0.0"
starlette = "1.3.1"
# Database & ORM
sqlalchemy = {extras = ["asyncio"], version = "2.0.50"}
sqlmodel = "0.0.38"
alembic = "1.18.4"
aiosqlite = "0.22.1"
asyncpg = "0.31.0"
psycopg2-binary = "2.9.10"
# Serialization
orjson = "3.11.9"
# Shared models
aitbc-shared = {path = "packages/aitbc-shared", develop = true}
# Configuration & Environment
pydantic = "2.13.3"
pydantic-settings = "2.14.2"
python-dotenv = "1.2.2"
# Rate Limiting & Security
slowapi = "0.1.9"
limits = "5.8.0"
prometheus-client = "0.21.1"
pyjwt = {extras = ["crypto"], version = "2.13.0"}
# Load Testing
locust = "2.44.1"
# HTTP Client & Networking
httpx = "0.28.1"
requests = "2.34.2"
urllib3 = "2.7.0"
aiohttp = "3.14.3"
aiostun = "0.6.1"
# Cryptocurrency & Blockchain
cryptography = "50.0.0"
argon2-cffi = "25.1.0"
pynacl = "1.6.2"
ecdsa = "0.19.2"
base58 = "2.1.1"
bech32 = "1.2.0"
web3 = "7.16.0"
eth-account = "0.13.7"
# Data Processing
pandas = "3.0.3"
numpy = "2.4.6"
# Machine Learning & AI (optional; only needed for ML/AI services)
torch = {version = "2.13.0", optional = true}
torchvision = {version = "0.28.0", optional = true}
# GPU acceleration (coordinator-api gpu_optimizer.py — requires /dev/nvidia-uvm in containers)
pycuda = {version = "2026.1", optional = true, markers = "platform_machine == 'x86_64' and sys_platform == 'linux'"}
# CLI Tools
click = "8.4.1"
rich = "15.0.0"
typer = "0.25.1"
click-completion = "0.5.2"
tabulate = "0.10.0"
colorama = "0.4.6"
keyring = "25.7.0"
# JSON & Serialization
msgpack = "1.2.1"
python-multipart = "0.0.32"
# Logging & Monitoring
structlog = "26.1.0"
sentry-sdk = "2.61.1"
# Utilities
python-dateutil = "2.9.0.post0"
pytz = "2026.2"
schedule = "1.2.2"
aiofiles = "25.1.0"
pyyaml = "6.0.3"
filelock = "3.29.0"
# Async Support
asyncio-mqtt = "0.16.2"
websockets = "14.2"
# IPFS & Distributed Storage
ipfshttpclient = "0.7.0"
aioredis = "2.0.1"
# Image Processing (for AI services)
pillow = {version = "12.3.0", optional = true}
opencv-python = {version = "4.13.0.92", optional = true}
# Additional Dependencies
redis = "8.0.0"
psutil = "7.2.2"
tenseal = {version = "0.3.16", optional = true, markers = "platform_machine == 'x86_64' and sys_platform == 'linux'"}
idna = "3.18"
hypothesis = "6.156.1"
bcrypt = "4.3.0"
eth-utils = "6.0.0"
eth-keys = "0.8.0"
mcp = "2.1.1"
networkx = "3.4.2"
ping3 = "5.1.5"
# Optional search / sqlcipher / language / security extras
meilisearch = {version = "0.43.0", optional = true}
sqlcipher3-binary = {version = "0.6.0", optional = true}
nltk = {version = "3.10.3", optional = true}
spacy = {version = "3.8.16", optional = true}
opentelemetry-sdk = {version = "1.44.0", optional = true}
opentelemetry-exporter-otlp = {version = "1.44.0", optional = true}
openai = {version = "1.78.1", optional = true}
deepl = {version = "1.32.0", optional = true}
google-cloud-translate = {version = "3.27.0", optional = true}
langdetect = {version = "1.0.9", optional = true}
fasttext = {version = "0.9.3", optional = true}
polyglot = {version = "16.7.4", optional = true}
detect-secrets = {version = "1.5.0", optional = true}
zstandard = "0.23.0"
ollama = "0.4.7"

[tool.poetry.group.dev.dependencies]
pytest = "9.0.3"
pytest-asyncio = "1.4.0"
pytest-timeout = "2.4.0"
pytest-mock = "3.14.1"
pytest-rerunfailures = "16.3"
ruff = "0.15.17"
mypy = "2.1.0"
pre-commit = "4.5.1"
bandit = "1.9.4"
safety = "3.7.0"
pytest-cov = "7.1.0"
types-requests = "2.33.0.20260518"
types-PyYAML = "6.0.3"
types-python-dateutil = "2.9.0.20260518"
types-psycopg2 = "2.9.21.20260518"
types-setuptools = "75.8.0.20250110"
types-tabulate = "0.9.0.20241207"
types-pytz = "2026.2.0.20260518"
tqdm = "4.68.1"
ipython = "9.5.0"
fakeredis = "2.36.2"
openapi-spec-validator = "0.9.0"
libcst = "1.9.0"
pip-audit = "2.10.1"

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
mypy_path = [
    "packages/aitbc-shared",
    "apps/coordinator-api/src",
    "apps/agent-coordinator/src",
    "apps/ai-engine/src",
    "apps/api-gateway/src",
    "apps/blockchain-event-bridge/src",
    "apps/blockchain-explorer",
    "apps/blockchain-node/src",
    "apps/bridge-monitor/src",
    "apps/edge/src",
    "apps/ffmpeg",
    "apps/governance/src",
    "apps/gpu/src",
    "apps/marketplace/src",
    "apps/miner",
    "apps/pool-hub/src",
    "apps/shared-core/src",
    "apps/shared-domain/src",
    "apps/trading/src",
    "apps/wallet/src",
    "apps/whisper",
    "apps/zk-circuits",
    "cli",
]
explicit_package_bases = true

# Enable stricter type checking for incremental migration
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_optional = true

# Expanded scope: aitbc/ + all apps (src/ and flat-layout) + publishable packages.
# Flat-layout apps are on mypy_path with explicit_package_bases for import resolution.
exclude = [
    # Exclude test files
    "^tests/",
    "^aitbc/.*tests/",
    "^apps/.*/tests/",
    "^apps/.*/examples/",
    "^apps/.*/migrations/",
    "^apps/.*/alembic/",
    "^apps/.*/scripts/",

    # Exclude top-level app scripts (genesis/init helpers in app root, not src/)
    "^apps/blockchain-node/(create_|init_).*\\.py$",

    # Exclude app entrypoints and package init (no useful type info)
    "^apps/[^/]+/main\\.py$",
    "^apps/[^/]+/src/__init__\\.py$",

    # Exclude operational scripts under apps/ (not production source)
    "^apps/.*/scripts/",

    # Exclude template files (Jinja2/YAML data, not valid Python)
    "^cli/templates/",

    # Exclude packages except aitbc-shared (incremental)
    "^packages/(?!aitbc-shared)",

    # Exclude generated/migration files and non-production code
    "^contracts/",
    "^plugins/",
    "^scripts/",
    "^dev/",
    "^docs/",
]

# Optional third-party imports in aitbc/ that are not always installed or do not have stubs.
# Once the corresponding runtime package or stubs are pinned, these overrides can be removed.
[[tool.mypy.overrides]]
module = [
    "pytz",
    "yaml",
    "bcrypt",
    "zstandard",
    "config",
    "aitbc_agent",
    "aitbc_agent.*",
    "opentelemetry.*",
    "ping3",
    "pycuda",
    "pycuda.*",
    "fasttext",
    "langdetect",
    "langdetect.*",
    "polyglot",
    "polyglot.*",
    "networkx",
    "sqlcipher3",
    "meilisearch",
    "broadcaster",
    "aiofiles",
    "tenseal",
    "nltk",
    "nltk.*",
    "spacy",
    "spacy.*",
    "pandas",
    "advanced_analytics",
    "deepl",
    "google",
    "google.*",
    "openai",
    "coordinator_api.contexts.*.config",
    "coordinator_api.contexts.language.services.main",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "aitbc.*",
    "apps.coordinator_api.*",
]
ignore_missing_imports = false

# NOTE: Use `mypy --follow-imports=skip <file>` to check individual files during development
# Gradually remove files from the exclude list as type errors are fixed

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "web3.*",
    "eth_account.*",
    "sqlalchemy.*",
]
ignore_missing_imports = true

# Tech debt: these modules still have type errors that require per-file annotation work.
# Tracked in gap analysis. Remove entries as each module is fixed.
# Clean (no override needed): domain.*, schemas.*, auth, exceptions, models.*, storage.*, utils.*
#
# GRADUAL TYPE CHECKING APPROACH (2026-05-31):
# - Critical apps (coordinator-api, blockchain-node, agent-coordinator) have ~1,325 type errors
# - Instead of fixing all at once, we enforce types on NEW/MODIFIED files only
# - Developers should add type annotations to any files they touch
# - Use `mypy --follow-imports=skip <file>` to check individual files during development
#
# NOTE: per-file-ignores in pyproject.toml is NOT supported by mypy 2.0.0
# Instead, # mypy: ignore-errors has been added directly to 73 source files
# See: apps/coordinator-api/src/app/services/tenant_management.py (and 72 others)

# Gradual type checking approach - no apps currently ignored

# Coverage policy: one documented baseline with per-package overrides in CI.
# The project minimum is 60%; higher thresholds are enforced per test run
# (aitbc/ 46%, apps combined 50%, targeted gates 70/85 in Gitea workflows).
[tool.coverage.report]
fail_under = 60
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
line-length = 127
target-version = "py313"
extend-exclude = ["tests/cli/command_test_template.py", "scripts/**/*.sh", "contracts/"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "E722", # bare except (explicitly enforce)
    "G001", # logging statement uses f-string
    "G002", # logging statement uses .format() or % formatting
    "B008", # do not perform function calls in argument defaults
    "B023", # function definition does not bind loop variable
]
ignore = [
    "E501",  # line too long, handled by black
    "C901",  # too complex
    "UP040", # Don't upgrade TypeAlias to `type` statement (breaks MyPy base class usage)
    "E402", # Allow module level imports not at top of file (for re-exports in crypto/security.py and network/http_client.py)
    "C401", # Allow generator expressions in set() calls (style preference)
    "UP041", # Keep asyncio.TimeoutError for explicit async timeout handling
    "W293", # Allow trailing whitespace (style preference)
    "I001", # Ignore import sorting differences between ruff versions
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B011"]
"tests/cli/command_test_template.py" = ["ALL"]

[tool.pydocstyle]
convention = "google"
add_ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

# The pre-commit bandit hook has passed `-c pyproject.toml` since it was added, and until
# V23-85 there was nothing here for it to read. That was the smaller of two problems: the
# same hook's `-x` argument was written as three list items, so bandit exited 2 on a usage
# error before it read any configuration at all. See .pre-commit-config.yaml.
#
# `exclude_dirs` entries are matched as plain substrings of the path as well as globs, which
# is why each one is written with its surrounding slashes -- a bare "build" would also drop
# anything under a directory called "rebuild", and a bare "tests" would drop
# `aitbc/protests.py`. The leading slash also anchors them: "/venv/" does not match
# "myvenv/".
[tool.bandit]
exclude_dirs = [
    # Not our code. Neither is tracked, but bandit walks the filesystem rather than asking
    # git, so .gitignore does not reach it. Without these the scan reports pip's vendored
    # copies of requests and distlib -- 11 of the 21 HIGH findings on the first run came
    # from apps/coordinator-api/.venv, and none of them were ours to fix.
    "/venv/",
    "/.venv/",
    "/node_modules/",
    "/site-packages/",
    "/__pycache__/",
    "/.tox/",
    "/.eggs/",
    # Build output and coverage reports, regenerated rather than edited.
    "/build/",
    "/htmlcov/",
    # Solidity submodules -- forge-std and openzeppelin-contracts, each of which ships a
    # scripts/vm.py we do not run and cannot patch. `[tool.ruff]` excludes this directory for
    # the same reason. The repository tracks no Python under contracts/ at all.
    "/contracts/",
    # Test code. `assert` is the point of a test, and B101 fires on every one: 3,388 of the
    # repo's 3,837 findings were asserts in test files. They are all below the severity
    # floor the hook runs at, so this is about scan time rather than noise, but the
    # exclusion is also what the hook's author originally intended -- the broken `-x`
    # argument was trying to name `tests/` and `tests/cli`.
    "/tests/",
    # Skeletons with placeholder bodies, already excluded from ruff and debug-statements.
    "/cli/templates/",
]
# Skipped repo-wide rather than per-line, because in each case the finding is about a
# deliberate project-wide convention and eight or thirty scattered `# nosec` comments would
# say the same thing less visibly.
skips = [
    # B104, binding to 0.0.0.0. Every service here is either inside a container or behind
    # the nginx reverse proxy, and binds the one interface it has; the address is what makes
    # it reachable from the host at all. B104 fires on the only spelling that works, so
    # there is nothing to change in response to it.
    "B104",
]

[tool.pytest.ini_options]
# "." is the repo root, so `cli.*` and `aitbc.*` resolve to the checkout under test.
# importlib import mode does not put rootdir on sys.path the way prepend mode did, and
# the editable install maps only `aitbc_cli` -> cli/aitbc_cli, not the `cli` package.
pythonpath = [
    ".",
    "apps/api-gateway/src",
    "apps/blockchain-event-bridge/src",
    # Without this the whole of apps/blockchain-node/tests is uncollectable -- its
    # conftest imports aitbc_chain at module scope -- and the two tests in
    # apps/coordinator-api/tests/test_blockchain_client_paths.py that check this
    # app's URLs against the node's real route table error out instead of running.
    # They are the tests that would have caught /rpc/transactions/{hash}, a path
    # the node does not serve. mypy_path has carried this entry all along.
    "apps/blockchain-node/src",
    "apps/coordinator-api/src",
    "apps/agent-coordinator/src",
    "apps/ai-engine/src",
    "apps/bridge-monitor/src",
    "apps/edge/src",
    "apps/governance/src",
    "apps/gpu/src",
    "apps/marketplace/src",
    "apps/miner/src",
    "apps/pool-hub/src",
    "apps/trading/src",
    "apps/wallet/src",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
consider_namespace_packages = true
minversion = "8.0"
# --import-mode=importlib: both tests/ and apps/blockchain-node/tests/ carry __init__.py,
# so under the default "prepend" mode they compete for the top-level `tests` package name
# and whichever is imported first wins. Collecting both then fails the other with
# "No module named 'tests.consensus'". importlib mode imports each file by location and
# does not put test packages on sys.path at all, so the two coexist.
addopts = "-ra -q --strict-markers --strict-config --reruns 2 --reruns-delay 1 --import-mode=importlib"
timeout = 60
filterwarnings = [
    "ignore::sqlalchemy.exc.SAWarning",
    "ignore:.*The default datetime adapter is deprecated.*:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning",
    "ignore:websockets.legacy is deprecated.*:DeprecationWarning",
]
testpaths = [
    # The whole directory, as of V23-71 tranche 3. The individually-named entries below are
    # now redundant against this one -- pytest deduplicates overlapping testpaths, so they
    # collect nothing extra -- but they are kept because each records why a suite had to be
    # named, and those reasons are the findings.
    #
    # What naming them one at a time missed: `tests/` root holds 58 pytest modules that no
    # entry matched, and `tests/agent`, `tests/api`, `tests/contract_tests`,
    # `tests/cross_phase`, `tests/training`, `tests/production` and `tests/verification` are
    # seven more directories nobody had listed. About 1,500 tests, none of which had ever
    # run. They rotted accordingly: `test_middleware_validation.py` asserted a
    # Content-Length check that CORE-13 replaced with a real body read ten days earlier, so
    # the file was pinning the bypass rather than the guard.
    #
    # Naming the directory rather than its contents is the point -- a suite added later is
    # collected the day it lands instead of waiting for someone to notice it never ran.
    "tests",
    "tests/unit",
    "tests/integration",
    "tests/smoke",
    "tests/coordinator",
    "tests/e2e",
    "tests/security",
    "tests/cli",
    "tests/services",
    "tests/ui-accessibility",
    # Added: these hold real coverage that no run was picking up. tests/core alone is 365
    # tests, and tests/property_tests is the hypothesis suite. Both sat outside testpaths
    # long enough to rot against APIs that had moved -- which is exactly what being
    # excluded from every run lets happen.
    "tests/core",
    "tests/property_tests",
    "apps/blockchain-node/tests",
    # The agent-coordinator suite holds the faucet-policy and /execute authority tests --
    # the rules that decide whether the hub pays out. It was never in testpaths, so none of
    # it ran, which is how the V23-67 prior-grant hole reached production with tests sitting
    # next to it that would have caught nothing anyway (V23-67).
    "apps/agent-coordinator/tests",
    # None of these had ever run. `testpaths` listed two app suites out of sixteen, so 58
    # test files sat next to the code doing nothing -- including 112 tests for
    # coordinator-api, a deployed service. Adding a suite here is the whole cost of
    # collecting it; the ones below all passed unchanged the first time they were run
    # (V23-69).
    "apps/coordinator-api/tests",
    "apps/ai-engine/tests",
    "apps/bridge-monitor/tests",
    "apps/exchange/tests",
    "apps/gpu/tests",
    "apps/marketplace/tests",
    "apps/pool-hub/tests",
    "apps/trading/tests",
    "apps/wallet/tests",
    # These three keep their modules at the app root rather than under src/, so each has a
    # conftest that puts its own app directory on sys.path -- and, necessarily, no
    # __init__.py in tests/. See those conftests for why both halves are required (V23-70).
    "apps/blockchain-explorer/tests",
    "apps/miner/tests",
    "apps/zk-circuits/tests",
    # Restored: aitbc-edge is a deployed unit whose test files were deleted as "skipped,
    # errored, and failed". They were none of those -- this suite was simply never listed
    # here, so it produced no results and was read as producing no value (V23-71).
    "apps/edge/tests",
    "apps/api-gateway/tests",
    "apps/blockchain-event-bridge/tests",
    # Joins the main run as of V23-73. This suite sat outside `testpaths` for two findings'
    # worth of reasons: it and apps/coordinator-api defined the same five table names against
    # SQLModel's global metadata (V23-72), and its conftest assigns `DATABASE_URL`
    # process-wide, which pulled gpu and trading off their own databases (V23-73). Both are
    # fixed; it collects with everything else now.
    "apps/governance/tests",
    # The last suite in the repo that no run collected. `cli/` carried its own `pytest.ini`,
    # which is why this directory was never added here -- it looked self-contained. It was
    # not: that file set `testpaths = cli/tests`, resolved against rootdir `cli/`, so it
    # pointed at `cli/cli/tests`, which does not exist. pytest warned and fell back to
    # searching the current directory, so the 87 tests were collected by the fallback rather
    # than by any configuration, and only when the invocation happened to start at `cli/` or
    # `cli/tests`. From `cli/aitbc_cli` the same command collected nothing. The ini file is
    # gone as of V23-84; every setting in it was a pytest default, a marker already declared
    # below, or a weakening of the addopts above.
    "cli/tests",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
    "security: marks tests as security tests",
    "contract: marks tests as contract tests",
    "requires_redis: test needs a reachable Redis instance (auto-skipped if absent)",
    "requires_postgres: test needs a reachable PostgreSQL instance (auto-skipped if absent)",
    "requires_genesis: test needs an on-disk genesis file fixture (auto-skipped if absent)",
    "external: marks tests that call live external services or require a non-default environment",
    "blockchain: marks tests that interact with blockchain nodes or aitbc_chain internals",
    "postgres: marks tests that require a PostgreSQL database",
    "redis: marks tests that require a Redis instance",
    "smoke: marks tests that import production modules in fresh subprocesses",
]

[tool.coverage.run]
source = ["aitbc", "apps", "packages", "cli"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/venv/*",
]

[tool.poetry.extras]
gpu = ["pycuda"]
fhe = ["tenseal"]
ml = ["torch", "torchvision", "pillow", "opencv-python"]
search = ["meilisearch"]
sqlcipher = ["sqlcipher3-binary"]
language = ["nltk", "spacy", "openai", "deepl", "google-cloud-translate", "langdetect", "fasttext", "polyglot"]
security = ["detect-secrets"]
observability = ["opentelemetry-sdk", "opentelemetry-exporter-otlp"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
