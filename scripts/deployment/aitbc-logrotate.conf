# AITBC Service Log Rotation Configuration
# Install to: /etc/logrotate.d/aitbc (root:root 0644)
#
# Coverage split (LOG-1, 2026-10-13):
# - /var/log/aitbc/<service>/*.log self-rotate inside each service through
#   TimedRotatingFileHandler(when="midnight") in aitbc/aitbc_logging.py.
#   They are deliberately NOT listed here: a second rotator either strands
#   writes on the rotated inode ('create' while the process holds the fd)
#   or races the handler's own midnight rollover ('copytruncate').
# - Top-level /var/log/aitbc/*.log are appended open-per-write by cron/timer
#   monitor scripts, except alerts.log which the aitbc prometheus --watch
#   writer keeps open. One copytruncate stanza covers all of them and keeps
#   each file's existing owner and mode (alerts.log 0640 aitbc:adm,
#   root-written monitor logs stay root-owned, secrets-audit.log keeps its
#   stricter 0600 and per-host owner). A single 'create <owner>' cannot
#   express that mix, and per-file stanzas would duplicate-match this
#   wildcard (logrotate errors on "duplicate log entry").
# - The wildcard stanza is size-triggered (20M), not daily, for alerts.log:
#   its writer uses RotatingFileHandler (5 MiB x 5 in
#   cli/aitbc_cli/commands/prometheus.py) and the explorer history endpoint
#   reads only the live file — a daily logrotate pass would truncate it to
#   empty at midnight and hide alert history behind .1 files that nothing
#   reads. alerts.log never reaches 20M, so logrotate leaves it (and its
#   .1-.5 backups) alone. The flat monitor logs stay small and only need the
#   size cap as a safety bound.
# - /var/log/aitbc/events/*.log are written open-per-write by
#   scripts/workflow/37_contract_event_monitoring.sh, so 'create' is safe
#   there. Dedicated stanza; if a legacy /etc/logrotate.d/aitbc-events file
#   covers the same paths it must be removed or logrotate reports
#   duplicates.

/var/log/aitbc/*.log {
    size 20M
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

/var/log/aitbc/events/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 aitbc adm
}

# Systemd journal logs for AITBC services are rotated by systemd-journald.
# Retention is configured in /etc/systemd/journald.conf:
# SystemMaxUse=1G
# SystemMaxFiles=100
# MaxRetentionSec=1month
