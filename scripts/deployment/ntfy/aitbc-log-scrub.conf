# SEC-14c format, carried to ns2 for the ntfy vhost — install as
# /etc/nginx/conf.d/aitbc-log-scrub.conf on the ns2 host.
# Drops the query string from access logs; identical bytes to the format
# deployed on the five AITBC hosts.
log_format aitbc_scrub '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent"';
