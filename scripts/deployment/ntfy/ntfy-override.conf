# systemd drop-in for the ntfy.service shipped by the .deb —
# install as /etc/systemd/system/ntfy.service.d/override.conf on ns2.
# Loopback binding itself comes from listen-http in server.yml; this file
# tightens the process and keeps the restart policy explicit.

[Service]
Restart=always
RestartSec=5
# ntfy needs: its config, /var/lib/ntfy state (cache/auth/webpush), and a
# network namespace able to bind 127.0.0.1:2586 and make outbound HTTPS for
# web push. Nothing else.
NoNewPrivileges=true
ProtectSystem=strict
ReadWritePaths=/var/lib/ntfy /var/cache/ntfy
ProtectHome=true
PrivateTmp=true
# Keep the journal stream — ntfy logs go to stdout/journal, not files.

[Unit]
After=network-online.target
Wants=network-online.target
