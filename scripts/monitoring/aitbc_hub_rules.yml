# Alert rules that only make sense on the host running
# aitbc-authority-balances.timer (hub). The aitbc_authority_* series come
# from a node_exporter textfile written by that timer; AuthorityBalanceStale
# uses absent() to catch a stopped exporter, so on a host that never had the
# exporter the rule fires permanently. Load this file ONLY where the timer
# runs -- every host still loads aitbc_rules.yml.
groups:
  - name: aitbc-authority
    rules:
      # Authority accounts, from scripts/monitoring/authority-balances-textfile.py (a
      # node_exporter textfile on hub, once a minute; 1 AIT = 36,000,000 units).
      #
      # Escrow release and refund debit max(36, amount // 100) units from the escrow
      # settlement authority, 1% of the settled amount. When the balance is below the fee
      # both fail with "Insufficient balance for fee" and the escrowed funds stay locked
      # until the float is topped up. 9,000,000 units (0.25 AIT) covers about 25 AIT of
      # settled volume, 1,800,000 (0.05 AIT) about 5 AIT; one escrow larger than that
      # needs a larger float before it settles. The two rules exclude each other, so one
      # alert fires at a time.
      - alert: AuthorityFloatLow
        expr: |
          aitbc_authority_balance_units{role="escrow_settlement"} < 9000000
          and aitbc_authority_balance_units{role="escrow_settlement"} >= 1800000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Escrow settlement authority float is low ({{ $labels.address }})"
          description: "The escrow settlement authority {{ $labels.address }} holds {{ $value | humanize }} units. Releases and refunds debit 1% of the settled amount from it; top it up from the treasury before it runs out."

      - alert: AuthorityFloatCritical
        expr: aitbc_authority_balance_units{role="escrow_settlement"} < 1800000
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Escrow settlement authority float is nearly gone ({{ $labels.address }})"
          description: "The escrow settlement authority {{ $labels.address }} holds {{ $value | humanize }} units, about 5 AIT of settled volume at the 1% fee. Escrow release and refund fail once it is below the fee, and the funds stay locked until it is topped up."

      # Nothing debits the bridge release authority: BRIDGE_RELEASE and BRIDGE_REFUND carry
      # a pseudo-sender (no account, no nonce, no debit) and the authority only signs them.
      # Its balance therefore cannot run out, but a balance that falls or a nonce that moves
      # means the key sent a transaction.
      - alert: BridgeAuthorityAccountMoved
        expr: |
          delta(aitbc_authority_balance_units{role="bridge_release"}[15m]) < 0
          or changes(aitbc_authority_nonce{role="bridge_release"}[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Bridge release authority account moved ({{ $labels.address }})"
          description: "The bridge release authority {{ $labels.address }} signs bridge credits but is never debited; its balance fell or its nonce changed, so its key sent a transaction. Treat the key as exposed until explained."

      - alert: AuthorityBalanceUnreadable
        expr: aitbc_authority_scrape_success == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Authority account {{ $labels.role }} could not be read"
          description: "authority-balances-textfile.py could not read {{ $labels.role }} ({{ $labels.address }}) from the local RPC for five minutes; the float alerts are blind for it."

      - alert: AuthorityBalanceStale
        expr: |
          absent(aitbc_authority_scrape_timestamp_seconds)
          or time() - aitbc_authority_scrape_timestamp_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Authority balance export has stopped"
          description: "The aitbc_authority_* textfile is missing or older than five minutes; check aitbc-authority-balances.timer. The float alerts are blind until it runs again."

      # Governance executors pay 360,000 units per GOVERNANCE_EXECUTE — a member
      # that cannot cover the fee cannot rotate parameters at all. The exporter
      # derives one series per governance_executors member; warn below six
      # executes, critical below two. The bands exclude each other.
      - alert: GovernanceExecutorFloatLow
        expr: |
          aitbc_authority_balance_units{role="governance_executor"} < 2160000
          and aitbc_authority_balance_units{role="governance_executor"} >= 720000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Governance executor float is low ({{ $labels.address }})"
          description: "Governance executor {{ $labels.address }} holds {{ $value | humanize }} units — fewer than six GOVERNANCE_EXECUTE fees (360,000 each). Top it up before the next rotation."

      - alert: GovernanceExecutorFloatCritical
        expr: aitbc_authority_balance_units{role="governance_executor"} < 720000
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Governance executor float is nearly gone ({{ $labels.address }})"
          description: "Governance executor {{ $labels.address }} holds {{ $value | humanize }} units — fewer than two GOVERNANCE_EXECUTE fees. A parameter change signed by it will be refused at admission until funded."

      # BOND_SLASH pays BOND_SLASH_TX_FEE (360,000 units on hub) per submitted
      # slash from the bond_slash_authority account; an account with no row
      # fails admission at "sender account not found" and slashing is silently
      # disarmed. Warn below ten slashes, critical below two. The bands
      # exclude each other.
      - alert: BondSlashAuthorityFloatLow
        expr: |
          aitbc_authority_balance_units{role="bond_slash"} < 3600000
          and aitbc_authority_balance_units{role="bond_slash"} >= 720000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Bond slash authority float is low ({{ $labels.address }})"
          description: "Bond slash authority {{ $labels.address }} holds {{ $value | humanize }} units — fewer than ten BOND_SLASH fees (360,000 each). Top it up before the sweeper or a router-triggered slash needs it."

      - alert: BondSlashAuthorityFloatCritical
        expr: aitbc_authority_balance_units{role="bond_slash"} < 720000
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Bond slash authority float is nearly gone ({{ $labels.address }})"
          description: "Bond slash authority {{ $labels.address }} holds {{ $value | humanize }} units — fewer than two BOND_SLASH fees. A slash submitted by the coordinator will be refused at admission until funded."

      # The governance proposer is a fee-paying service identity (360,000 per
      # GOVERNANCE_PROPOSE/VOTE/EXECUTE on the server-signed path) that is not
      # a chain parameter — watched as an AITBC_WATCH_ACCOUNTS extra, so the
      # env entry must move when the key rotates. Funded at exactly ten fees;
      # the warn band starts below five fees, so up to four submissions pass
      # before it warns. Bands exclude each other.
      - alert: GovernanceProposerFloatLow
        expr: |
          aitbc_authority_balance_units{role="governance_proposer"} < 1800000
          and aitbc_authority_balance_units{role="governance_proposer"} >= 720000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Governance proposer float is low ({{ $labels.address }})"
          description: "Governance proposer {{ $labels.address }} holds {{ $value | humanize }} units — fewer than five governance-tx fees (360,000 each). Top it up before the next on-chain submission."

      - alert: GovernanceProposerFloatCritical
        expr: aitbc_authority_balance_units{role="governance_proposer"} < 720000
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Governance proposer float is nearly gone ({{ $labels.address }})"
          description: "Governance proposer {{ $labels.address }} holds {{ $value | humanize }} units — fewer than two governance-tx fees. A service-submitted proposal/vote will be refused at admission until funded."

      # Neither account below has a legitimate sender role today: the hub
      # validator signs consensus messages, which never move its account, and
      # the retired proposer's live bindings are gone. A falling balance or a
      # moving nonce means the key sent a transaction. validator_hub is
      # critical (nothing should ever move it); proposer_retired is a warning
      # because 0x02B8 still names legacy genesis/admin roles whose use is
      # possible though not expected.
      - alert: ValidatorHubAccountMoved
        expr: |
          delta(aitbc_authority_balance_units{role="validator_hub"}[15m]) < 0
          or changes(aitbc_authority_nonce{role="validator_hub"}[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Hub validator account moved ({{ $labels.address }})"
          description: "Hub validator {{ $labels.address }} signs consensus messages and is never debited; its balance fell or its nonce changed, so its key sent a transaction. Treat the key as exposed until explained."

      - alert: ProposerRetiredAccountMoved
        expr: |
          delta(aitbc_authority_balance_units{role="proposer_retired"}[15m]) < 0
          or changes(aitbc_authority_nonce{role="proposer_retired"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Retired proposer account moved ({{ $labels.address }})"
          description: "Retired proposer {{ $labels.address }} holds a large residue and still names legacy genesis/admin roles; a falling balance or moving nonce means the custodied key signed a transaction — check whether it was expected."

  - name: aitbc-native-energy-rate
    rules:
      # Native AIT/EUR energy rate, exported by
      # scripts/monitoring/native-energy-rate-refresh.sh as a node_exporter
      # textfile on hub (every 12h). SD-7: the stored rate sat at the stub
      # value 1 for nine days and nothing noticed — a one-hour GPU quote
      # priced at 2 units instead of ~17M.
      - alert: NativeEnergyRateOutOfBand
        # Bounds mirror ENERGY_RATE_MIN/MAX_AIT_PER_EUR defaults (0.5/8) in
        # coordinator-api config.py and the refresher; keep them in sync.
        expr: |
          aitbc_native_energy_rate_ait_per_eur < 0.5
          or aitbc_native_energy_rate_ait_per_eur > 8
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Native energy rate out of plausible band ({{ $value }} AIT/EUR)"
          description: "The stored native_energy_rates value is {{ $value }} AIT/EUR, outside the plausible band [0.5, 8]. GPU quotes price against this rate — a stub or scale-slip here misprices every quote until fixed. The refresher is refusing to re-attest it; check aitbc-energy-rate journal."

      - alert: NativeEnergyRateStale
        # The oracle refuses quotes once observed_at is older than
        # ENERGY_MAX_RATE_AGE_SECONDS (86400). absent() covers the rate row
        # being deleted or disabled entirely.
        expr: |
          absent(aitbc_native_energy_rate_observed_timestamp_seconds)
          or time() - aitbc_native_energy_rate_observed_timestamp_seconds > 86400
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Native energy rate stale or missing"
          description: "The stored rate's observed_at is older than the 86400s quote window or the row is gone; the coordinator is refusing GPU energy quotes until a fresh rate lands. Check aitbc-native-energy-rate-refresh.timer and the coordinator POST endpoint."

      - alert: NativeEnergyRateRefreshStale
        # Refresher cadence is 12h plus up to 15m random delay; 13h catches a
        # single missed run without flapping.
        expr: |
          absent(aitbc_native_energy_rate_refresh_timestamp_seconds)
          or time() - aitbc_native_energy_rate_refresh_timestamp_seconds > 46800
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Energy rate refresher has not run"
          description: "aitbc_native_energy_rate.prom is missing or older than 13h; the NativeEnergyRate* alerts are blind and the stored rate drifts toward the staleness window. Check aitbc-native-energy-rate-refresh.timer on hub."

  - name: aitbc-escrow-gate
    rules:
      # EscrowSettlementRefusedOnHub: never-event. Hub holds the settlement
      # key, so the A10/A11 signing gate must never refuse here -- a firing
      # means the hub's RPC process lost its settlement key/address config
      # (env regression, keystore removal, bad deploy) and every escrow
      # settlement attempt is failing island-wide. The {node=""} selector
      # matches only hub's own locally scraped series on this Prometheus;
      # remote-written follower copies carry node=<host> and are covered by
      # EscrowSettlementRefusedOnFollower in aitbc_rules.yml. Deployed on hub
      # only, like the rest of this file.
      - alert: EscrowSettlementRefusedOnHub
        expr: increase(blockchain_escrow_settlement_refused_total{node=""}[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Escrow settlement gate refused on hub (op {{ $labels.op }})"
          description: "Hub's own blockchain-rpc process refused an escrow {{ $labels.op }} for missing settlement-signing capability — hub is the settlement node and must always be able to sign, so its settlement key/address config is broken (env regression, missing keystore, unset ESCROW_* / settlement vars after a deploy). Every escrow create/refund/release is now 503ing island-wide. Check the aitbc-blockchain-rpc env file and settlement key material on hub, and any recent pulls."

  - name: aitbc-bridge-set
    rules:
      # BridgeSetCannotMeetThreshold: the registered active bridge validator
      # set shares fewer members with the current consensus set than the
      # multisig threshold — every release-path proof fails closed. Locks are
      # OPEN (locks are no longer paused fleet-wide), so this is a live
      # blocker, not a dormant one — critical. Emitted by
      # scripts/monitoring/bridge-set-textfile.py via aitbc-bridge-set.timer.
      - alert: BridgeSetCannotMeetThreshold
        expr: aitbc_bridge_possible_signers < aitbc_bridge_threshold
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Bridge validator set cannot meet multisig threshold"
          description: "{{ $value }} active bridge validator(s) are current consensus attesters — below the configured multisig threshold — every bridge release proof fails closed while locks are open. Register the current attester set per the A36 addendum."

      # BridgeSetStale: the newest bridge_validators row is older than the
      # freshness grace window (bridge_validator_set_grace_period, default
      # 7200 s). _check_validator_set_freshness fails closed once the newest
      # registered_at ages out — a working set must be re-registered
      # inside the window. Locks are open, so a stale set is a live blocker;
      # kept at warning because it precedes actual settlement failure.
      - alert: BridgeSetStale
        expr: aitbc_bridge_set_fresh == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Bridge validator set is past its freshness window"
          description: "The set's freshness gauge is 0 (newest bridge_validators registration older than the grace window) — _check_validator_set_freshness now fails closed; with locks open, release proofs fail until the set is re-registered. Re-register the validator set or run the standing refresh job."

  # State-sync guards (C10). These series come from the node's own metrics
  # registry and reach hub via remote_write from every host. They cover the
  # follower's periodic state sync path that was disabled fleet-wide after
  # the 27207 incident (STATE_SYNC_MAX_GAP=-1) and is re-enabled per
  # TOPOLOGY/2026-10-08-v6-state-sync-runbook.md.
  #
  # state_sync_refused_total is incremented ONLY on a refusal — the series
  # does not exist until the first refusal (metrics_registry creates
  # counters lazily), so a rule on it would be dead-on-arrival the same way
  # blockchain_poa_broadcast_skipped_total was in the C4 audit. Until it is
  # pre-registered at startup (metrics.py:297-306 tuple) the refused path
  # is watched via the journal lines it emits, not by a rule here.
  - name: aitbc-state-sync
    rules:
      # ChainDiverged: a follower's block history disagrees with its sync
      # source — report_divergence set the sync_diverged gauge and the node
      # accepts no further blocks from that peer until resolved
      # (reset-follower-to-snapshot.sh). Critical: a diverged node is
      # silently off the chain, and this state does not self-heal.
      - alert: ChainDiverged
        expr: sync_diverged == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Follower block history diverged from its sync source ({{ $labels.instance }})"
          description: "sync_diverged is set — this node's block at the divergence height differs from the peer's. No block from that peer is imported until resolved; the node is off the canonical chain. Runbook: scripts/ops/reset-follower-to-snapshot.sh (see TOPOLOGY/2026-10-08-v6-state-sync-runbook.md for the abort context)."
          runbook: "TOPOLOGY/2026-10-08-v6-state-sync-runbook.md"

      # ChainDivergenceSeen: the divergence counter ticked — a detection
      # fired even if the gauge is not currently set (e.g. cleared between
      # scrapes by an operator running clear_divergence). Warning companion
      # to ChainDiverged so a transitory, already-resolved divergence still
      # leaves an alert trail.
      - alert: ChainDivergenceSeen
        expr: increase(sync_divergence_detected_total[15m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Chain divergence was detected and logged ({{ $labels.instance }})"
          description: "sync_divergence_detected_total increased in the last 15m — a divergence was noticed and logged (throttled). If the gauge is now clear it was already resolved; check the journal for 'Chain divergence'. Runbook: TOPOLOGY/2026-10-08-v6-state-sync-runbook.md."
          runbook: "TOPOLOGY/2026-10-08-v6-state-sync-runbook.md"
