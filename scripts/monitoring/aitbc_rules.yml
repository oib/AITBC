groups:
- name: aitbc
  rules:
  - record: aitbc:block_interval_seconds:rate5m
    expr: 60 / rate(blockchain_block_height[5m])
  - record: aitbc:rpc_requests_per_second:rate5m
    expr: rate(rpc_requests_total[5m])
  - record: aitbc:rpc_error_rate:ratio5m
    expr: "(\n  rate(rpc_client_errors_total[5m])\n  + rate(rpc_server_errors_total[5m])\n\
      ) / clamp_min(rate(rpc_requests_total[5m]), 1)\n"
  - record: aitbc:bridge_locked_amount
    expr: blockchain_bridge_total_locked_amount
  - alert: GossipBlockDeliveryFailing
    expr: "(\n  increase(gossip_mesh_publications_topic_blocks_bc_2[5m]) > 0\n  and\
      \ on() (increase(gossip_mesh_peer_publish_topic_blocks_bc_2[5m]) == 0)\n  and\
      \ on() (increase(gossip_mesh_peer_publish_failed_topic_blocks_bc_2[5m]) > 0)\n\
      )\n"
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: bc-2 blocks published on {{ $labels.instance }} but every peer push
        fails
      description: The proposer is publishing bc-2 blocks to the gossip mesh but no
        peer push succeeds — peers cannot hear this proposer and are falling back
        to pull-sync.
  - alert: BroadcastSkipped
    expr: increase(blockchain_poa_broadcast_skipped_total{chain_id!~".*island.*"}[5m])
      > 0
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: Block broadcast on {{ $labels.chain_id }} failed at publish
  - alert: ServiceDown
    expr: up == 0
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: Service {{ $labels.instance }} is down
  - alert: BlockProcessingTooSlow
    expr: histogram_quantile(0.95, rate(blockchain_block_processing_duration_seconds_bucket[5m]))
      > 1
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Block processing p95 exceeds 1 second
  - alert: RpcErrorsSpiking
    expr: "rate(rpc_server_errors_total[5m])\n  / clamp_min(rate(rpc_requests_total[5m]),\
      \ 1) > 0.05\nor (\n  rate(rpc_client_errors_total[5m])\n    / clamp_min(rate(rpc_requests_total[5m]),\
      \ 1) > 0.20\n  and rate(rpc_requests_total[5m]) > 0.5\n)\n"
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: RPC error rate is spiking
  - alert: SyncLagHigh
    expr: blockchain_sync_lag_blocks > 10
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Node is lagging on {{ $labels.chain_id }}
      description: Local chain on {{ $labels.chain_id }} is {{ $value }} blocks behind
        the remote peer.
  - alert: ChainHeadStalled
    expr: 'aitbc_messaging_chain_head_height > 0

      and (aitbc_messaging_chain_head_height - aitbc_messaging_chain_head_height offset
      15m) <= 0

      '
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: Chain head on {{ $labels.chain_id }} has not advanced for 15 minutes
        on {{ $labels.instance }}
      description: 'aitbc_messaging_chain_head_height on {{ $labels.instance }} has
        stayed at {{ $value }} for 15 min. Firing on every host means the chain stopped
        producing (check proposer rotation and attestations); firing on one host means
        that node stopped importing (check its sync peer and gossip). A failing scrape-time
        collect also freezes the gauge — look for ''messaging metrics: collect failed''
        in the rpc journal.'
  - alert: IslandHubSilent
    expr: aitbc_island_hub_silence_seconds > 600 and on(instance, job) aitbc_island_import_silence_seconds
      < 300
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: No hub-originated observation for 25+ minutes on {{ $labels.instance
        }}
      description: 'aitbc_island_hub_silence_seconds on {{ $labels.instance }} is
        {{ $value }}s. The monitor counts silence across every observation path —
        hub-proposed blocks (by any transport), pull-sync answers and hub RPC reads
        — so firing means the hub is dark on all of them while blocks from the other
        validators keep arriving. Check hub''s blockchain-node and RPC units and its
        network path to the validators. Not a failover trigger: promotion stays operator-gated
        (FAILOVER-PROMOTE-1).'
  - alert: IslandImportSilent
    expr: aitbc_island_import_silence_seconds >= 300
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: No block import for 20+ minutes on {{ $labels.instance }}
      description: 'aitbc_island_import_silence_seconds on {{ $labels.instance }}
        is {{ $value }}s: this node has imported no block from any validator on any
        transport (the gauge counts every accepted import on any transport), so its
        hub silence is not meaningful and IslandHubSilent stays quiet here by design.
        Check the node''s sync peer, gossip connections and network path. Firing on
        every follower means the island stopped producing (see ChainHeadStalled).'
  - alert: ChainHeadMetricMissing
    expr: up{job=~"(.*-)?blockchain-rpc"} == 1 unless on(instance, node) aitbc_messaging_chain_head_height
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: chain-head metric missing on {{ $labels.instance }}
      description: '{{ $labels.instance }} answers scrapes (up=1) but exposes no aitbc_messaging_chain_head_height,
        so ChainHeadStalled cannot see a stall there. Check for ''messaging metrics:
        collect failed'' in the rpc journal and that the metrics endpoint still serves
        the messaging family.'
  - alert: MempoolFull
    expr: blockchain_mempool_pending_count > 9000
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Mempool is filling on {{ $labels.chain_id }}
  - alert: ForkReorgUnsafe
    expr: increase(sync_fork_reorg_unsafe_total[10m]) > 0
    labels:
      severity: critical
    annotations:
      summary: Unsafe fork reorg refused on {{ $labels.instance }} — operator action
        required
      description: A peer branch won fork choice on {{ $labels.instance }} but the
        local losing segment is not provably empty; the node escalates instead of
        auto-reverting. Manual reconciliation needed.
  - alert: ForkOrphanedTxLost
    expr: increase(sync_fork_orphaned_tx_lost_total[10m]) > 0
    labels:
      severity: critical
    annotations:
      summary: Orphaned transaction lost after fork reorg on {{ $labels.instance }}
      description: A transaction that existed only on the losing fork segment on {{
        $labels.instance }} failed mempool requeue and is absent from the winning
        branch — the user's confirmed transaction disappeared. Reconcile and resubmit.
  - alert: ForkReorgUndone
    expr: increase(sync_fork_reorg_undone_total[10m]) > 0
    labels:
      severity: warning
    annotations:
      summary: Fork reorg auto-reverted blocks on {{ $labels.instance }}
      description: The delta journal undid a losing non-empty segment on {{ $labels.instance
        }}. Correct behavior, but confirmed transactions were displaced — check ForkOrphanedTxLost
        for any that failed requeue.
  - alert: ForkDomainRowOrphaned
    expr: increase(sync_fork_domain_rows_orphaned_total[10m]) > 0
    labels:
      severity: warning
    annotations:
      summary: Domain row orphaned by fork on {{ $labels.instance }}
      description: A stake/agent_stake/bounty_contract row lost its confirming lock
        transaction in a reorg on {{ $labels.instance }} and was marked orphaned.
        It revives automatically if the lock confirms on the winning branch.
  - alert: FaucetBudgetTripped
    expr: increase(coin_request_auto_budget_trips_total[15m]) > 0
    labels:
      severity: warning
    annotations:
      summary: Faucet auto-budget tripped on {{ $labels.instance }} ({{ $labels.window
        }})
      description: Automatic coin requests are parking on the exhausted {{ $labels.window
        }} budget on {{ $labels.instance }} — possible drain attempt.
  - alert: V9ShadowRejection
    expr: |-
      increase(v9_would_reject_total[10m])
      - on(instance, job) group_left()
      (
        sum by (instance, job) (
          increase({__name__=~"v9_would_reject_attest_(not_at_parent|check_error|no_state_access|db_corrupt)_total"}[10m])
        )
        or sum by (instance, job) (0 * increase(v9_would_reject_total[10m]))
      ) > 0
    labels:
      severity: warning
    annotations:
      summary: v9 transaction-authorization rule rejected on {{ $labels.instance }}
      description: A transaction on {{ $labels.instance }} failed a v9 rule — the
        v9_would_reject_* name is historical; v9 is enforced fleet-wide (env
        heights = 1 since the bc-3 reset), so these counters count real
        rejections, not shadow predictions. Liveness attestation refusals
        (not_at_parent, check_error, no_state_access, db_corrupt) are
        subtracted — they are node-health, covered by AttestationLagRefusal.
        Inspect the v9_would_reject_* detail counters and the node journal.
  - alert: V9AttestationRefusal
    expr: 'increase({__name__=~"v9_would_reject_attest_.*_total", __name__!~"v9_would_reject_attest_(not_at_parent|check_error|no_state_access|db_corrupt)_total"}[10m])
      > 0'
    labels:
      severity: warning
    annotations:
      summary: v9 attestation rule refused on {{ $labels.instance }}
      description: A validator on {{ $labels.instance }} refused to attest a
        block under a v9 content rule (signature, nonce order, tx-set/hash
        binding, size) — inspect the v9_would_reject_attest_* counters and the
        node journal. Liveness refusals (not_at_parent, check_error,
        no_state_access, db_corrupt) are excluded here and covered by
        AttestationLagRefusal.
  - alert: AttestationLagRefusal
    expr: increase(v9_would_reject_attest_not_at_parent_total[10m]) > 0
    labels:
      severity: info
    annotations:
      summary: Attestation refused on parent-binding (lag/fork) on {{ $labels.instance
        }}
      description: A validator on {{ $labels.instance }} refused attestations
        because the request's parent did not match its tip — fork protection or
        import lag working as designed (e.g. after a locked-db import stall).
        Node-health signal, not a v9 rule violation; investigate only if
        sustained or paired with sync/import errors.
  - alert: PrometheusWatchStale
    expr: 'absent(aitbc_prometheus_watch_poll_timestamp_seconds)

      or time() - aitbc_prometheus_watch_poll_timestamp_seconds > 300

      '
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Alert watcher heartbeat has stopped ({{ $labels.instance }})
      description: aitbc-prometheus-watch has not written its textfile metric for
        five minutes; alert events and webhook notifications on this node are blind.
        Check systemctl status aitbc-prometheus-watch.
  - alert: RemoteWriteFailing
    expr: rate(prometheus_remote_storage_samples_failed_total[15m]) > 0
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: remote_write samples being rejected on {{ $labels.instance }}
      description: Prometheus on {{ $labels.instance }} is losing remote_write batches
        ({{ $value }} samples/s rejected over 15m); a rejected batch drops every series
        it carries. Check the receiver journal for 'duplicate sample' or other non-recoverable
        400s.
  - alert: AITBCJournalErrors
    expr: aitbc_journal_error_messages{unit=~"aitbc-.*\\.service"} > 3
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.unit }} logged errors on {{ $labels.instance }}'
      description: '{{ $labels.unit }} produced {{ $value }} err-or-worse journal
        messages in the last 15 minutes. See the Service Journal card on alerts.html
        or: journalctl -u {{ $labels.unit }} -p err.'
  - alert: AITBCJournalScanStale
    expr: 'absent(aitbc_journal_scan_timestamp_seconds)

      or time() - aitbc_journal_scan_timestamp_seconds > 600

      '
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Journal-error collector has stopped ({{ $labels.instance }})
      description: aitbc_journal_scan_timestamp_seconds is absent or older than ten
        minutes on {{ $labels.instance }} — aitbc_journal_error_messages is frozen,
        so AITBCJournalErrors cannot see new service errors. Check systemctl status
        aitbc-journal-errors.timer.
  - alert: EscrowSettlementUnlanded
    expr: aitbc_escrow_unlanded_settlements > 0
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: Unlanded escrow settlement on {{ $labels.instance }} ({{ $value }}
        rows)
      description: An escrow row on {{ $labels.instance }} is marked released/refunded
        but its settlement hash never sealed — a dead hash is being served and custody
        is unresolved (provider unpaid or buyer unrefunded). The aitbc_escrow_unlanded_settlement{job_id,kind}
        series names the rows; repair per the S-8 remedy-2 path.
  - alert: EscrowSettlementCheckStale
    expr: time() - aitbc_escrow_settlement_scrape_timestamp_seconds > 600
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Escrow settlement check has stopped ({{ $labels.instance }})
      description: aitbc_escrow_settlement_scrape_timestamp_seconds is older than
        ten minutes on {{ $labels.instance }} — unlanded settlements are invisible
        on this host again. Check systemctl status aitbc-escrow-settlements.timer.
  - alert: EscrowSettlementCheckFailed
    expr: aitbc_escrow_settlement_scrape_success == 0
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Escrow settlement check cannot read {{ $labels.db }} ({{ $labels.instance
        }})
      description: aitbc_escrow_settlement_scrape_success is 0 for {{ $labels.db }}
        on {{ $labels.instance }} — the DB could not be opened or has no escrow table,
        so the unlanded count for it cannot be trusted. Check journalctl -u aitbc-escrow-settlements.service.
  - alert: EscrowRelayErrorRatio
    expr: "(\n  sum by (instance, relay) (increase(aitbc_escrow_relay_requests_total{result=~\"\
      upstream_5xx|chain_timeout\"}[15m]))\n  / clamp_min(sum by (instance, relay)\
      \ (increase(aitbc_escrow_relay_requests_total[15m])), 1)\n) > 0.2\nand\nsum\
      \ by (instance, relay) (increase(aitbc_escrow_relay_requests_total[15m])) >=\
      \ 5\n"
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Escrow relay {{ $labels.relay }} error ratio {{ $value | humanizePercentage
        }} on {{ $labels.instance }}
      description: More than 20% of {{ $labels.relay }} escrow relay requests over
        the last 15m ended in an upstream 5xx or a chain timeout on {{ $labels.instance
        }}. Check the settlement node's /rpc/escrow health and journalctl -u aitbc-coordinator-api.
  - alert: EscrowRelay425Storm
    expr: sum by (instance, relay) (increase(aitbc_escrow_relay_requests_total{result="too_early_425"}[15m]))
      > 20
    for: 0m
    labels:
      severity: warning
    annotations:
      summary: 425 storm on escrow relay {{ $labels.relay }} ({{ $labels.instance
        }})
      description: '{{ $value }} ''lock not yet sealed'' (425) answers from the {{
        $labels.relay }} relay on {{ $labels.instance }} in 15m — releases are racing
        unsealed locks, or the chain has stopped sealing ESCROW_LOCK transactions.
        Check the settlement node''s mempool and block production.'
  - alert: EscrowResidueStale
    expr: aitbc_escrow_residue_accounts > 0
    for: 6h
    labels:
      severity: warning
    annotations:
      summary: Sweepable escrow fee-leg residue on {{ $labels.instance }} ({{ $value
        }} rows)
      description: Terminal escrow rows on {{ $labels.instance }} hold residue classed
        fee leg older than the threshold — money a FEE_SWEEP could actually move.
        The informational aitbc_escrow_residue_stale_ledger_rows gauge shows the stale-ledger
        classes that need no action. List rows with scripts/ops/escrow_residue_dryrun.py;
        sweeping is an operator-approved chain write (ESCROW_FEE_SWEEP to the governed
        escrow_fee_recipient).
  - alert: EscrowResidueCheckStale
    expr: absent(aitbc_escrow_residue_scrape_timestamp_seconds) or time() - aitbc_escrow_residue_scrape_timestamp_seconds
      > 86400
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Escrow residue check has stopped ({{ $labels.instance }})
      description: aitbc_escrow_residue_scrape_timestamp_seconds is older than a day
        on {{ $labels.instance }} — stale residue is invisible again. Check the aitbc-escrow-residue
        timer.
  - alert: EscrowResidueCheckFailed
    expr: aitbc_escrow_residue_scrape_success == 0
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Escrow residue check cannot read {{ $labels.db }} ({{ $labels.instance
        }})
      description: aitbc_escrow_residue_scrape_success is 0 for {{ $labels.db }} on
        {{ $labels.instance }} — the residue count for that DB cannot be trusted.
  - alert: EscrowOpenTxOnlyLock
    expr: aitbc_escrow_open_tx_only_locks > 0
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: Unregistered open tx-only escrow locks on {{ $labels.instance }} ({{
        $value }})
      description: '{{ $value }} ESCROW_LOCK transaction(s) on {{ $labels.instance
        }} have no escrow row and no settlement leg — funds sit in custody that nothing
        will settle. The per-job series aitbc_escrow_open_tx_only_lock{job_id} names
        them. Response per docs/ops/escrow-settlement-ops.md: decide whether each
        belongs in the known-artifacts registry (documentation only, no chain write)
        or needs a chain refund.'
  - alert: EscrowChangePassStale
    expr: sum by (instance) (rate(blockchain_escrow_change_pass_total{result="tick"}[20m]))
      == 0
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: Owed-change pass not ticking on {{ $labels.instance }}
      description: blockchain_escrow_change_pass_total{result="tick"} has produced
        no increments for twenty minutes on {{ $labels.instance }} — the pass ran
        before and has stopped, so released escrows owing buyer change are not being
        settled. The tick fires on every enabled pass run, including an enabled-but-keyless
        one, so this means a hung or crashing pass, not a missing settlement key.
        If ESCROW_CHANGE_PASS_ENABLED was never set on this host the series does not
        exist and this rule cannot see it; otherwise check the node logs for 'ESCROW
        change pass' errors.
  - alert: EscrowFeeSweepPassStale
    expr: sum by (instance) (rate(blockchain_escrow_fee_sweep_pass_total{result="tick"}[20m]))
      == 0
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: Fee-residue pass not ticking on {{ $labels.instance }}
      description: blockchain_escrow_fee_sweep_pass_total{result="tick"} has produced
        no increments for twenty minutes on {{ $labels.instance }} — the pass ran
        before and has stopped, so settled fee residue is not being swept. The tick
        fires on every enabled pass run, including an enabled-but-keyless one, so
        this means a hung or crashing pass, not a missing settlement key. If ESCROW_FEE_SWEEP_PASS_ENABLED
        was never set on this host the series does not exist and this rule cannot
        see it; otherwise check the node logs for 'ESCROW fee sweep' errors.
  - alert: EscrowChangePassUnprovenRows
    expr: increase(blockchain_escrow_change_pass_total{result="deferred_unproven"}[6h])
      > 0
    for: 6h
    labels:
      severity: warning
    annotations:
      summary: Unproven released escrows accumulating on {{ $labels.instance }}
      description: The owed-change pass keeps deferring released escrow rows it cannot
        prove (missing billed record, unpaired release leg, or sealed value off the
        route's fee rule). These rows never refund automatically — triage per docs/ops/escrow-settlement-ops.md.
        Rows released before billed recording was added (A7) are a known baseline
        on hub.
  - alert: EscrowFeeSweepPassUnprovenRows
    expr: increase(blockchain_escrow_fee_sweep_pass_total{result="deferred_unproven"}[6h])
      > 0
    for: 6h
    labels:
      severity: warning
    annotations:
      summary: Unprovable fee residue accumulating on {{ $labels.instance }}
      description: The fee-residue pass keeps deferring settled escrows whose residue
        exceeds the provable fee bound — either owed buyer change is still in custody
        or the row carries an off-rule release shape. The residue is not treasury
        money until proven; triage per docs/ops/escrow-settlement-ops.md.
  - alert: EscrowFeeSweepChangePending
    expr: increase(blockchain_escrow_fee_sweep_pass_total{result="deferred_change_pending"}[5m])
      > 0
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: Provable escrow residue blocked on unpaid change on {{ $labels.instance
        }}
      description: The fee-residue pass keeps seeing a provable escrow whose residue
        exceeds the provable fee bound because owed buyer change is still in custody
        — it must not sweep until the change pass pays out. Check the change pass
        flags (ESCROW_CHANGE_PASS_ENABLED / ESCROW_CHANGE_PASS_DRY_RUN) and the row's
        billed_legs; triage per docs/ops/escrow-settlement-ops.md.
  - alert: EscrowChangePassErrors
    expr: increase(blockchain_escrow_change_pass_total{result="error"}[1h]) > 0
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: Owed-change pass submissions failing on {{ $labels.instance }}
      description: The owed-change pass has been erroring for over thirty minutes
        on {{ $labels.instance }} — change refunds are being attempted and failing
        (per-job exponential backoff applies). Check the node logs for 'ESCROW change
        pass' and proposer RPC reachability.
  - alert: EscrowFeeSweepPassErrors
    expr: increase(blockchain_escrow_fee_sweep_pass_total{result="error"}[1h]) > 0
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: Fee-residue pass submissions failing on {{ $labels.instance }}
      description: The fee-residue pass has been erroring for over thirty minutes
        on {{ $labels.instance }} — sweeps are being attempted and failing (per-job
        exponential backoff applies). Check the node logs for 'ESCROW fee sweep' and
        proposer RPC reachability.
  - alert: EscrowSettlementRefusedOnFollower
    expr: increase(blockchain_escrow_settlement_refused_total{node!=""}[15m]) > 0
    for: 5m
    labels:
      severity: info
    annotations:
      summary: Escrow settlement refused on follower {{ $labels.node }} (op {{ $labels.op
        }})
      description: The settlement-signing gate on {{ $labels.node }} refused an escrow
        {{ $labels.op }} within the last 15m — intended fail-closed behaviour on a
        follower, so a caller is still directing settlement-bound escrow calls at
        a node that cannot sign them. The 503 detail names the settlement hub endpoint;
        repoint the caller there, or check for a stale script/config still targeting
        {{ $labels.instance }}.
- name: aitbc-systemd-units
  rules:
  - alert: AitbcSystemdUnitFailed
    expr: node_systemd_unit_state{name=~"aitbc-.+", state="failed"} == 1
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: AITBC unit {{ $labels.name }} failed on {{ $labels.instance }}
      description: 'systemd unit {{ $labels.name }} (job {{ $labels.job }}) has been
        in the failed state >15m. Check: systemctl status {{ $labels.name }} ; journalctl
        -u {{ $labels.name }} -n 50. On hosts with remote-write, the same unit may
        alert on both the local and the central Prometheus — the instance label identifies
        the reporting scraper, not necessarily the host running the unit.'
  - alert: AitbcSystemdCollectorMissing
    expr: up{job=~"node.*", node=""} == 1 unless on(instance) count by (instance)
      (node_systemd_unit_state{node=""})
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: node-exporter on {{ $labels.instance }} exposes no systemd-unit series
      description: The node job on {{ $labels.instance }} (job {{ $labels.job }})
        is up but has exported no node_systemd_unit_state series for >15m — its --collector.systemd
        is disabled, so AitbcSystemdUnitFailed is blind there. Enable the collector
        in the node-exporter unit and restart it.
- name: aitbc-cgroup-oom
  rules:
  - alert: CgroupOomKill
    expr: increase(aitbc_cgroup_oom_kill_total[15m]) > 0
    for: 0m
    labels:
      severity: critical
    annotations:
      summary: New OOM kill in cgroup {{ $labels.cgroup }} ({{ $labels.instance }})
      description: 'aitbc_cgroup_oom_kill_total for cgroup {{ $labels.cgroup }} increased
        over the last 15m on {{ $labels.instance }} — the kernel killed a process
        in that scope. A root or slice-scope kill is enforced by the container/systemd
        limit, not the unit''s own MemoryMax, so per-unit memory.events stays at 0:
        check memory-monitor.log and journalctl -k/systemctl --failed for the victim.'
- name: aitbc-attestation-arrival
  rules:
  - alert: AttestationArrivalDegraded
    expr: aitbc_attestation_arrival_share{db!~".*island.*"} < 0.97
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: Remote attestation arrival degraded on {{ $labels.instance }} (share
        {{ $value }})
      description: aitbc_attestation_arrival_share for {{ $labels.db }} is below 0.97
        over the last window — a remote validator's attestations are arriving too
        late to seal (or not at all). On a 4-validator set, one validator missing
        ~10% of its owed blocks lands the share near 0.967; the V-9 baseline is ~0.9967.
        aitbc_attestation_missed_blocks{validator=...} names who is missing; check
        that validator's connectivity and the proposer journal 'Attestation arrival:'
        lines.
  - alert: AttestationValidatorSilent
    expr: aitbc_attestation_consecutive_missed{db!~".*island.*",validator!="genesis"} >= 20
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Validator {{ $labels.validator }} silent for {{ $value }} consecutive
        owed blocks ({{ $labels.instance }})
      description: aitbc_attestation_consecutive_missed shows {{ $labels.validator
        }} missed every remote attestation it owed for >=20 blocks back from the head
        on {{ $labels.db }} — likely down or partitioned. Check that validator's node
        and its attestation signer.
  - alert: AttestationArrivalCheckStale
    expr: time() - aitbc_attestation_scrape_timestamp_seconds > 3600
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Attestation arrival check has stopped ({{ $labels.instance }})
      description: aitbc_attestation_scrape_timestamp_seconds is older than an hour
        on {{ $labels.instance }} — attestation arrival is invisible again. Check
        the exporter run/timer once wired.
  - alert: AttestationArrivalCheckFailed
    expr: aitbc_attestation_scrape_success == 0
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Attestation arrival check cannot read {{ $labels.db }} ({{ $labels.instance
        }})
      description: aitbc_attestation_scrape_success is 0 for {{ $labels.db }} on {{
        $labels.instance }} — the DB could not be opened or has no block table, so
        the arrival share cannot be trusted.
- name: aitbc-backup-freshness
  rules:
  - alert: BackupStale
    expr: time() - aitbc_backup_last_generation_timestamp_seconds > 30 * 3600
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: No fresh backup generation on {{ $labels.instance }}
      description: The newest generation under /var/backups/aitbc on {{ $labels.instance
        }} is older than 30 h — tonight's aitbc-backup run did not land. Check systemctl
        status aitbc-backup.timer and journalctl -u aitbc-backup.service.
  - alert: BackupFailed
    expr: aitbc_backup_last_run_success == 0
    for: 15m
    labels:
      severity: critical
    annotations:
      summary: aitbc-backup.service failed on {{ $labels.instance }}
      description: The last aitbc-backup.service run on {{ $labels.instance }} did
        not end Result=success. Check journalctl -u aitbc-backup.service -n 50.
  - alert: BackupExporterMissing
    expr: time() - aitbc_backup_exporter_timestamp_seconds > 3600
    for: 1h
    labels:
      severity: warning
    annotations:
      summary: Backup freshness exporter has stopped ({{ $labels.instance }})
      description: aitbc_backup_exporter_timestamp_seconds is older than an hour on
        {{ $labels.instance }} — backup staleness is invisible on this host again.
        Check systemctl status aitbc-backup-metrics.timer.
  - alert: BackupSizeCollapse
    expr: 'aitbc_backup_last_generation_bytes < 0.5 * quantile_over_time(0.5, aitbc_backup_last_generation_bytes[7d])

      and aitbc_backup_last_generation_bytes < 0.6 * max_over_time(aitbc_backup_last_generation_bytes[2d])

      '
    for: 1h
    labels:
      severity: warning
    annotations:
      summary: Newest backup generation is under 50% of the 7-day median on {{ $labels.instance
        }}
      description: The newest generation on {{ $labels.instance }} is {{ $value }}
        bytes — under half its own 7-day median. Check the run journal for skipped
        sources or truncated artifacts.
  - alert: BackupNoGoodChain
    expr: aitbc_backup_last_good_generation_timestamp_seconds == 0
    for: 1h
    labels:
      severity: warning
    annotations:
      summary: No backup generation holds a valid current-chain dump on {{ $labels.instance
        }}
      description: aitbc-backup on {{ $labels.instance }} has no generation containing
        a good dump of the active chain id — its prune step is skipping entirely and
        no restorable chain artifact exists. Check the run journal for 'pruning skipped
        entirely' and verify the chain artifact name matches CHAIN_ID.
  - alert: OffsitePullStale
    expr: time() - aitbc_offsite_pull_last_success_timestamp_seconds > 36 * 3600
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: Off-site backup pull has not succeeded for over 36 h
      description: aitbc_offsite_pull_last_success_timestamp_seconds is older than
        36 h — the IDE host's off-site pull has not succeeded; that includes the IDE
        host being powered down or unreachable. Run offsite-pull-backups.sh --status
        on the IDE host.
- name: aitbc-env-watch
  rules:
  - alert: AITBCReceiptSigningKeyAbsent
    expr: aitbc_env_var_present{var="RECEIPT_SIGNING_KEY_HEX"} == 0
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: RECEIPT_SIGNING_KEY_HEX absent from coordinator env on {{ $labels.instance
        }}
      description: No coordinator env file on {{ $labels.instance }} assigns RECEIPT_SIGNING_KEY_HEX
        — the next aitbc-coordinator-api restart leaves JobReceipt signing disabled
        and paid jobs unreleasable. Restore the key into /etc/aitbc/aitbc-coordinator-api(-override).env
        before the service restarts.
  - alert: AITBCEnvWatchStale
    expr: time() - aitbc_env_watch_timestamp_seconds > 2700
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: Env-watch exporter has stopped ({{ $labels.instance }})
      description: aitbc_env_watch_timestamp_seconds is older than 45 minutes on {{
        $labels.instance }} — env-var presence is no longer being checked. Check systemctl
        status aitbc-env-watch.timer.
- name: aitbc-messaging
  rules:
  - alert: MessagingIndexLag
    expr: aitbc_messaging_index_lag_blocks > 50
    for: 10m
    labels:
      severity: info
    annotations:
      summary: Messaging index lags the chain head on {{ $labels.instance }}
      description: aitbc_messaging_index_lag_blocks is {{ $value }} on {{ $labels.instance
        }} for 10m — the derived forum index is reading more than 50 blocks behind
        the local head. See docs/ops/messaging-operability.md.
  - alert: MessagingIndexDigestMismatch
    expr: count by (chain_id, checkpoint) (count by (chain_id, checkpoint, digest)
      (aitbc_messaging_index_digest)) > 1
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: Messaging index digests differ between nodes (checkpoint {{ $labels.checkpoint
        }})
      description: More than one distinct aitbc_messaging_index_digest exists for
        {{ $labels.chain_id }} at checkpoint {{ $labels.checkpoint }} — at least one
        node derived different forum state from the same sealed rows. Compare topics
        per docs/ops/messaging-operability.md; never 'fix' by restarting first.
  - alert: MessagingReadErrors
    expr: rate(aitbc_messaging_read_errors_total[10m]) > 0.1
    for: 15m
    labels:
      severity: info
    annotations:
      summary: Messaging reads are erroring on {{ $labels.instance }}
      description: rate(aitbc_messaging_read_errors_total) exceeds 0.1/s for 15m on
        {{ $labels.instance }} (route {{ $labels.route }}). 4xx and 5xx both count;
        check whether the rate limiter or a bad query is the cause first.
  - alert: MessagingVolumeSpike
    expr: increase(aitbc_messaging_messages_total[1h]) > 50 and increase(aitbc_messaging_messages_total[1h])
      > 3 * (increase(aitbc_messaging_messages_total[6h] offset 1h) / 6)
    for: 15m
    labels:
      severity: info
    annotations:
      summary: Messaging volume spike on {{ $labels.instance }}
      description: Message count grew {{ $value | humanize }} in the last hour on
        {{ $labels.instance }} — over 3x the trailing 6h hourly rate and above the
        50/h floor (the floor keeps a quiet forum from alerting on a handful of posts).
        Check for a spam run before treating it as growth.
- name: aitbc-tmp-guard
  rules:
  - alert: AITBCTmpfsHigh
    expr: 1 - (node_filesystem_avail_bytes{mountpoint="/tmp",fstype="tmpfs"} / node_filesystem_size_bytes{mountpoint="/tmp",fstype="tmpfs"})
      > 0.5
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: /tmp (tmpfs) over 50% on {{ $labels.instance }} — RAM pressure
      description: tmpfs /tmp usage {{ $value | humanizePercentage }} for 30m on {{
        $labels.instance }} — likely accumulated test/archive debris charged to the
        container cgroup (see tasks/NODE2-TMP-GUARD.md).
- name: chain_isolation_alerts
  interval: 30s
  rules:
  - alert: ChainIsolationViolationDetected
    expr: increase(chain_isolation_violations_total[15m]) > 0
    for: 0s
    labels:
      severity: critical
      component: blockchain
    annotations:
      summary: Chain isolation violation detected
      description: Chain isolation violation of type {{ $labels.violation_type }}
        detected on node {{ $labels.node }}
  - alert: CrossChainTransactionAttempt
    expr: rate(cross_chain_transaction_attempts_total[5m]) > 0
    for: 1m
    labels:
      severity: warning
      component: blockchain
    annotations:
      summary: Cross-chain transaction attempts detected
      description: '{{ $value }} cross-chain transaction attempts per second from
        {{ $labels.source_chain }} to {{ $labels.target_chain }} on node {{ $labels.node
        }}'
  - alert: ChainIdValidationFailure
    expr: rate(chain_id_validation_failures_total[5m]) > 0
    for: 1m
    labels:
      severity: warning
      component: blockchain
    annotations:
      summary: Chain ID validation failures detected
      description: '{{ $value }} chain_id validation failures per second (expected:
        {{ $labels.expected_chain }}, actual: {{ $labels.actual_chain }}) on node
        {{ $labels.node }}'
  - alert: BridgeRequestChainMismatch
    expr: rate(bridge_request_chain_mismatches_total[5m]) > 0
    for: 1m
    labels:
      severity: warning
      component: coordinator-api
    annotations:
      summary: Bridge request chain mismatches detected
      description: '{{ $value }} bridge request chain mismatches per second from {{
        $labels.source_chain }} to {{ $labels.target_chain }} on node {{ $labels.node
        }}'
