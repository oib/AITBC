# Prometheus Configuration for AITBC Monitoring
#
# This is a sample configuration. The live file is /etc/prometheus/prometheus.yml
# on the node that runs the central Prometheus instance (recommended: node2).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'aitbc'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

# Load rules once and periodically evaluate them.
# Deployed rule files in /etc/prometheus are copies of the ones in this
# directory, not symlinks: sync them, run promtool, then reload (the
# authoritative steps are in scripts/monitoring/check-rules-deployed.sh,
# which exits 1 whenever a deployed file drifts from its repo copy).
rule_files:
  - aitbc_rules.yml

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['127.0.0.1:9090']

  # Node exporter on the central host
  - job_name: 'node-exporter-local'
    static_configs:
      - targets: ['127.0.0.1:9100']

  # node2 (shop/follower) services
  - job_name: 'blockchain-node'
    static_configs:
      - targets: ['127.0.0.1:8202']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # The blockchain node main process exposes chain-level metrics on AITBC_NODE_METRICS_PORT.
  - job_name: 'node2-blockchain-node'
    static_configs:
      - targets: ['127.0.0.1:9009']
        labels:
          node: node2
          service: blockchain-node
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'trading'
    static_configs:
      - targets: ['127.0.0.1:8104']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'governance'
    static_configs:
      - targets: ['127.0.0.1:8105']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'pool-hub'
    static_configs:
      - targets: ['127.0.0.1:8210']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # The agent-coordinator only runs on hub — it is scraped there as job
  # `agent-coordinator` at 127.0.0.1:8107 with metrics_path /v1/metrics
  # (NOT /metrics — that 404s; the monitoring router mounts under /v1).
  # Services that do not run on this node are not listed even commented out:
  # a dead scrape target only produces scrape errors.

  # Island IPFS perimeter probe — REWORKED in #1271.
  #
  # The original design here was a blackbox_exporter job
  # (`blackbox-incus-proxy`, modules from blackbox.yml) scraping the public
  # :4002 listeners. It was never deployable against these targets: the
  # island swarm is a libp2p PRIVATE network — peers must complete the pnet
  # handshake before multistream, so an unauthenticated probe gets
  # accept-then-FIN by design and probe_success could only ever read 0.
  # blackbox.yml stays in the repo for future NON-pnet targets.
  #
  # The working watch is aitbc-island-swarm-probe.timer on each island
  # member: `ipfs swarm connect` (real swarm-key auth) to every OTHER
  # member's public multiaddr, exported via the node_exporter textfile as
  # aitbc_island_swarm_probe_success{peer,instance} and remote-written to
  # hub. IncusProxyProbeFailed/IncusProxyProbeSilent in aitbc_hub_rules.yml
  # evaluate those series. Deliberately not listed as scrape targets:
  #   <incus-host> node2/blockchain-p2p tcp:0.0.0.0:8200 -> <node2-addr>:8200 —
  #     nothing listens on the backend port (bc-2 gossip is
  #     redis-brokered; P2P_BIND_PORT is vestigial). The device needs an
  #     ops decision, not a probe that alerts forever.
  #   loopback-bound devices, unreachable from hub (need an exporter on
  #   the incus host itself):
  #   <edge-perimeter> ntfy/ntfyproxy      tcp:127.0.0.1:2586
  #   <incus-host> node0/coordinator-proxy tcp:127.0.0.1:18000
  #   <incus-host> node1/coordinator-proxy tcp:127.0.0.1:18001
