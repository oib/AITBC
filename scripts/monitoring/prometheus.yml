# Prometheus Configuration for AITBC Monitoring
#
# This is a sample configuration. The live file is /etc/prometheus/prometheus.yml
# on the node that runs the central Prometheus instance (recommended: aitbc3).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'aitbc'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

# Load rules once and periodically evaluate them
rule_files:
  - aitbc_rules.yml

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node exporter on the central host
  - job_name: 'node-exporter-local'
    static_configs:
      - targets: ['localhost:9100']

  # aitbc3 (shop/follower) services
  # The blockchain node main process exposes chain-level metrics on AITBC_NODE_METRICS_PORT.
  - job_name: 'aitbc3-blockchain-node'
    static_configs:
      - targets: ['localhost:9009']
        labels:
          node: aitbc3
          service: blockchain-node
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'aitbc3-blockchain-rpc'
    static_configs:
      - targets: ['localhost:8202']
        labels:
          node: aitbc3
          service: blockchain-rpc
    metrics_path: '/metrics'
    scrape_interval: 15s
    metric_relabel_configs:
      # The RPC process inherits many node-only prometheus_client metrics but does not
      # update them. Drop the stale zero-valued copies; the authoritative values come
      # from the aitbc3-blockchain-node target on port 9009.
      - source_labels: [__name__]
        regex: 'blockchain_block_height|blockchain_poa_valid_subscribers|blockchain_poa_broadcast_skipped_total|blockchain_sync_lag_blocks|blockchain_subscription_.*'
        action: drop

  # Coordinator API and marketplace only run on the hub node by default.
  # - job_name: 'aitbc3-coordinator-api'
