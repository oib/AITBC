# Prometheus Configuration for AITBC Monitoring
#
# This is a sample configuration. The live file is /etc/prometheus/prometheus.yml
# on the node that runs the central Prometheus instance (recommended: aitbc3).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'aitbc'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

# Load rules once and periodically evaluate them
rule_files:
  - aitbc_rules.yml

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node exporter on the central host
  - job_name: 'node-exporter-local'
    static_configs:
      - targets: ['localhost:9100']

  # aitbc3 (shop/follower) services
  # The blockchain node main process exposes chain-level metrics on AITBC_NODE_METRICS_PORT.
  - job_name: 'aitbc3-blockchain-node'
    static_configs:
      - targets: ['localhost:9009']
        labels:
          node: aitbc3
          service: blockchain-node
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'aitbc3-blockchain-rpc'
    static_configs:
      - targets: ['localhost:8202']
        labels:
          node: aitbc3
          service: blockchain-rpc
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'aitbc3-coordinator-api'
    static_configs:
      - targets: ['localhost:8203']
        labels:
          node: aitbc3
          service: coordinator-api
    metrics_path: '/prometheus'
    scrape_interval: 15s

  - job_name: 'aitbc3-marketplace'
    static_configs:
      - targets: ['localhost:8104']
        labels:
          node: aitbc3
          service: marketplace
    metrics_path: '/metrics'
    scrape_interval: 15s

  # hub.aitbc (hub/customer) services
  - job_name: 'hub-blockchain-node'
    static_configs:
      - targets: ['hub.aitbc.bubuit.net:9009']
        labels:
          node: hub
          service: blockchain-node
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'hub-blockchain-rpc'
    static_configs:
      - targets: ['hub.aitbc.bubuit.net:8202']
        labels:
          node: hub
          service: blockchain-rpc
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'hub-coordinator-api'
    static_configs:
      - targets: ['hub.aitbc.bubuit.net:8203']
        labels:
          node: hub
          service: coordinator-api
    metrics_path: '/prometheus'
    scrape_interval: 15s

  # Optional: pool-hub, governance, trading when they expose /metrics
  # - job_name: 'aitbc3-pool-hub'
  #   static_configs:
  #     - targets: ['localhost:8210']
  #   metrics_path: '/metrics'
