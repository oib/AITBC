# Prometheus Configuration for AITBC Monitoring
#
# This is a sample configuration. The live file is /etc/prometheus/prometheus.yml
# on the node that runs the central Prometheus instance (recommended: aitbc3).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'aitbc'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

# Load rules once and periodically evaluate them
rule_files:
  - aitbc_rules.yml

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['127.0.0.1:9090']

  # Node exporter on the central host
  - job_name: 'node-exporter-local'
    static_configs:
      - targets: ['127.0.0.1:9100']

  # aitbc3 (shop/follower) services
  # The blockchain node main process exposes chain-level metrics on AITBC_NODE_METRICS_PORT.
  - job_name: 'blockchain-node'
    static_configs:
      - targets: ['localhost:8202']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'aitbc3-blockchain-node'
    static_configs:
      - targets: ['127.0.0.1:9009']
        labels:
          node: aitbc3
          service: blockchain-node
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'trading'
    static_configs:
      - targets: ['localhost:8104']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'governance'
    static_configs:
      - targets: ['localhost:8105']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'pool-hub'
    static_configs:
      - targets: ['localhost:8210']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Coordinator API and marketplace only run on the hub node by default.
  # - job_name: 'aitbc3-coordinator-api'
  #   static_configs:
  #     - targets: ['127.0.0.1:8203']
