<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Detail — AITBC</title>
    <meta name="robots" content="noindex">
    <meta name="description" content="Block detail for the AITBC explorer: height, hash, timestamp, and transactions of a single chain block.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=b4cdafdfa906c607">
    <link rel="stylesheet" href="/style.css?v=b4cdafdfa906c607">
    <style>
        .detail-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }
        .detail-header h2 {
            margin: 0;
        }
        #block-hash-display {
            display: inline-block;
            max-width: 100%;
            overflow-wrap: break-word;
            word-break: break-all;
        }

        .clickable-value {
            cursor: pointer;
            color: var(--primary);
        }
        .clickable-value:hover {
            text-decoration: underline;
        }
    </style>
<script src="copy.js?v=b4cdafdfa906c607" defer></script>
<script src="status.js?v=b4cdafdfa906c607" defer></script>
</head>
<body>
    <!-- aitbc-skip:start -->
    <a href="#main" class="skip-link">Skip to content</a>
    <!-- aitbc-skip:end -->
    <div class="container">
        <noscript><p class="endpoint-note">This page renders live data via JavaScript. Machine-readable sources: <a href="/llms.txt">llms.txt</a> &middot; <a href="/openapi.json">Coordinator API</a> &middot; <a href="/explorer-api/openapi.json">Explorer API</a>.</p></noscript>
        <header>
            <!-- aitbc-menu:start -->
            <nav class="header-nav" aria-label="Main">
                <a href="/">Home</a>
                <a href="/exchange.html">Exchange</a>
                <a href="/explorer.html">Explorer</a>
                <a href="/marketplace.html">Marketplace</a>
                <a href="/bridges.html">Bridges</a>
                <a href="/alerts.html">Alerts</a>
                <a href="/messages.html">Messages</a>
            </nav>
            <!-- aitbc-menu:end -->
            <h1>Block Detail</h1>
        </header>

        <!-- aitbc-status:start -->
        <div class="status-strip" role="status" aria-live="polite"></div>
        <!-- aitbc-status:end -->

        <main id="main" tabindex="-1">
            <span id="sr-announcer" class="visually-hidden" role="status" aria-live="polite"></span>

        <div id="loading" class="loading">Loading block...</div>
        <div id="content" style="display:none;">
            <div class="detail-header">
                <span class="badge badge-primary">BLOCK</span>
                <span id="block-height-badge">#--</span>
                <span id="block-hash-display" style="font-size:0.8rem;color:var(--text-muted);font-family:var(--font-mono);"></span>
            </div>

            <div id="block-details"></div>

            <div class="card" style="margin-top:1.5rem;">
                <h2>Transactions <span id="tx-count"></span></h2>
                <div id="tx-list"></div>
            </div>
        </div>

        <div id="error" class="loading" style="display:none; color:#ef4444;"></div>
        </main>
        <!-- aitbc-footer:start -->
        <footer class="site-footer">
            <a href="https://github.com/oib/AITBC">GitHub</a>
            <a href="/llms.txt">llms.txt</a>
            <a href="/openapi.json">Coordinator API</a>
            <a href="/explorer-api/openapi.json">Explorer API</a>
        </footer>
        <!-- aitbc-footer:end -->
    </div>

    <script>
        const EXPLORER_API_URL = '/explorer-api';

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function getParam(name) {
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }


        async function loadBlock() {
            const height = getParam('height');
            const hash = getParam('hash');

            if (!height && !hash) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').textContent = 'Missing block height or hash parameter';
                document.getElementById('error').style.display = 'block';
                return;
            }

            try {
                let data;
                let resp;
                if (height) {
                    resp = await fetch(`${EXPLORER_API_URL}/api/blocks/${height}`);
                } else {
                    resp = await fetch(`${EXPLORER_API_URL}/api/blocks/by-hash/${hash}`);
                }
                // A failed reply is not "not found" — only a 404 or a proven
                // body without a block is.
                if (!resp.ok) {
                    throw new Error(resp.status === 404
                        ? 'Block not found'
                        : `Block could not be loaded (HTTP ${resp.status}). This is not a "not found".`);
                }
                try {
                    data = await resp.json();
                } catch (e) {
                    throw new Error('Block reply was not readable JSON');
                }

                if (!data || !data.height) {
                    throw new Error('Block not found');
                }

                document.title = `AITBC Block #${data.height}`;
                document.getElementById('block-height-badge').textContent = `#${data.height}`;
                document.getElementById('block-hash-display').textContent = data.hash || '';

                function plainHash(hash) {
                    if (!hash || hash === 'N/A') return 'N/A';
                    return `<span style="font-family:var(--font-mono);">${escapeHtml(hash)}</span>`;
                }
                function addrLink(addr) {
                    if (!addr || addr === 'N/A') return 'N/A';
                    return `<a href="/search.html?query=${encodeURIComponent(addr)}" class="clickable-value" title="Search address">${escapeHtml(addr)}</a>`;
                }

                document.getElementById('block-details').innerHTML = `
                    <div class="endpoint fade-in block-item" style="padding:0;">
                        <table class="block-list-table" aria-label="Block details">
                            <tr><th scope="row">Height</th><td><span class="badge badge-primary">BLOCK</span> #${escapeHtml(data.height)}</td></tr>
                            <tr><th scope="row">Hash</th><td>${plainHash(data.hash)} ${aitbcCopyBtn(data.hash || '', 'block hash')}</td></tr>
                            <tr><th scope="row">Proposer</th><td>${addrLink(data.proposer)} ${aitbcCopyBtn(data.proposer || '', 'proposer address')}</td></tr>
                            <tr><th scope="row">Timestamp</th><td>${escapeHtml(data.timestamp ? aitbcFmt.date(data.timestamp) : 'N/A')}</td></tr>
                            <tr><th scope="row">Transactions</th><td>${escapeHtml(data.txCount ?? data.transactions?.length ?? 0)}</td></tr>
                            <tr><th scope="row">State Root</th><td>${plainHash(data.stateRoot)} ${aitbcCopyBtn(data.stateRoot || '', 'state root')}</td></tr>
                        </table>
                    </div>
                `;

                const txs = data.transactions || [];
                document.getElementById('tx-count').textContent = `(${txs.length})`;
                document.getElementById('tx-list').innerHTML = txs.map(tx => {
                    // One malformed payload must not blank the whole block.
                    let payloadAmount = 'N/A';
                    try {
                        payloadAmount = tx.payload ? (JSON.parse(tx.payload).amount || 'N/A') : 'N/A';
                    } catch (e) { payloadAmount = 'N/A'; }
                    const amount = tx.amount != null ? tx.amount : payloadAmount;
                    return `
                    <div class="endpoint fade-in block-item" style="cursor:pointer;padding:0;" tabindex="0" role="link" onkeydown="if(event.key==='Enter'&&event.target===this)this.click()" onclick="location.href='/tx.html?hash=${encodeURIComponent(tx.tx_hash)}'">
                        <table class="block-list-table" aria-label="Block details">
                            <tr><th scope="row">Type</th><td><span class="badge badge-primary">${escapeHtml(tx.type || 'TX')}</span></td></tr>
                            <tr><th scope="row">Hash</th><td>${escapeHtml(tx.tx_hash)} ${aitbcCopyBtn(tx.tx_hash, 'transaction hash')}</td></tr>
                            <tr><th scope="row">From</th><td>${addrLink(tx.sender)}</td></tr>
                            <tr><th scope="row">To</th><td>${addrLink(tx.recipient)}</td></tr>
                            <tr><th scope="row">Amount</th><td><strong>${escapeHtml(amount)}</strong> AIT</td></tr>
                            <tr><th scope="row">Fee</th><td>${escapeHtml(tx.fee != null ? tx.fee : 'N/A')}</td></tr>
                            <tr><th scope="row">Nonce</th><td>${escapeHtml(tx.nonce != null ? tx.nonce : 'N/A')}</td></tr>
                            <tr><th scope="row">Status</th><td>${escapeHtml(tx.status || 'N/A')}</td></tr>
                            <tr><th scope="row">Time</th><td>${escapeHtml(tx.created_at ? aitbcFmt.date(tx.created_at) : 'N/A')}</td></tr>
                        </table>
                    </div>
                    `;
                }).join('') || '<p class="loading-text">No transactions in this block.</p>';

                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            } catch (err) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').textContent = err.message || 'Failed to load block';
                document.getElementById('error').style.display = 'block';
            }
        }

        document.addEventListener('DOMContentLoaded', loadBlock);
    </script>
</body>
</html>
