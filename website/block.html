        <!-- aitbc-status:end -->

        <main id="main" tabindex="-1">
            <span id="sr-announcer" class="visually-hidden" role="status" aria-live="polite"></span>

        <div id="loading" class="loading">Loading block...</div>
        <div id="content" hidden>
            <div class="detail-header">
                <span id="block-kind-badge" class="badge badge-primary"></span>
                <span id="block-height-badge">#--</span>
                <span id="block-hash-display" class="detail-hash"></span>
            </div>

            <div id="block-details"></div>

            <div class="card mt-1-5">
                <h2>Transactions <span id="tx-count"></span></h2>
                <div id="tx-list"></div>
            </div>
        </div>

        <div id="error" class="loading detail-error" hidden></div>
