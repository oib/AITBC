<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results — AITBC</title>
    <meta name="robots" content="noindex">
    <meta name="description" content="AITBC explorer search results for an address, transaction hash, or block height.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=6d6a8c14238ba6cd">
    <link rel="stylesheet" href="/style.css?v=6d6a8c14238ba6cd">
    <style>
        .search-query {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        .section-title {
            margin: 1.5rem 0 0.5rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .dir-badge {
            display: inline-block;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 600;
            margin-left: 0.5rem;
        }
        .dir-out { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
        .dir-in { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .dir-self { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
    </style>
<script src="copy.js?v=6d6a8c14238ba6cd" defer></script>
<script src="status.js?v=6d6a8c14238ba6cd" defer></script>
</head>
<body>
    <!-- aitbc-skip:start -->
    <a href="#main" class="skip-link">Skip to content</a>
    <!-- aitbc-skip:end -->
    <div class="container">
        <noscript><p class="endpoint-note">This page renders live data via JavaScript. Machine-readable sources: <a href="/llms.txt">llms.txt</a> &middot; <a href="/openapi.json">Coordinator API</a> &middot; <a href="/explorer-api/openapi.json">Explorer API</a>.</p></noscript>
        <header>
            <!-- aitbc-menu:start -->
            <nav class="header-nav" aria-label="Main">
                <a href="/">Home</a>
                <a href="/exchange.html">Exchange</a>
                <a href="/explorer.html">Explorer</a>
                <a href="/marketplace.html">Marketplace</a>
                <a href="/bridges.html">Bridges</a>
                <a href="/alerts.html">Alerts</a>
                <a href="/messages.html">Messages</a>
            </nav>
            <!-- aitbc-menu:end -->
            <h1>Search Results</h1>
        </header>

        <!-- aitbc-status:start -->
        <div class="status-strip" role="status" aria-live="polite"></div>
        <!-- aitbc-status:end -->

        <main id="main" tabindex="-1">
            <span id="sr-announcer" class="visually-hidden" role="status" aria-live="polite"></span>

        <div id="loading" class="loading">Searching...</div>

        <div id="content" style="display:none;">
            <div class="search-query">Query: <span id="query-display"></span></div>

            <div id="blocks-section" style="display:none;">
                <div class="section-title">Blocks</div>
                <div id="blocks-list"></div>
            </div>

            <div id="txs-section" style="display:none;">
                <div class="section-title">Transactions</div>
                <div id="txs-list"></div>
            </div>

            <div id="messages-section" style="display:none;">
                <div class="section-title">Messages</div>
                <div id="messages-list"></div>
            </div>
        </div>

        <div id="error" class="loading" style="display:none; color:#ef4444;"></div>
        </main>
        <!-- aitbc-footer:start -->
        <footer class="site-footer">
            <a href="https://github.com/oib/AITBC">GitHub</a>
            <a href="/llms.txt">llms.txt</a>
            <a href="/openapi.json">Coordinator API</a>
            <a href="/explorer-api/openapi.json">Explorer API</a>
        </footer>
        <!-- aitbc-footer:end -->
    </div>

    <script>
        const EXPLORER_API_URL = '/explorer-api';

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function getParam(name) {
            return new URL(window.location.href).searchParams.get(name);
        }


        function addrLink(addr) {
            if (!addr || addr === 'N/A') return 'N/A';
            return `<a href="/search.html?query=${encodeURIComponent(addr)}" class="clickable-value">${escapeHtml(addr)}</a>`;
        }

        function hashLink(hash) {
            if (!hash || hash === 'N/A') return 'N/A';
            return `<a href="/tx.html?hash=${encodeURIComponent(hash)}">${escapeHtml(hash)}</a>`;
        }

        function dirBadge(tx, searchedAddr) {
            if (!searchedAddr) return '';
            const s = (tx.sender || '').toLowerCase();
            const r = (tx.recipient || '').toLowerCase();
            const a = searchedAddr.toLowerCase();
            let dir = '';
            if (s === a && r === a) dir = 'self';
            else if (s === a) dir = 'out';
            else if (r === a) dir = 'in';
            if (!dir) return '';
            const labels = { out: 'OUT &rarr;', in: 'IN &larr;', self: 'SELF &orarr;' };
            return `<span class="dir-badge dir-${dir}">${labels[dir]}</span>`;
        }

        async function loadSearch() {
            const query = getParam('query') || getParam('search') || '';
            if (!query) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').textContent = 'Missing search query';
                document.getElementById('error').style.display = 'block';
                return;
            }

            // Smart redirect for block heights and hashes
            const cleanQuery = query.replace(/^#/, '');
            const isNumber = /^\d+$/.test(cleanQuery);
            const isHash = /^(0x)?[a-fA-F0-9]{64}$/.test(cleanQuery);

            if (isNumber) {
                location.href = `/block.html?height=${cleanQuery}`;
                return;
            }
            if (isHash) {
                location.href = `/tx.html?hash=${encodeURIComponent(cleanQuery)}`;
                return;
            }

            document.title = `Search: ${query}`;
            document.getElementById('query-display').textContent = query;

            try {
                const [txResp, blockResp, msgResp] = await Promise.all([
                    fetch(`${EXPLORER_API_URL}/api/transactions/search?address=${encodeURIComponent(query)}&limit=50`),
                    fetch(`${EXPLORER_API_URL}/api/blocks/by-address/${encodeURIComponent(query)}?limit=50`),
                    // MSG-17: body-text search over the messaging index. A
                    // failed search degrades to no section, not a page error.
                    fetch(`${EXPLORER_API_URL}/api/messages/search?q=${encodeURIComponent(query)}&limit=50`).catch(() => null),
                ]);
                const txData = await txResp.json();
                const blockData = await blockResp.json();
                const msgData = msgResp && msgResp.ok ? await msgResp.json() : {};
                const txs = txData.transactions || [];
                const blocks = blockData.blocks || [];
                const messages = msgData.messages || [];

                if (txs.length === 0 && blocks.length === 0 && messages.length === 0) {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('error').textContent = 'No transactions, blocks or messages found for this query.';
                    document.getElementById('error').style.display = 'block';
                    return;
                }

                if (blocks.length > 0) {
                    document.getElementById('blocks-section').style.display = 'block';
                    document.getElementById('blocks-list').innerHTML = blocks.map(b => `
                        <div class="endpoint fade-in block-item" style="cursor:pointer;padding:0;" tabindex="0" role="link" onkeydown="if(event.key==='Enter'&&event.target===this)this.click()" onclick="location.href='/block.html?height=${encodeURIComponent(b.height)}'">
                            <table class="block-list-table" aria-label="Result details">
                                <tr><th scope="row">Height</th><td><span class="badge badge-primary">BLOCK</span> #${escapeHtml(b.height)}</td></tr>
                                <tr><th scope="row">Hash</th><td>${escapeHtml(b.hash || 'N/A')} ${aitbcCopyBtn(b.hash || '', 'block hash')}</td></tr>
                                <tr><th scope="row">Proposer</th><td>${addrLink(b.proposer)}</td></tr>
                                <tr><th scope="row">Transactions</th><td>${escapeHtml(b.txCount || 0)}</td></tr>
                                <tr><th scope="row">Timestamp</th><td>${escapeHtml(b.timestamp ? new Date(b.timestamp).toLocaleString() : 'N/A')}</td></tr>
                            </table>
                        </div>
                    `).join('');
                }

                if (txs.length > 0) {
                    document.getElementById('txs-section').style.display = 'block';
                    document.getElementById('txs-list').innerHTML = txs.map(tx => {
                        const dBadge = dirBadge(tx, query);
                        return `
                        <div class="endpoint fade-in block-item" style="cursor:pointer;padding:0;" tabindex="0" role="link" onkeydown="if(event.key==='Enter'&&event.target===this)this.click()" onclick="location.href='/tx.html?hash=${encodeURIComponent(tx.tx_hash)}'">
                            <table class="block-list-table" aria-label="Result details">
                                <tr><th scope="row">Type</th><td><span class="badge badge-primary">${escapeHtml(tx.type || 'TX')}</span> ${dBadge}</td></tr>
                                <tr><th scope="row">Hash</th><td>${escapeHtml(tx.tx_hash || 'N/A')} ${aitbcCopyBtn(tx.tx_hash || '', 'transaction hash')}</td></tr>
                                <tr><th scope="row">From</th><td>${addrLink(tx.sender)}</td></tr>
                                <tr><th scope="row">To</th><td>${addrLink(tx.recipient)}</td></tr>
                                <tr><th scope="row">Block</th><td><a href="/block.html?height=${encodeURIComponent(tx.block_height)}">${escapeHtml(tx.block_height)}</a></td></tr>
                                <tr><th scope="row">Status</th><td>${escapeHtml(tx.status || 'N/A')}</td></tr>
                                <tr><th scope="row">Time</th><td>${escapeHtml(tx.created_at ? new Date(tx.created_at).toLocaleString() : 'N/A')}</td></tr>
                            </table>
                        </div>
                        `;
                    }).join('');
                }

                if (messages.length > 0) {
                    // MSG-17: chain-sourced text renders through DOM APIs only
                    // (textContent/attributes) — the same rule as messages.js.
                    const NEUTRAL_RE = /[\u0080-\u009F\p{Cf}\u061C\u180E\u{E0000}-\u{E007F}\u{E0100}-\u{E01EF}\u3164\u115F\u1160\uFFA0\u2800]/gu;
                    const clean = (s) => String(s).replace(NEUTRAL_RE, (ch) => `[U+${ch.codePointAt(0).toString(16).toUpperCase().padStart(4, '0')}]`);
                    const make = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
                    const list = document.getElementById('messages-list');
                    list.textContent = '';
                    messages.forEach((m) => {
                        const item = make('div', 'msg-item');
                        const head = make('div', 'msg-item-head');
                        const topicLink = make('a', 'msg-topic-chip', clean(m.topic || ''));
                        topicLink.href = `/topic.html?t=${encodeURIComponent(m.topic || '')}`;
                        head.appendChild(topicLink);
                        head.appendChild(make('span', 'msg-kind', clean(m.kind || 'post')));
                        const author = m.author || m.sender || '';
                        const authorLink = make('a', 'clickable-value msg-author', clean(author));
                        authorLink.href = `/author.html?a=${encodeURIComponent(author)}`;
                        head.appendChild(authorLink);
                        const time = m.timestamp || m.created_at || '';
                        head.appendChild(make('span', 'msg-time', time ? new Date(time).toLocaleString() : ''));
                        item.appendChild(head);
                        item.appendChild(make('div', 'msg-body', clean(m.body || '')));
                        const hashLine = make('div', 'msg-hash');
                        const txLink = make('a', 'clickable-value', `${(m.tx_hash || '').substring(0, 18)}…`);
                        txLink.href = `/tx.html?hash=${encodeURIComponent(m.tx_hash || '')}`;
                        hashLine.appendChild(txLink);
                        item.appendChild(hashLine);
                        list.appendChild(item);
                    });
                    document.getElementById('messages-section').style.display = 'block';
                }

                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            } catch (err) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').textContent = err.message || 'Search failed';
                document.getElementById('error').style.display = 'block';
            }
        }

        document.addEventListener('DOMContentLoaded', loadSearch);
    </script>
</body>
</html>
