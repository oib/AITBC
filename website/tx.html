<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Detail — AITBC</title>
    <meta name="robots" content="noindex">
    <meta name="description" content="Transaction detail for the AITBC explorer: hash, sender, recipient, amount, and status of a single transaction.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=54e0f6ab8d33cc93">
    <link rel="stylesheet" href="/style.css?v=54e0f6ab8d33cc93">
    <style>
        .detail-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }
        .detail-header h2 {
            margin: 0;
        }
        #tx-hash-display {
            display: inline-block;
            max-width: 100%;
            overflow-wrap: break-word;
            word-break: break-all;
        }
        .payload-box {
            background: var(--code);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1rem;
            overflow-x: auto;
        }
        .payload-box pre {
            margin: 0;
            font-size: 0.8rem;
            color: var(--text);
        }
        .clickable-value {
            cursor: pointer;
            color: var(--primary);
        }
        .clickable-value:hover {
            text-decoration: underline;
        }
    </style>
<script src="copy.js?v=54e0f6ab8d33cc93" defer></script>
<script src="status.js?v=54e0f6ab8d33cc93" defer></script>
</head>
<body>
    <!-- aitbc-skip:start -->
    <a href="#main" class="skip-link">Skip to content</a>
    <!-- aitbc-skip:end -->
    <div class="container">
        <noscript><p class="endpoint-note">This page renders live data via JavaScript. Machine-readable sources: <a href="/llms.txt">llms.txt</a> &middot; <a href="/openapi.json">Coordinator API</a> &middot; <a href="/explorer-api/openapi.json">Explorer API</a>.</p></noscript>
        <header>
            <!-- aitbc-menu:start -->
            <nav class="header-nav" aria-label="Main">
                <a href="/">Home</a>
                <a href="/exchange.html">Exchange</a>
                <a href="/explorer.html">Explorer</a>
                <a href="/marketplace.html">Marketplace</a>
                <a href="/bridges.html">Bridges</a>
                <a href="/alerts.html">Alerts</a>
                <a href="/messages.html">Messages</a>
            </nav>
            <!-- aitbc-menu:end -->
            <h1>Transaction Detail</h1>
        </header>

        <!-- aitbc-status:start -->
        <div class="status-strip" role="status" aria-live="polite"></div>
        <!-- aitbc-status:end -->

        <main id="main" tabindex="-1">
            <span id="sr-announcer" class="visually-hidden" role="status" aria-live="polite"></span>

        <div id="loading" class="loading">Loading transaction...</div>
        <div id="content" style="display:none;">
            <div class="detail-header">
                <span class="badge badge-primary" id="tx-type-badge">TX</span>
                <span id="tx-hash-display" style="font-size:0.8rem;color:var(--text-muted);font-family:var(--font-mono);"></span>
            </div>

            <div id="tx-details"></div>

            <div class="card" id="payload-card" style="display:none;margin-top:1.5rem;">
                <h2>Payload</h2>
                <div class="payload-box"><pre id="payload-content"></pre></div>
            </div>
        </div>

        <div id="error" class="loading" style="display:none; color:#ef4444;"></div>
        </main>
        <!-- aitbc-footer:start -->
        <footer class="site-footer">
            <a href="https://github.com/oib/AITBC">GitHub</a>
            <a href="/llms.txt">llms.txt</a>
            <a href="/openapi.json">Coordinator API</a>
            <a href="/explorer-api/openapi.json">Explorer API</a>
        </footer>
        <!-- aitbc-footer:end -->
    </div>

    <script>
        const EXPLORER_API_URL = '/explorer-api';

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function getParam(name) {
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }


        function plainHash(hash) {
            if (!hash || hash === 'N/A') return 'N/A';
            return `<span style="font-family:var(--font-mono);">${escapeHtml(hash)}</span>`;
        }

        function addrLink(addr) {
            if (!addr || addr === 'N/A') return 'N/A';
            return `<a href="/search.html?query=${encodeURIComponent(addr)}" class="clickable-value" title="Search address">${escapeHtml(addr)}</a>`;
        }

        async function loadTransaction() {
            const hash = getParam('hash');

            if (!hash) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').textContent = 'Missing transaction hash parameter';
                document.getElementById('error').style.display = 'block';
                return;
            }

            try {
                const resp = await fetch(`${EXPLORER_API_URL}/api/transactions/${hash}`);
                const data = await resp.json();

                if (!data || !data.hash) {
                    // Not a tx hash — try as block hash and redirect if found
                    const blockResp = await fetch(`${EXPLORER_API_URL}/api/blocks/by-hash/${hash}`);
                    const blockData = await blockResp.json();
                    if (blockData && blockData.height) {
                        location.href = `/block.html?height=${blockData.height}`;
                        return;
                    }
                    throw new Error('No transaction or block found for this hash');
                }

                document.title = `AITBC TX ${data.hash.substring(0, 16)}...`;
                document.getElementById('tx-type-badge').textContent = data.type || 'TX';
                document.getElementById('tx-hash-display').textContent = data.hash;

                const details = [
                    { label: 'Type', value: `<span class="badge badge-primary">${escapeHtml(data.type || 'TX')}</span>` },
                    { label: 'Hash', value: plainHash(data.hash) + ' ' + aitbcCopyBtn(data.hash, 'transaction hash') },
                    { label: 'Status', value: escapeHtml(data.status || 'Unknown') },
                    { label: 'Block', value: `<a href="/block.html?height=${encodeURIComponent(data.block_height)}">#${escapeHtml(data.block_height)}</a>` },
                    { label: 'From', value: addrLink(data.from || data.sender) + ' ' + aitbcCopyBtn(data.from || data.sender || '', 'sender address') },
                    { label: 'To', value: addrLink(data.to || data.recipient) + ' ' + aitbcCopyBtn(data.to || data.recipient || '', 'recipient address') },
                    { label: 'Value', value: escapeHtml(data.value !== undefined ? data.value : 'N/A') },
                    { label: 'Fee', value: escapeHtml(data.fee !== undefined ? data.fee : 'N/A') },
                    { label: 'Nonce', value: escapeHtml(data.nonce !== undefined ? data.nonce : 'N/A') },
                    { label: 'Timestamp', value: escapeHtml(data.created_at ? new Date(data.created_at).toLocaleString() : 'N/A') },
                ];

                // MSG-4: forum posts surface a badge linking to their topic;
                // non-forum MESSAGE rows (e.g. bridge internals) show nothing.
                // The badge requires a plausible envelope shape, not merely the
                // namespace key — a stray {aitbc_msg: {...}} sibling stays inert.
                const msg = data.payload && typeof data.payload === 'object' ? data.payload.aitbc_msg : null;
                const forumLike = msg && typeof msg === 'object' && msg.v === 1
                    && (msg.kind === 'post' || msg.kind === 'reply')
                    && typeof msg.topic === 'string';
                if (data.type === 'MESSAGE' && forumLike) {
                    // MSG-4b: the topic is chain text — make format/C1/tag
                    // chars visible before it reaches the DOM (same rule as
                    // messages.js).
                    const NEUTRAL_RE = /[\u0080-\u009F\p{Cf}\u061C\u180E\u{E0000}-\u{E007F}]/gu;
                    const cleanTopic = String(msg.topic).replace(NEUTRAL_RE, (ch) => `[U+${ch.codePointAt(0).toString(16).toUpperCase().padStart(4, '0')}]`);
                    details.push({
                        label: 'Forum',
                        value: `<a class="badge badge-primary" href="/topic.html?t=${encodeURIComponent(cleanTopic)}" title="Open topic">${escapeHtml('forum ' + msg.kind + ': ' + cleanTopic)}</a>`,
                    });
                }

                document.getElementById('tx-details').innerHTML = `
                    <div class="endpoint fade-in block-item" style="padding:0;">
                        <table class="block-list-table" aria-label="Transaction details">
                            ${details.map(d => `<tr><th scope="row">${d.label}</th><td>${d.value}</td></tr>`).join('')}
                        </table>
                    </div>
                `;

                if (data.payload) {
                    let payloadText;
                    try {
                        payloadText = JSON.stringify(typeof data.payload === 'string' ? JSON.parse(data.payload) : data.payload, null, 2);
                    } catch (e) {
                        payloadText = String(data.payload);
                    }
                    document.getElementById('payload-content').textContent = payloadText;
                    document.getElementById('payload-card').style.display = 'block';
                }

                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            } catch (err) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').textContent = err.message || 'Failed to load transaction';
                document.getElementById('error').style.display = 'block';
            }
        }

        document.addEventListener('DOMContentLoaded', loadTransaction);
    </script>
</body>
</html>
